<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMO Idle</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(132, 112, 235, 0.55) rgba(8, 6, 22, 0.45);
      }

      *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      *::-webkit-scrollbar-track {
        background: rgba(8, 6, 22, 0.45);
      }

      *::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(185, 173, 255, 0.70), rgba(100, 85, 210, 0.62));
        border-radius: 999px;
      }

      *::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, rgba(216, 210, 255, 0.88), rgba(132, 112, 235, 0.78));
      }

      *::-webkit-scrollbar-corner {
        background: transparent;
      }

      body {
        background: #050510;
        height: 100vh;
        overflow: hidden;
        display: flex;
      }

      /* ── Three-column layout ─────────────────────────────────────────────── */
      #app {
        display: flex;
        flex-direction: row;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebars are fixed-width, full-height, and scroll independently */
      #left-sidebar,
      #right-sidebar {
        width: 260px;
        min-width: 260px;
        flex-shrink: 0;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        /* These are the rails' real scroll containers, and they must LOOK it.
           The UI font scale applies `zoom` to their children, so a rail that
           fits at 100% overflows at any larger scale — with no scrollbar, the
           panels below the fold simply read as missing. (The thin scrollbar was
           previously put on the inner .sidebar-left, which cannot scroll: it is
           height:100% of this box.) */
        scrollbar-width: thin;
        scrollbar-color: var(--hud-edge-medium, #63553e) transparent;
      }

      #left-sidebar::-webkit-scrollbar,
      #right-sidebar::-webkit-scrollbar { width: 5px; }
      #left-sidebar::-webkit-scrollbar-track,
      #right-sidebar::-webkit-scrollbar-track { background: transparent; }
      #left-sidebar::-webkit-scrollbar-thumb,
      #right-sidebar::-webkit-scrollbar-thumb {
        background: var(--hud-edge-medium, #63553e);
        border-radius: 3px;
      }

      /* Dividing lines between sidebars and canvas */
      #left-sidebar  { border-right: 1px solid rgba(50, 50, 80, 0.6); }
      #right-sidebar { border-left:  1px solid rgba(50, 50, 80, 0.6); }

      /* Canvas area: takes remaining space, centers the Phaser canvas */
      #game-wrapper {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        background: #000;
        position: relative; /* anchor for #buff-overlay */
      }

      /* Buff bar overlay — sits on top of the Phaser canvas, pointer-events managed per-component */
      #buff-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Mobile HUD mount — hidden on desktop, covers canvas on mobile */
      #mobile-hud {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 15;
      }

      /* ── Mobile/tablet layout (≤ 1100px) ───────────────────────────── */
      @media (max-width: 1100px) {
        #left-sidebar,
        #right-sidebar   { display: none !important; }

        #auto-btn-overlay { display: none !important; }

        #mobile-hud { display: block; }

        /* Buff bar — fixed so it tracks the same bars as MobileHUD.
           Offsets derive from the --mhud-* chrome heights set in hud.css. */
        #buff-overlay {
          position: fixed !important;
          inset: unset !important;
          top: calc(var(--mhud-top-h, 66px) + env(safe-area-inset-top, 0px));
          bottom: calc(var(--mhud-bottom-h, 92px) + env(safe-area-inset-bottom, 0px));
          left: 0;
          right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left-sidebar"></div>
      <div id="game-wrapper">
        <div id="mobile-hud"></div>
        <div id="buff-overlay"></div>
        <div id="ability-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:12"></div>
        <div id="biome-xp-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:10"></div>
        <div id="boss-bar-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:11"></div>
        <div id="target-frame-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:11"></div>
        <div id="dungeon-altar-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:19"></div>
        <div id="auto-btn-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:20"></div>
        <div id="toast-overlay"></div>
        <div id="node-loading-overlay"></div>
        <div id="tab-resync-overlay"></div>
        <div id="death-overlay"></div>
        <div id="release-announcement-overlay"></div>
        <div id="emote-wheel-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:18"></div>
      </div>
      <div id="right-sidebar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
