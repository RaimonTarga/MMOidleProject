<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMO Idle</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #050510;
        height: 100vh;
        overflow: hidden;
        display: flex;
      }

      /* ── Three-column layout ─────────────────────────────────────────────── */
      #app {
        display: flex;
        flex-direction: row;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebars are fixed-width, full-height, and scroll independently */
      #left-sidebar,
      #right-sidebar {
        width: 260px;
        min-width: 260px;
        flex-shrink: 0;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* Dividing lines between sidebars and canvas */
      #left-sidebar  { border-right: 1px solid rgba(50, 50, 80, 0.6); }
      #right-sidebar { border-left:  1px solid rgba(50, 50, 80, 0.6); }

      /* Canvas area: takes remaining space, centers the Phaser canvas */
      #game-wrapper {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        background: #000;
        position: relative; /* anchor for #buff-overlay */
      }

      /* Buff bar overlay — sits on top of the Phaser canvas, pointer-events managed per-component */
      #buff-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="left-sidebar"></div>
      <div id="game-wrapper">
        <div id="buff-overlay"></div>
        <div id="auto-btn-overlay" style="position:absolute;inset:0;pointer-events:none;z-index:20"></div>
      </div>
      <div id="right-sidebar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
