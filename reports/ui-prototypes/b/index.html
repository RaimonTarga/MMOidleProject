<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Is The HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14120f; --panel: #1d1a16; --panel2: #24201a; --inset: #100e0b;
  --ink: #ece4d4; --ink2: #bfb5a2; --ink3: #8a8170; --ink4: #5f584c;
  --gold: #d9b25c; --gold2: #f0cf7f; --edge: #3b342a; --edge2: #4d4434;
  --danger: #e3685f; --ok: #9fdc6a;
  --f-display: 'Alegreya SC', Georgia, serif;
  --f-body: 'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0a08; color: var(--ink); font-family: var(--f-body); }
button { font: inherit; color: inherit; }

/* ── Prototype chrome (outside the game frame) ─────────────────────────── */
#app { display: flex; flex-direction: column; height: 100%; }
#bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid #2a251e; background: #12100d; flex-wrap: wrap; }
#bar .brand { font-family: var(--f-display); color: var(--gold2); font-size: 16px; margin-right: 6px; white-space: nowrap; }
#bar .brand small { color: var(--ink3); font-family: var(--f-body); font-size: 11px; margin-left: 6px; }
.seg { display: inline-flex; border: 1px solid #3a3228; border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; color: var(--ink2); border: 0; border-right: 1px solid #3a3228; padding: 6px 10px; font: 500 12px var(--f-body); cursor: pointer; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: #2e2619; color: var(--gold2); }
.seg button:hover { color: var(--ink); }
.tog { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); cursor: pointer; user-select: none; }
.tog input { accent-color: var(--gold); }
#main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #191611, #0b0a08 70%); }
#holder { position: relative; flex: none; }
#explain { width: 320px; flex: none; border-left: 1px solid #2a251e; background: #12100d; padding: 14px 16px 20px; overflow: auto; font-size: 12.5px; line-height: 1.5; color: var(--ink2); }
#explain h2 { font-family: var(--f-display); color: var(--gold2); font-size: 17px; margin: 0 0 2px; font-weight: 700; }
#explain h3 { font-family: var(--f-display); color: var(--ink); font-size: 14px; margin: 16px 0 4px; font-weight: 700; }
#explain p { margin: 4px 0 8px; }
#explain .q { color: var(--ink); font-style: italic; }
#explain ul { margin: 4px 0 8px; padding-left: 18px; }
#explain li { margin: 2px 0; }
#explain .ctl { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
#explain .ctl button, #explain .ctl select { background: #2a241b; border: 1px solid #4a3f2f; color: var(--ink); padding: 6px 10px; border-radius: 3px; font: 500 12px var(--f-body); cursor: pointer; }
#explain .ctl button.on { border-color: var(--gold); color: var(--gold2); background: #33291a; }
#explain .ctl button:hover { border-color: var(--gold); }
#explain .readout { font: 500 11.5px var(--f-mono); color: var(--ink3); margin-top: 4px; }
body.embed #bar, body.embed #explain { display: none; }
body.embed { background: #000; }
body.embed #stage { background: #000; }

/* ── The game frame ─────────────────────────────────────────────────────── */
#frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #050510; color: var(--ink); font-family: var(--f-body); font-size: 12px; line-height: 1.35; }
#frame.desktop { width: 1280px; height: 720px; }
#frame.portrait { width: 390px; height: 844px; }
#frame img.px { image-rendering: pixelated; }

/* Desktop rails, after client/index.html (#left-sidebar, #right-sidebar 260px). */
.d-left, .d-right { position: absolute; top: 0; width: 260px; height: 720px; padding: 8px; display: flex; flex-direction: column; gap: 7px; z-index: 5;
  background: linear-gradient(90deg, rgba(255,240,200,.03), transparent 7%, transparent 93%, rgba(0,0,0,.28)), linear-gradient(135deg, #241f18, #18140f 40%, #120f0b); }
.d-left { left: 0; border-right: 1px solid rgba(50,50,80,.6); }
.d-right { right: 0; border-left: 1px solid rgba(50,50,80,.6); }
.d-canvas { position: absolute; left: 260px; top: 0; width: 760px; height: 720px; overflow: hidden; }
.p-canvas { position: absolute; inset: 0; overflow: hidden; }
.rp { background: linear-gradient(180deg, #27221b, #1c1813); border: 1px solid #0d0b08; border-top-color: #4a4032; border-radius: 2px; padding: 8px 9px; }
.rp__title { font-family: var(--f-display); font-weight: 700; color: var(--gold2); font-size: 13px; margin: -1px 0 7px; display: flex; justify-content: space-between; align-items: center; }
.rp__title small { font-family: var(--f-body); font-weight: 500; font-size: 10px; color: var(--ink3); letter-spacing: .08em; text-transform: uppercase; }
.who { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.who .dot { width: 8px; height: 8px; border-radius: 50%; background: #5fd35f; box-shadow: 0 0 6px #5fd35f; }
.who small { color: var(--ink3); font-weight: 500; font-size: 11px; margin-left: auto; }
.hpbar { position: relative; height: 16px; border-radius: 3px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12); overflow: hidden; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #44ee44; transition: width .18s linear; }
.hpbar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 11px monospace; color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000; }
.statrows { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0 0; font-size: 11.5px; }
.statrows dt { color: var(--ink3); } .statrows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.levels { margin-top: 7px; font-size: 11px; color: var(--ink3); }
.levels b { color: var(--ink2); font-weight: 600; }
.collapsed-title { font-family: var(--f-display); font-weight: 700; color: var(--gold2); font-size: 13px; display: flex; justify-content: space-between; }
.collapsed-title span { color: var(--ink3); font-family: var(--f-body); font-size: 11px; }
.guide__chapter { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
.guide__line { margin: 5px 0 0; color: var(--ink); font-size: 12px; line-height: 1.48; }
.guide__line + .guide__line { margin-top: 6px; }
.ph { display: inline-block; padding: 0 5px; border: 1px dashed #8a7a55; color: #d8c48f; font: 500 11px var(--f-mono); border-radius: 2px; background: rgba(217,178,92,.06); }
.behav { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
.switch { width: 34px; height: 18px; border-radius: 9px; background: #3d5f2b; position: relative; border: 1px solid #5d8a42; }
.switch::after { content: ''; position: absolute; right: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #dff5c9; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 5px; background: linear-gradient(180deg, #2a241c, #1f1a14); border: 1px solid #0d0b08; border-top-color: #4a4032; }
.navb { display: flex; align-items: center; gap: 7px; padding: 6px 7px; background: #2b251c; border: 1px solid #3d3428; color: var(--ink); font: 500 12px var(--f-body); cursor: pointer; text-align: left; border-radius: 2px; position: relative; }
.navb svg { width: 18px; height: 18px; flex: none; color: #cbbd9d; }
.navb:hover { border-color: #6d5d40; }
.navb.on { border-color: var(--gold); color: var(--gold2); background: #352a19; box-shadow: inset 0 0 0 1px rgba(217,178,92,.25); }
.navb.on svg { color: var(--gold2); }
.navb.press { transform: translateY(1px); background: #4a3a1f; }
.mats { display: flex; flex-wrap: wrap; gap: 5px 10px; }
.mchip { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px var(--f-body); color: var(--ink); font-variant-numeric: tabular-nums; }
.mchip img { width: 16px; height: 16px; image-rendering: pixelated; }
.edot { width: 10px; height: 10px; border-radius: 50%; background: #8a7ea0; display: inline-block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.cdiamond { width: 9px; height: 9px; transform: rotate(45deg); background: #6b5a3a; display: inline-block; border: 1px solid #b89a5e; }

/* Portrait shell, after MobileHUD.tsx + hud.css (.mhud-*). */
.p-top { position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 40; background: #17140f; border-bottom: 1px solid #3b3326; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.p-top .dot { width: 8px; height: 8px; border-radius: 50%; background: #5fd35f; box-shadow: 0 0 6px #5fd35f; flex: none; }
.p-top .nm { font-weight: 600; font-size: 13px; }
.p-top .hpbar { flex: 1; height: 14px; }
.p-top .hpt { font: 700 11px monospace; color: var(--ink); white-space: nowrap; }
.p-top .zone { font-size: 10.5px; color: var(--ink3); white-space: nowrap; }
.p-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; z-index: 40; background: #17140f; border-top: 1px solid #4a4032; display: flex; flex-direction: column; }
.p-xp { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 10.5px; color: var(--ink3); border-bottom: 1px solid #2a241b; }
.p-xp .xpbar { flex: 1; height: 6px; background: #0e0c09; border: 1px solid #3a3226; border-radius: 3px; overflow: hidden; }
.p-xp .xpbar i { display: block; height: 100%; width: 38%; background: linear-gradient(90deg, #6d8f3e, #a5c75a); }
.p-tabs { flex: 1; display: flex; }
.ptab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: 0; color: var(--ink3); font: 500 9.5px var(--f-body); cursor: pointer; position: relative; }
.ptab svg { width: 20px; height: 20px; color: #a99c80; }
.ptab.on { color: var(--gold2); } .ptab.on svg { color: var(--gold2); }
.ptab.on::before { content: ''; position: absolute; top: 0; left: 18%; right: 18%; height: 2px; background: var(--gold); }
.ptab.press { background: rgba(217,178,92,.12); }
.p-auto { position: absolute; right: 14px; width: 60px; height: 60px; border-radius: 50%; z-index: 35; background: radial-gradient(circle at 40% 35%, #3f5a2c, #22311a); border: 2px solid #79a552; color: #e4f5d0; font: 700 10px var(--f-body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 4px 12px rgba(0,0,0,.6); }
.p-quest { position: absolute; right: 26px; width: 36px; height: 36px; border-radius: 50%; z-index: 35; background: #2a2418; border: 2px solid var(--gold); color: var(--gold2); font: 700 16px var(--f-body); display: flex; align-items: center; justify-content: center; }
.p-guide { position: absolute; left: 8px; right: 60px; top: 60px; z-index: 34; background: rgba(23,20,15,.95); border: 1px solid #4a4032; border-left: 3px solid var(--gold); padding: 7px 9px; border-radius: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.55); }
.p-guide .guide__line { font-size: 11.5px; line-height: 1.42; margin-top: 3px; }
.d-auto { position: absolute; right: 16px; bottom: 18px; width: 54px; height: 54px; border-radius: 50%; z-index: 26; background: radial-gradient(circle at 40% 35%, #3f5a2c, #22311a); border: 2px solid #79a552; color: #e4f5d0; font: 700 9.5px var(--f-body); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.6); }

/* ── The world ─────────────────────────────────────────────────────────── */
.world { position: absolute; inset: 0; overflow: hidden; }
.ground { position: absolute; inset: -30px;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .16  0 0 0 0 .22  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(ellipse 210px 70px at 18% 78%, rgba(9,18,16,.9), rgba(9,18,16,.6) 55%, transparent 72%),
    radial-gradient(ellipse 260px 90px at 84% 24%, rgba(9,20,18,.88), rgba(9,20,18,.55) 55%, transparent 72%),
    radial-gradient(ellipse 160px 52px at 62% 92%, rgba(10,22,19,.9), transparent 72%),
    radial-gradient(ellipse 120px 40px at 8% 22%, rgba(10,22,19,.85), transparent 72%),
    radial-gradient(circle at 45% 52%, #2c3823 0%, #222c1c 45%, #161c12 100%); }
.ground::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
.reeds { position: absolute; pointer-events: none; opacity: .75; }
.ent { position: absolute; width: 128px; height: 128px; margin-left: -64px; margin-top: -116px; pointer-events: none; }
.ent .shadow { position: absolute; left: 30px; right: 30px; bottom: 6px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.5); filter: blur(1.5px); }
.ent .body { position: absolute; inset: 0; transform-origin: 50% 92%; }
.ent .body img { width: 128px; height: 128px; image-rendering: pixelated; display: block; }
.ent .hb { position: absolute; left: 38px; right: 38px; height: 5px; background: rgba(0,0,0,.65); border: 1px solid rgba(0,0,0,.9); }
.ent .hb i { display: block; height: 100%; background: #d9443a; }
.ent.slinger .hb { top: -6px; } .ent.slinger .hb i { background: #4fd34f; }
.ent.mob .shadow { bottom: 18px; left: 22px; right: 22px; }
.ent.mob .hb { top: 46px; }
.ent .tgt { position: absolute; left: 26px; right: 26px; bottom: 0; height: 22px; border-radius: 50%; border: 2px solid rgba(255,90,70,.75); box-shadow: 0 0 8px rgba(255,90,70,.35); opacity: 0; }
.ent.small { transform: scale(.8); transform-origin: 50% 88%; }
.ent.tiny { transform: scale(.62); transform-origin: 50% 88%; }
.toad { position: absolute; left: 34px; right: 34px; bottom: 12px; height: 38px; border-radius: 50% 50% 44% 44%; background: radial-gradient(circle at 50% 30%, #95a55c, #778844 60%, #4f5a2c); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
.toad::before, .toad::after { content: ''; position: absolute; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: #c9d18a; box-shadow: inset 2px 2px 0 #222; }
.toad::before { left: 10px; } .toad::after { right: 10px; }
.bub { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #9be564; box-shadow: 0 0 6px #9be564; opacity: 0; }
.fx-poison { position: absolute; left: 34px; right: 34px; top: 54px; bottom: 16px; pointer-events: none; }
.fx-poison .bub { animation: bubble 1.6s ease-in infinite; }
.fx-poison .bub:nth-child(1) { left: 10%; animation-delay: 0s; }
.fx-poison .bub:nth-child(2) { left: 38%; animation-delay: .5s; width: 5px; height: 5px; }
.fx-poison .bub:nth-child(3) { left: 66%; animation-delay: .95s; }
.fx-poison .bub:nth-child(4) { left: 84%; animation-delay: 1.3s; width: 5px; height: 5px; }
@keyframes bubble { 0% { transform: translateY(40px) scale(.6); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-34px) scale(1.1); opacity: 0; } }
.fx-surge { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.fx-surge .ring { position: absolute; left: 50%; top: 82%; width: 120px; height: 46px; margin: -23px 0 0 -60px; border-radius: 50%; border: 3px solid #9be564; box-shadow: 0 0 16px #9be564, inset 0 0 12px rgba(155,229,100,.6); }
.fx-surge .col { position: absolute; left: 50%; bottom: 14px; width: 54px; margin-left: -27px; height: 120px; background: linear-gradient(0deg, rgba(155,229,100,.75), rgba(155,229,100,.25) 60%, transparent); filter: blur(2px); border-radius: 40% 40% 0 0; transform-origin: 50% 100%; }
.fx-surge .drop { position: absolute; width: 8px; height: 12px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #b9f58a; box-shadow: 0 0 6px #9be564; }
.fx-root { position: absolute; left: 4px; right: 4px; bottom: -6px; height: 54px; pointer-events: none; opacity: 0; overflow: visible; }
.fx-slow { position: absolute; left: 22px; right: 22px; bottom: 2px; height: 20px; border-radius: 50%; background: radial-gradient(ellipse, rgba(143,184,255,.42), transparent 70%); opacity: 0; }
.proj { position: absolute; inset: 0; pointer-events: none; z-index: 12; overflow: visible; }
.thread { position: absolute; inset: 0; pointer-events: none; z-index: 29; overflow: visible; }

/* Target frame, after TargetFrame.tsx + targetFrame.css. */
.tf { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 300px; padding: 7px 11px 8px; background: rgba(20,18,13,.94); border: 1px solid #3b3326; border-top-color: #5a4d38; box-shadow: 2px 2px 8px rgba(0,0,0,.6); font-family: monospace; z-index: 25; }
.portrait .tf { top: 60px; width: 270px; }
.tf__name { text-align: center; font: 700 13px monospace; color: var(--ink); margin-bottom: 4px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.tf__track { position: relative; height: 16px; border-radius: 4px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12); overflow: hidden; }
.tf__fill { height: 100%; background: #44ee44; border-radius: 3px; }
.tf__hp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 10.5px monospace; color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000; }
.tf__stats { display: flex; justify-content: center; gap: 12px; margin-top: 4px; font-size: 10px; color: var(--ink3); }
.tf__stats b { color: var(--ink2); }
.tf__tiles { display: flex; justify-content: center; gap: 10px; margin-top: 7px; min-height: 46px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; pointer-events: auto; cursor: help; }
.tile__f { position: relative; width: 32px; height: 32px; }
.tile__clip { position: absolute; inset: 0; border-radius: 6px; background: #11161d; overflow: hidden; }
.tile__clip img { width: 32px; height: 32px; image-rendering: pixelated; display: block; }
.tile__sweep { position: absolute; inset: 0; }
.tile__n { position: absolute; right: -7px; bottom: -4px; min-width: 18px; height: 16px; padding: 0 3px; border-radius: 8px; background: rgba(0,0,0,.82); border: 1px solid rgba(255,255,255,.55); font: 700 11px monospace; color: #fff; display: flex; align-items: center; justify-content: center; z-index: 2; }
.tile__l { font: 10px monospace; text-shadow: 1px 1px 0 #000; white-space: nowrap; }
.tip { position: absolute; z-index: 90; width: 230px; padding: 8px 10px; background: #1b1813; border: 1px solid #5a4d38; box-shadow: 0 8px 22px rgba(0,0,0,.6); font: 11.5px/1.45 var(--f-body); color: var(--ink2); pointer-events: none; }
.tip b { display: block; color: var(--ink); font-size: 12.5px; margin-bottom: 3px; }
.tip small { display: block; margin-top: 4px; color: var(--ink3); font-size: 10.5px; }

/* ── The hand: the two HUD cards (thesis B) ────────────────────────────── */
#handHost { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
#handHost .hand { pointer-events: auto; }
.hand { position: absolute; z-index: 30; display: flex; gap: 10px; align-items: flex-end; }
.desktop .hand { left: 50%; bottom: 14px; transform: translateX(-50%); }
.portrait .hand { left: 8px; right: 8px; bottom: 94px; flex-direction: column-reverse; align-items: stretch; gap: 6px; }
.portrait #handHost { z-index: 36; }
.hc { position: relative; flex: none; background: linear-gradient(180deg, rgba(40,35,27,.97), rgba(24,21,16,.97)); border: 1px solid #4d4434; border-radius: 3px; box-shadow: 0 8px 20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04); color: var(--ink); transform-origin: 50% 100%; cursor: pointer; text-align: left; }
.hc__bar { position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; background: var(--lane); border-radius: 3px 3px 0 0; }
.desktop .hc { width: 250px; padding: 10px 12px 12px; }
.desktop .hc--verb, .desktop .hc--empty { width: 318px; }
.hc__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.hc__name { font-family: var(--f-display); font-weight: 700; color: var(--lane); font-size: 15px; letter-spacing: .01em; line-height: 1.15; }
.hc__mark { margin-left: auto; font: 600 12px/1 var(--f-mono); color: var(--ink3); min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; }
.hc__mark.ready { color: var(--mc); font-size: 15px; }
.hc__sent { font-size: 12px; line-height: 1.45; color: #e7ddcc; }
.cl { text-decoration-line: underline; text-decoration-color: var(--c); text-decoration-thickness: 1.5px; text-underline-offset: 3px; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 1px; }
.hc__fuse { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.07); overflow: hidden; border-radius: 0 0 3px 3px; }
.hc__fuse i { display: block; height: 100%; width: 100%; background: var(--mc); transform-origin: 0 50%; }

<script>
(function () {
'use strict';

// ════════════════════════════════════════════════════════════════════════
// Data. Every card name, sentence, cost, colour and number on screen comes
// from window.UI_PROTO_DATA (reports/ui-prototypes/data.json).
// ════════════════════════════════════════════════════════════════════════
const D = window.UI_PROTO_DATA;
if (!D) { document.body.innerHTML = '<p style="color:#eee;padding:20px">../data.js did not load.</p>'; return; }
const DS = D.daggerScenes;
const P = D.packets;
const ART = (p) => (p ? '../../../' + p : null);
const PAGE = (k) => DS.pages.find((p) => p.key === k);
const COMPS = DS.compositionsT1Slinger;
const DAGGER = D.weapons.find((w) => w.lineageId === 'dagger');
const WD = DAGGER.t1Form.weaponDot;
const STATS = DS.playerStats;
const MOB = D.families.swamp.flatMap((f) => f.monsters).find((m) => m.id === 'bog-slime');
const BEAT = DS.tutorialBeats.find((b) => b.id === 'card:dagger-t1-affliction-payoff');
const T_POISON = D.statuses.target.find((s) => s.id === WD.effectId);
const T_SLOW = D.statuses.target.find((s) => s.id === 'ability-slowed');
const T_ROOT = D.statuses.target.find((s) => s.id === 'ability-rooted');
const SWAMP_NODES = D.nodes.filter((n) => n.biome === 'swamp');
const NODE = (id) => SWAMP_NODES.find((n) => n.id === id);
const HOME_NODE = NODE('node-t1-swamp-04');
const BIOME_NAME = (id) => (D.weapons.find((w) => w.homeBiome === id) || {}).homeBiomeName || id;
const FAMILY = (id) => D.families.swamp.find((f) => f.id === id);
const VERB_ID = 'dagger-t1-affliction-payoff';
const LEAN_AFF = 'dagger-t1-affliction-stat';
const LEAN_CTL = 'dagger-t1-control-stat';
const COMP = (verbId, leanId) => COMPS.find((c) => c.verbId === verbId && c.leanId === leanId);
const COMP_PURE = COMP(VERB_ID, LEAN_AFF);
const COMP_COMPOSED = COMP(VERB_ID, LEAN_CTL);
const MARK = D.rhythm.marks;
const HP_NOW = 171; // SCENES.md: "Current HP 171 / 193 in every combat scene."

// The prototype combat rule (SCENES.md) — a UI rule from the export's numbers,
// not the server's DoT formula.
const RULE = {
  swingMs: 500,                                   // SCENES: every 500 ms (1.98/s)
  attack: STATS.attack,                           // 26
  dose: STATS.attack * WD.convPct,                // 13, the Dagger's reservoir
  leanBleed: STATS.attack * 0.10,                 // 2.6, Coated Edge's light bleed (SCENES rule)
  tickMs: WD.tickIntervalMs,                      // 1 s
  capMs: COMP_PURE.trigger.capMs,                 // 5 s
  rootMs: COMP_COMPOSED.payoff.durationMs,        // 2 s
  slowMs: 500,                                    // "until your next swing"
  oozeHp: MOB.hp, oozeAtk: MOB.attack, oozeCd: MOB.attackCooldownMs,
};

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const keepUnits = (t) => esc(t).replace(/(\d) (s)(?=\W|$)/g, '$1&nbsp;$2');
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a.toFixed(3)})`; };
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const secs = (ms) => { const s = Math.ceil(Math.max(0, ms) / 100) / 10; return s < 10 ? s.toFixed(1) : String(Math.ceil(s)); };
const hpColor = (pct) => (pct > 50 ? '#44ee44' : pct > 25 ? '#eeaa22' : '#ee3322');

// Split a generated verb sentence into its moment half (the verb's lane) and its
// payload half (the lean's lane), using the packets' own moment phrase templates.
function clauses(c) {
  if (!c) return null;
  if (c.pure || c.momentColor === c.payloadColor) return [{ t: c.sentence, c: c.momentColor, k: 'w' }];
  const tpl = P[c.verbLane].momentPhrase.text;
  const re = new RegExp('^' + tpl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\\\{\w+\\\}/g, '[^)]*?'));
  const m = c.sentence.match(re);
  if (!m) return [{ t: c.sentence, c: c.momentColor, k: 'w' }];
  let mom = m[0]; let rest = c.sentence.slice(mom.length);
  if (rest.startsWith(',')) { mom += ','; rest = rest.slice(1); }

// ════════════════════════════════════════════════════════════════════════
// The fight: the SCENES.md combat rule as a deterministic simulation.
// ════════════════════════════════════════════════════════════════════════
function mkOoze(i, t0, gen) {
  return { i, gen: gen || 0, hp: RULE.oozeHp, owed: 0, slowUntil: -1, rootUntil: -1, dead: false, deadAt: null, bornAt: t0, nextAtk: t0 + (i === 0 ? 900 : 1900) };
}
class Sim {
  constructor(pair, respawn) {
    this.pair = pair; this.respawn = !!respawn;
    this.t = 0; this.hp = HP_NOW;
    this.oozes = [mkOoze(0, 0), mkOoze(1, 0)];
    this.target = 0; this.nextSwing = 0; this.nextTick = RULE.tickMs;
    this.capUntil = 0; this.fires = []; this.hits = []; this.atks = []; this.redoses = [];
    this.respawnAt = null; this.allDeadAt = null; this.healAt = null; this.healFrom = 0;
  }
  current() {
    const a = this.oozes[this.target];
    if (a && !a.dead) return a;
    const n = this.oozes.find((o) => !o.dead);
    if (n) this.target = n.i;
    return n || null;
  }
  nextEvent() {
    const c = [{ t: this.nextTick, k: 0 }, { t: this.nextSwing, k: 1 }];
    this.oozes.forEach((o) => { if (!o.dead) c.push({ t: o.nextAtk, k: 2, i: o.i }); });
    if (this.respawnAt != null) c.push({ t: this.respawnAt, k: 3 });
    c.sort((a, b) => a.t - b.t || a.k - b.k);
    return c[0];
  }
  kill(o, t) {
    o.dead = true; o.deadAt = t; o.owed = 0; o.hp = 0;
    if (this.oozes.every((x) => x.dead)) { this.allDeadAt = t; if (this.respawn) this.respawnAt = t + 1200; }
  }
  apply(ev) {
    const t = ev.t;
    if (ev.k === 0) {
      for (const o of this.oozes) {
        if (o.dead || o.owed <= 0) continue;
        const d = Math.min(o.owed, Math.ceil(o.owed / 4));
        o.owed -= d; if (o.owed < 0.05) o.owed = 0; o.hp -= d;
        if (o.hp <= 0) this.kill(o, t);
      }
      this.nextTick += RULE.tickMs;
    } else if (ev.k === 1) {
      this.nextSwing += RULE.swingMs;
      const o = this.current();
      if (!o) return;
      const afflicted = o.owed > 0;
      o.hp -= RULE.attack;
      o.owed += RULE.dose + (this.pair === 'pure' ? RULE.leanBleed : 0);
      if (this.pair === 'composed') o.slowUntil = t + RULE.slowMs;
      this.hits.push({ t, i: o.i });
      if (afflicted && t >= this.capUntil) {
        const before = o.owed;
        if (this.pair === 'pure') o.owed += o.owed; else o.rootUntil = t + RULE.rootMs;
        this.capUntil = t + RULE.capMs;
        this.fires.push({ t, i: o.i, n: this.fires.length + 1, before, after: o.owed });
      }
      if (o.hp <= 0) this.kill(o, t);
    } else if (ev.k === 2) {
      const o = this.oozes[ev.i]; o.nextAtk += RULE.oozeCd;
      if (o.dead) return;
      this.hp = Math.max(1, this.hp - RULE.oozeAtk); this.atks.push({ t, i: o.i });
    } else if (ev.k === 3) {
      this.oozes = this.oozes.map((o) => mkOoze(o.i, t, o.gen + 1));
      this.respawnAt = null; this.allDeadAt = null; this.target = 0;
      this.healAt = t; this.healFrom = this.hp; this.hp = HP_NOW;
    }
  }
  stepTo(T) {
    for (let g = 0; g < 20000; g++) { const ev = this.nextEvent(); if (!ev || ev.t > T) break; this.apply(ev); }
    this.t = T;
  }
  lastFire() { return this.fires.length ? this.fires[this.fires.length - 1] : null; }
}
function simKeyFrames(pair) {
  const dry = new Sim(pair, false); dry.stepTo(30000);
  const f = dry.fires[1] || dry.fires[0];
  // Off the swing instants, so no ordinary hit flash muddies a key frame.
  return { coming: f.t - 330, landed: f.t + 140, lasting: f.t + 950, end: (dry.allDeadAt || 12000) + 1500 };

function fireTimes(n) { const dry = new Sim('pure', true); dry.stepTo(n * 6000 + 8000); return dry.fires.slice(0, n).map((f) => f.t); }

function chipHTML(chip, state) {
  const short = chip.short && state !== 'locked';
  return `<span class="wp-chip${short ? ' wp-chip--short' : ''}" title="${esc(chip.title)}" data-f="cost:${esc(chip.amount + ' ' + chip.word)}">${esc(chip.amount)} <span class="wp-chip__word" style="${chip.color ? 'color:' + chip.color : ''}">${esc(chip.word)}</span></span>`;
}
function pageCardHTML(page, card, opts) {
  const o = opts || {};

  const isVerb = card.row === 'payoff' && card.tier === 1;
  let preview = false;
  if (isVerb) {
    const leanId = o.previewLean || page.progress.active.stat;
    const c = COMP(card.id, leanId) || COMPS.find((x) => x.verbId === card.id && x.sentence === card.sentence);
    if (c) {
      sentence = clauseHTML(clauses(c), 'sentence:' + card.name + (clauses(c).length > 1 ? ' two-colour' : ''));

    ? `<span class="wp-prev${o.previewLean === card.id ? ' on' : ''}" data-preview="${card.id}">${o.previewLean === card.id ? '◉ Previewing' : '◎ Preview'}</span>` : '';

/** The weapon page as a live object: buy, toasts, lean preview, flight to the hand. */
class PageCtl {
  constructor(root, opts) { this.root = root; this.opts = opts || {}; this.key = 'scene2'; this.preview = null; this.toastTimer = null; }
  page() { return PAGE(this.key); }
  render() {
    const host = $('#pageHost', this.root);
    const keepScroll = $('#pgScroll', this.root) ? $('#pgScroll', this.root).scrollTop : 0;
    host.innerHTML = pageHTML(this.page(), { previewLean: this.preview });
    if ($('#pgScroll', this.root)) $('#pgScroll', this.root).scrollTop = keepScroll;
    const handHost = $('#handHost', this.root);
    if (handHost && S.view === 'desktop') handHost.innerHTML = handHTML(this.page(), this.preview);
    this.wire();
  }
  wire() {
    $$('[data-card]', this.root).forEach((b) => {
      b.addEventListener('click', (e) => {
        if (e.target.closest('[data-preview]')) return;
        this.press(b.dataset.card);
      });
      const card = this.cardById(b.dataset.card);
      if (card && card.isLean && S.view === 'desktop') {
        b.addEventListener('mouseenter', () => { if (this.preview !== card.id) { this.preview = card.id; this.render(); } });
        b.addEventListener('mouseleave', () => { if (this.preview) { this.preview = null; this.render(); } });
      }
    });
    $$('[data-preview]', this.root).forEach((b) => b.addEventListener('click', () => this.togglePreview(b.dataset.preview)));
    const x = $('[data-close]', this.root); if (x && this.opts.onClose) x.addEventListener('click', this.opts.onClose);
  }
  cardById(id) { for (const b of this.page().bands) for (const r of b.rows) for (const c of r.cards) if (c.id === id) return c; return null; }
  togglePreview(id) { this.preview = this.preview === id ? null : id; this.render(); }
  setPreview(id) { this.preview = id; this.render(); }
  toast(text, warn) {
    let t = $('#toast', this.root);
    if (!t) { t = document.createElement('div'); t.id = 'toast'; this.root.appendChild(t); }
    t.className = 'toast' + (warn ? ' toast--warn' : ''); t.textContent = text; t.setAttribute('data-f', 'toast:' + text); t.style.display = '';
    clearTimeout(this.toastTimer); this.toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
  }
  press(id) {
    const card = this.cardById(id); if (!card) return;
    const btn = $(`[data-card="${id}"]`, this.root);
    if (btn) { btn.classList.add('wp-card--press'); setTimeout(() => btn && btn.classList.remove('wp-card--press'), 160); }
    if (card.action === 'buy' && id === VERB_ID) this.buyVerb(btn);
    else if (card.action === 'buy') this.toast('[prototype] Only Into the Wound’s purchase is wired here (SCENES.md).', true);
    else if (card.action === 'toast' && card.reason) this.toast(card.reason, true);
  }
  buyVerb(btn) {
    // The bought card flies to its slot in the hand: what you buy is what your HUD shows.
    const target = $(handVerbSel(true), frameEl);
    if (btn && target) {
      const fr = frameEl.getBoundingClientRect(); const s = fr.width / frameEl.offsetWidth;
      const a = btn.getBoundingClientRect(); const b = target.getBoundingClientRect();
      const fly = btn.cloneNode(true); fly.classList.add('fly'); fly.removeAttribute('data-card');
      $$('[data-f]', fly).forEach((n) => n.removeAttribute('data-f'));
      Object.assign(fly.style, { left: (a.left - fr.left) / s + 'px', top: (a.top - fr.top) / s + 'px', width: a.width / s + 'px', height: a.height / s + 'px', margin: 0 });
      frameEl.appendChild(fly);
      const dx = (b.left + b.width / 2 - (a.left + a.width / 2)) / s; const dy = (b.top + b.height / 2 - (a.top + a.height / 2)) / s;
      const anim = fly.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 40}px) scale(1.05)`, opacity: 1, offset: 0.45 }, { transform: `translate(${dx}px, ${dy}px) scale(${b.width / a.width})`, opacity: 0.2 }], { duration: 620, easing: 'cubic-bezier(.4,0,.2,1)' });
      anim.onfinish = () => fly.remove();
    }
    later(560, () => {
      this.key = 'scene2-after-buy'; this.preview = null; this.render();
      this.toast(DS.toasts.buyVerb, false);
      const v = $(handVerbSel(true), frameEl);
      if (v) v.animate([{ boxShadow: `0 0 0 2px ${P.affliction.color}, 0 0 28px ${P.affliction.color}` }, { boxShadow: '0 8px 20px rgba(0,0,0,.6)' }], { duration: 1400, easing: 'ease-out' });
    });
  }
}

const SLOT = { weapon: 'Weapon', armor: 'Armor', recovery: 'Recovery', mobility: 'Boots' };
function statLine(mods, page) {
  const lab = (k) => { const r = page.statSheet.rows.find((x) => x.key === k); return r ? r.label : k === 'evasion' ? 'Evasion' : k; };
  return Object.entries(mods).map(([k, v]) => (k === 'evasion' || k === 'damageReduction' ? `+${Math.round(v * 100)}% ${lab(k)}` : `+${v} ${lab(k)}`)).join(' · ');
}
function gearHTML(page) {
  const lean = page.bands[0].rows[0].cards.find((c) => c.id === page.progress.active.stat);
  const items = DS.gear.map((g) => {
    const meta = `${SLOT[g.slot]} · Tier ${g.tier} · ${BIOME_NAME(g.biome)}`;
    if (g.hasPage) {
      return `<li><button class="gi gi--weapon" id="gearWeapon"><img src="${ART(g.iconArt)}" alt=""><div><div class="gi__name">${esc(g.name)}</div><div class="gi__meta">${esc(meta)}</div><div class="gi__stats">${esc(statLine(g.statModifiers, page))}</div>
        <div class="gi__cards"><span class="gi__chip" style="--lane:${lean.laneColor}" data-f="name:${esc(lean.name)} (gear)">${esc(lean.name)}</span><span class="gi__chip gi__chip--empty" data-f="slot:verb empty (gear)">${esc(page.bands[0].rows[1].title)}</span></div></div>
        <span class="gi__go" data-f="door:opens its page">Page ›</span></button></li>`;
    }
    return `<li><div class="gi gi--plain"><img src="${ART(g.iconArt)}" alt=""><div><div class="gi__name">${esc(g.name)}</div><div class="gi__meta">${esc(meta)}</div><div class="gi__stats">${esc(statLine(g.statModifiers, page))}</div></div><span class="gi__plain" data-f="state:plain item, no page">Plain item</span></div></li>`;
  }).join('');
  const grip = S.view === 'portrait' ? '<div class="grip"></div>' : '';
  return `<div class="dlg gear" id="gear">${grip}<div class="dlg__head"><h2>Gear</h2><span class="dlg__sub">Worn items</span><button class="dlg__x" data-close-gear>✕</button></div><ul>${items}</ul></div>`;
}

/** Dim the HUD under a dialog. The desktop hand stays above the scrim: the sentence is always on screen. */

    setPair(p) {

      mountScene(true);

    },
    auto(on) { fight.playing = on; fight.runUntil = null; S.frame = null; },
    loop() {

      fight.onTime = (sim) => {
        if (sim.allDeadAt != null && sim.t > sim.allDeadAt + 1500) {

    explain() {

      <li><b>Landed</b>: the body (the poison surges / the target is shackled) and the card flashes, its payload half lit.</li>
      <li><b>Lasting</b>: the target frame — ONE Poison badge (damage still owed), plus Hamstrung and Bound in 3b.</li></ul>
      <div class="ctl"><button data-act="hit">Land a hit</button><button data-act="auto" class="${fight && fight.playing && !fight.runUntil ? 'on' : ''}">Auto-play</button><button data-act="restart">Restart fight</button></div>
      <div class="ctl"><button data-act="pure" class="${S.pair === 'pure' ? 'on' : ''}">3a Pure pair</button><button data-act="composed" class="${S.pair === 'composed' ? 'on' : ''}">3b Composed pair</button></div>

// ── Scene 4: a new card's first firings ──────────────────────────────────
// The teaching decrescendo: firing #1 rises highest and largest, #3 barely; #4 never.
const TEACH = {
  1: { dy: -112, pdy: -104, s: 1.36, hold: 2600 },
  2: { dy: -72, pdy: -66, s: 1.2, hold: 2000 },
  3: { dy: -34, pdy: -30, s: 1.08, hold: 1500 },
};
function scene4() {
  let fight = null; const fires = fireTimes(6);
  const ctl = {
    keyframe() { this.stepTo(S.step && S.step !== 1 ? S.step : 1, true); },
    render() {
      const page = PAGE('scene2-after-buy');
      fight = new Fight({ pair: 'pure', respawn: true });
      frameEl.innerHTML = shell({ page, guide: 'lesson', guideTop: 184, canvas: fight.canvasHTML(), handH: handHeight() });
      mountHand(page);
      fight.bind();
      ctl.guideDone = false;
      // Teaching for the first three firings, smaller each time; never again after.
      fight.teach = (sim, since, f) => {
        const v = fight.el.verb; const pips = fight.el.pips;
        let lift = 0; let n = 0;
        if (f && f.n <= 3) {
          const T = TEACH[f.n]; const up = 260; const down = 450;
          if (since < up) lift = since / up; else if (since < up + T.hold) lift = 1; else if (since < up + T.hold + down) lift = 1 - (since - up - T.hold) / down;
          lift = lift * lift * (3 - 2 * lift); n = f.n;
        }
        if (lift > 0) {
          const T = TEACH[n]; const desk = S.view === 'desktop';
          const s = desk ? 1 + (T.s - 1) * lift : 1 + 0.02 * lift;
          v.style.transform = `translateY(${(desk ? T.dy : T.pdy) * lift}px) scale(${s})`;
          v.style.zIndex = 5; v.style.opacity = 1;
          v.style.borderColor = rgba(COMP_PURE.payloadColor, 0.5 + 0.5 * lift);
          v.style.boxShadow = `0 14px 30px rgba(0,0,0,.7), 0 0 ${10 + 18 * lift}px ${rgba(COMP_PURE.payloadColor, 0.45 * lift)}`;
          v.setAttribute('data-f', `teach:card lifted (firing #${n} of 3)`);
          // While it is lifted the card keeps its sentence lit: this is what just happened.
          const flash = since < 900 ? 1 - since / 900 : 0;
          fight.el.cls.forEach((c) => {
            const col = c.classList.contains('cl--p') ? COMP_PURE.payloadColor : COMP_PURE.momentColor;
            c.style.backgroundColor = rgba(col, Math.max(0.2 * lift, flash * 0.55));
            c.style.textDecorationThickness = '2.5px';
          });
          pips.style.display = 'flex'; pips.style.opacity = lift;
          $$('i', pips).forEach((p, k) => p.classList.toggle('on', k < n));
          pips.setAttribute('data-f', `teach:pips ${n} of 3`);
          fight.threadAlpha = lift * 0.95; fight.threadTarget = f.i;
        } else {
          v.style.transform = ''; v.style.zIndex = ''; v.removeAttribute('data-f');
          pips.style.display = 'none'; pips.removeAttribute('data-f'); fight.threadAlpha = 0;
        }
        // The guide shows the purchase lesson while the teaching runs, then steps aside.
        const done = !!f && (f.n > 3 || (f.n === 3 && since > 260 + TEACH[3].hold + 450));
        if (ctl.guideDone !== done) {
          ctl.guideDone = done;
          const g = $('#guideCard');
          if (g && S.view === 'desktop') g.outerHTML = guideHTML(done ? 'collapsed' : 'lesson');
          else if (g) g.style.display = done ? 'none' : '';
        }
        if (ctl.counter !== (f ? f.n : 0)) { ctl.counter = f ? f.n : 0; const c = $('#fireCount'); if (c) c.textContent = ctl.counter ? `Firing #${ctl.counter}` : 'Bought a moment ago, never fired'; }
      };
      fight.paint();
    },
    update(dt) { if (fight) fight.update(dt); },
    stepTo(n, freeze) {
      const ft = fires[n - 1]; if (ft == null) return;
      S.step = n;
      const frame = n <= 3 ? 500 : 260;
      fight.seek(freeze ? ft + frame : ft - 900);
      if (!freeze) { fight.playing = true; fight.runUntil = ft + (n <= 3 ? 1600 : 900); }
    },
    next() { const cur = fight.sim.fires.length; this.stepTo(Math.min(cur + 1, fires.length), false); },
    loop() { fight.seek(0); fight.playing = true; fight.onTime = (sim) => { if (sim.fires.length >= 4 && sim.t > fires[3] + 2400) { fight.onTime = null; this.loop(); } }; },
    marks() {
      const f = fight.sim.lastFire(); const i = f ? f.i : 0;
      return ['#hcVerb', '#ooze' + i + ' .body', '#guideCard'];
    },
    explain() {
      return `<p class="q">What teaches the player what just happened, and when does it stop?</p>
      <p>The card itself. On each of the first three firings the verb card rises out of the hand with a thread to the body it hit — big on #1, smaller on #2, a nudge on #3 (the pips count 1–3 of 3). From #4 on, it only lights in place. The guide shows the purchase lesson while the teaching runs and steps aside after #3. No floating word.</p>
      <div class="ctl"><button data-act="next">Fire again</button><button data-act="s1">Firing #1</button><button data-act="s3">Firing #3</button><button data-act="s4">Firing #4</button><button data-act="restart">From the purchase</button></div>
      <p class="readout" id="fireCount">Bought a moment ago, never fired</p>
      <p class="readout">The lesson's “ring” line (tutorialBeats lesson.ring) describes a ring this thesis does not have; it shows as the placeholder [lesson.ring].</p>`;
    },
    act(a) {
      if (a === 'next') this.next(); if (a === 's1') this.stepTo(1, true); if (a === 's3') this.stepTo(3, true); if (a === 's4') this.stepTo(4, true);
      if (a === 'restart') { S.step = null; fight.seek(0); }
    },
  };
  return ctl;
}

// ── Scene 5: the node ────────────────────────────────────────────────────
function scene5() {
  let arrivedAt = 0; let clock = 0; let frozen = false;
  const ctl = {
    keyframe() { this.arrive(); clock = 1000; frozen = true; this.paint(); },
    bodiesHTML(node) {
      // Feet positions, clear of the banner band and the hand.
      const pos = S.view === 'desktop'
        ? [[470, 430], [590, 470], [680, 410], [520, 560], [400, 560], [650, 575], [60, 140], [710, 160], [300, 590], [140, 560]]
        : [[235, 470], [330, 455], [70, 200], [195, 560], [290, 560], [320, 200], [195, 178], [60, 590], [130, 612], [225, 625]];
      const seq = node.spawnCycle;
      return seq.map((fid, k) => {
        const fam = FAMILY(fid); const name = node.fieldedByFamily[fid][0]; const mon = fam.monsters.find((m) => m.name === name);
        const src = ART(D.art.monsters[mon.id]);
        const [x, y] = pos[k % pos.length];
        const inner = src ? `<img class="px" src="${src}" alt="">` : '<div class="toad"></div>';
        return `<div class="ent mob ${S.view === 'desktop' ? 'small' : 'tiny'}" style="left:${x}px;top:${y}px"><div class="shadow"></div><div class="body" style="animation:idleBob ${2 + (k % 4) * 0.35}s ease-in-out ${-k * 0.3}s infinite">${inner}</div></div>`;
      }).join('');
    },
    render() {
      const node = NODE(S.node); const page = PAGE('scene2-after-buy');
      const L = LAYOUT[S.view];
      const world = `<div class="world">${groundHTML(S.view)}${this.bodiesHTML(node)}<div class="ent slinger" id="slinger" style="left:${L.slinger[0] - (S.view === 'desktop' ? 60 : 30)}px;top:${L.slinger[1]}px"><div class="shadow"></div><div class="body"><img class="px" src="${ART(D.art.slingerSprite)}" alt=""></div><div class="hb"><i style="width:${(HP_NOW / STATS.maxHp) * 100}%"></i></div></div></div>`;
      const a = node.arrival.discovery;
      const banner = `<section class="arrival" id="arrival"><div class="arrival__eyebrow">New territory</div><h2>${esc(node.displayName)}</h2><div class="arrival__meta">${esc(node.biomeName)} · Tier ${node.tier}</div>
        <div class="arrival__terr" id="terr"><img src="${ART(P[a.shard].shardIcon)}" alt=""><b style="color:${P[a.shard].color};font-weight:600" data-f="where:${esc(a.territory)} (banner)">${esc(a.territory)}</b> · <span data-f="shard:${esc(a.detail)} (banner)">${esc(a.detail)}</span></div></section>`;
      frameEl.innerHTML = shell({ page, guide: 'collapsed', canvas: world + banner, handH: handHeight() });
      mountHand(page);
      this.node = node;
    },
    arrive() { arrivedAt = 0; clock = 0; frozen = false; },
    update(dt) { if (!frozen) clock += dt; this.paint(); },
    paint() {
      const node = this.node; if (!node) return;
      const t = clock - arrivedAt; const dur = D.arrival.durationsMs.discovery;
      const p = t / dur; let op = 0;
      if (p < 0.1) op = p / 0.1; else if (p <= 0.76) op = 1; else if (p < 1) op = 1 - (p - 0.76) / 0.24;
      const ban = $('#arrival'); if (ban) ban.style.opacity = op;
      const sl = $('#slinger'); if (sl) { const w = clamp01(t / 900); const L = LAYOUT[S.view]; const from = L.slinger[0] - (S.view === 'desktop' ? 220 : 120); sl.style.left = (from + (L.slinger[0] - from) * (1 - (1 - w) * (1 - w))) + 'px'; sl.querySelector('.body').style.transform = w < 1 ? `translateY(${-Math.abs(Math.sin(t / 90)) * 3}px)` : ''; }
      // B's only node move: the hand's cards in the node's shard colour catch the light as the banner names it.
      const g = t > 450 && t < 1900 ? Math.sin(Math.PI * (t - 450) / 1450) : 0;
      $$('#hand .hc').forEach((h) => {
        const lane = h.dataset.lane;
        const match = lane === node.shard;
        const bar = $('.hc__bar', h);
        if (bar) {
          bar.style.boxShadow = match && g > 0 ? `0 0 ${14 * g}px ${P[lane].color}` : ''; bar.style.filter = match && g > 0 ? `brightness(${1 + g})` : '';
          if (match && g > 0.1) bar.setAttribute('data-f', 'state:card glints in the node shard colour'); else bar.removeAttribute('data-f');
        }
      });
    },
    loop() {
      const order = ['node-t1-swamp-04', 'node-t1-swamp-02', 'node-t1-swamp-05'];
      let k = 0;
      const go = () => { S.node = order[k % order.length]; k++; mountScene(true); sc.arrive(); later(6800, go); };
      go();
    },
    marks() { return ['#arrival h2', '#terr', S.view === 'desktop' ? '#canvas .world .ent.mob' : '#canvas .world .ent.mob']; },
    explain() {
      const node = NODE(S.node);
      const shares = Object.entries(node.resolvedShares).map(([f, s]) => `${FAMILY(f).name} ${Math.round(s * 100)}% (${node.fieldedByFamily[f].join(', ')})`).join(' · ');
      return `<p class="q">Arriving in a Swamp node, what tells the player which family lives here and which shard it pays, before the first kill?</p>
      <p>The client's arrival banner (structural answer 3) names the family and the shard; the bodies in the node are drawn from its spawn cycle. B adds one small thing: as the banner names the shard, the HUD cards of that shard's colour catch the light. In Rootwall Marsh (Shackle, blue) nothing in the hand lights — the node pays for a card you do not hold.</p>
      <div class="ctl"><button data-act="arrive">Arrive</button>${SWAMP_NODES.filter((n) => ['node-t1-swamp-04', 'node-t1-swamp-02', 'node-t1-swamp-05'].includes(n.id)).map((n) => `<button data-act="n:${n.id}" class="${S.node === n.id ? 'on' : ''}">${esc(n.displayName)}</button>`).join('')}</div>
      <p class="readout">${esc(node.mapTileLabel)}</p><p class="readout">${esc(shares)}</p>
      <p class="readout">Mud Toad has no sprite (art.monsters["mud-toad"] is null): drawn as a plain shape.</p>`;
    },
    act(a) { if (a === 'arrive') { this.arrive(); } if (a.startsWith('n:')) { S.node = a.slice(2); writeHash(); mountScene(); sc.arrive(); } },
  };
  return ctl;
}

// ════════════════════════════════════════════════════════════════════════
// First-time overlay: three numbered markers, everything else dimmed.
// ════════════════════════════════════════════════════════════════════════
function refreshFirst() {
  let ft = $('#ft');
  if (!S.first || !sc || !sc.marks) { if (ft) ft.remove(); return; }
  if (!ft) { ft = document.createElement('div'); ft.id = 'ft'; ft.className = 'ft'; frameEl.appendChild(ft); }
  const fr = frameEl.getBoundingClientRect(); const s = fr.width / frameEl.offsetWidth;
  const W = frameEl.offsetWidth; const H = frameEl.offsetHeight;
  const holes = []; const nums = [];
  sc.marks().forEach((sel, k) => {
    const el = sel && frameEl.querySelector(sel); if (!el) return;
    const r = el.getBoundingClientRect(); if (r.width < 1) return;
    const pad = 6; const x = (r.left - fr.left) / s - pad; const y = (r.top - fr.top) / s - pad; const w = r.width / s + pad * 2; const h = r.height / s + pad * 2;
    holes.push(`M${x + 4} ${y}h${w - 8}a4 4 0 0 1 4 4v${h - 8}a4 4 0 0 1 -4 4h${-(w - 8)}a4 4 0 0 1 -4 -4v${-(h - 8)}a4 4 0 0 1 4 -4z`);
    nums.push(`<div class="ft__n" style="left:${Math.max(16, x)}px;top:${Math.max(16, y)}px">${k + 1}</div>`);
    nums.push(`<svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="none" stroke="#f0cf7f" stroke-width="2"/></svg>`);
  });
  ft.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path fill="rgba(4,3,2,.72)" fill-rule="evenodd" d="M0 0H${W}V${H}H0Z ${holes.join(' ')}"/></svg>${nums.join('')}`;
}

// ════════════════════════════════════════════════════════════════════════
// Mounting, chrome, loop
// ════════════════════════════════════════════════════════════════════════
const SCENES = [null, scene1, scene2, scene3, scene4, scene5];
const TITLES = ['', 'Finding the tree', 'The weapon page', 'A fight', 'First firings', 'The node'];
function mountScene(keepTimers) {
  if (!keepTimers) clearLater();
  frameEl.className = S.view;
  sc = SCENES[S.scene]();
  sc.render();
  fit();
  renderChrome();
  renderExplain();
  if (S.first && sc.keyframe) sc.keyframe();
  requestAnimationFrame(refreshFirst);
}
function start() {
  readHash();
  document.body.classList.toggle('embed', S.embed);
  mountScene();
  if (S.embed && !S.first && sc.loop) sc.loop();
  else if (!S.first && S.scene === 4 && S.step) sc.stepTo(S.step, true);
  else if (!S.first && S.scene === 5) sc.arrive();
}
function fit() {
  const stage = $('#stage'); const holder = $('#holder');
  const W = S.view === 'desktop' ? 1280 : 390; const H = S.view === 'desktop' ? 720 : 844;
  const pad = S.embed ? 0 : 24;
  const s = Math.min((stage.clientWidth - pad) / W, (stage.clientHeight - pad) / H, S.view === 'desktop' ? 1.25 : 1.4);
  frameEl.style.transform = `scale(${s})`;
  holder.style.width = W * s + 'px'; holder.style.height = H * s + 'px';
}
function renderChrome() {
  $('#sceneSeg').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button data-scene="${n}" class="${S.scene === n ? 'on' : ''}">${n} · ${TITLES[n]}</button>`).join('');
  $$('#viewSeg button').forEach((b) => b.classList.toggle('on', b.dataset.view === S.view));
  $('#firstTog').checked = S.first;
}
function renderExplain() {
  if (S.embed) return;
  $('#explain').innerHTML = `<h2>Scene ${S.scene} · ${TITLES[S.scene]}</h2>${sc.explain ? sc.explain() : ''}
    <h3>Thesis B</h3><p>The active lean and verb sit on the HUD as two small cards that light when they fire; no rings. The sentence the player bought is always on screen. The bet: players read the thing they chose, not an abstraction of it.</p>`;
  $$('#explain [data-act]').forEach((b) => b.addEventListener('click', () => { sc.act(b.dataset.act); if (S.scene !== 3 || !b.dataset.act.startsWith('k:')) renderExplain(); refreshFirst(); }));
}
$('#sceneSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-scene]'); if (!b) return; S.scene = +b.dataset.scene; S.frame = null; S.step = null; writeHash(); mountScene(); if (S.scene === 5) sc.arrive(); });
$('#viewSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (!b) return; S.view = b.dataset.view; writeHash(); mountScene(); if (S.scene === 5) sc.arrive(); });
$('#firstTog').addEventListener('change', (e) => { S.first = e.target.checked; writeHash(); mountScene(); if (!S.first && S.scene === 5) sc.arrive(); });
window.addEventListener('hashchange', start);
window.addEventListener('resize', () => { fit(); refreshFirst(); });

// Tooltips for target badges: hover on desktop, tap on portrait.
frameEl.addEventListener('pointerover', (e) => { const t = e.target.closest('[data-tip]'); if (t && S.view === 'desktop') showTip(t); });
frameEl.addEventListener('pointerout', (e) => { const t = e.target.closest('[data-tip]'); if (t) hideTip(); });
frameEl.addEventListener('click', (e) => { const t = e.target.closest('[data-tip]'); if (t && S.view === 'portrait') { if ($('#tip')) hideTip(); else showTip(t); } });
function showTip(tile) {
  const st = TIP_SRC[tile.dataset.tip]; if (!st || !st.help) return;
  hideTip();
  const fr = frameEl.getBoundingClientRect(); const s = fr.width / frameEl.offsetWidth; const r = tile.getBoundingClientRect();
  const tip = document.createElement('div'); tip.id = 'tip'; tip.className = 'tip';
  tip.innerHTML = `<b>${esc(st.help.title)}</b>${esc(st.help.help)}`;
  const W = frameEl.offsetWidth;
  tip.style.left = Math.min(W - 240, Math.max(8, (r.left - fr.left) / s - 100)) + 'px'; tip.style.top = ((r.bottom - fr.top) / s + 8) + 'px';
  frameEl.appendChild(tip);
}
function hideTip() { const t = $('#tip'); if (t) t.remove(); }

function tick(ts) {
  const dt = lastTs ? Math.min(100, ts - lastTs) : 16; lastTs = ts;
  if (sc && sc.update && !(S.first)) sc.update(dt);
  else if (sc && sc.update && S.first && S.scene !== 5) sc.update(0);
  if (S.first) refreshFirst();
  requestAnimationFrame(tick);
}

// Fact census, for NOTES.md: every visible card-related fact in the frame.
window.__facts = function () {
  const fr = frameEl.getBoundingClientRect(); const out = [];
  $$('[data-f]', frameEl).forEach((el) => {
    if (el.closest('.behind') || el.closest('.ft')) return;
    const r = el.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    if (r.bottom <= fr.top || r.top >= fr.bottom || r.right <= fr.left || r.left >= fr.right) return;
    let e = el; let ok = true;
    while (e && e !== frameEl) {
      const cs = getComputedStyle(e);
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.08) { ok = false; break; }
      if (e !== el && /(auto|scroll|hidden)/.test(cs.overflowY)) { const pr = e.getBoundingClientRect(); if (r.bottom <= pr.top + 2 || r.top >= pr.bottom - 2) { ok = false; break; } }
      e = e.parentElement;
    }
    if (ok) out.push(el.dataset.f);
  });
  return out;
};
window.__proto = { S, get sc() { return sc; }, mountScene };

const style = document.createElement('style');
style.textContent = '@keyframes idleBob { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-2px) scale(1.02,.98); } } .behind { filter: brightness(.55) saturate(.7); }';
document.head.appendChild(style);

start();
requestAnimationFrame(tick);
})();
</script>
