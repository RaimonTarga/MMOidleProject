<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body First, Book Second</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@400;500;700&family=Cinzel:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ── Tokens: the mockup's (bg/panel/ink/gold) and the client's HUD tier-1 set ── */
*{box-sizing:border-box}
:root{
  --bg:#14120f;--panel:#1d1a16;--ink:#ece4d4;--gold:#d9b25c;
  --mat-rail:rgba(14,12,9,.97);--mat-panel:#221f18;--mat-control:#2a2720;--mat-inset:#080706;
  --edge-light:#3e3a30;--edge-medium:#63553e;--edge-strong:#75664d;--edge-dark:#0c0a07;--divider:rgba(100,88,60,.4);
  --primary:#c8a860;--primary-strong:#e0c070;--text:#d2cbbb;--muted:#9a8f7a;--dim:#706758;
  --success:#65d184;--danger:#ef7463;--warning:#dfa844;
  --f-display:'Alegreya SC','Cinzel',Georgia,serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-word:'Cinzel','Palatino Linotype',Georgia,serif;--f-mono:ui-monospace,Consolas,monospace;
}
html,body{margin:0;height:100%;background:#0d0b09;color:var(--ink);font-family:var(--f-body)}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:#110e0b;border-bottom:1px solid #2e281f}
.tb-title{font-family:var(--f-display);font-size:17px;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:9px}
.tb-title b{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--gold);font-size:14px}
.tb-title span{color:var(--muted);font-family:var(--f-body);font-size:12px}
.seg{display:inline-flex;border:1px solid #3a3226;border-radius:3px;overflow:hidden}
.seg button{background:#1b1713;border:0;border-right:1px solid #3a3226;padding:6px 10px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:#2c2519;color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
.tb-check{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.tb-check input{accent-color:var(--gold)}
#stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
#frameHost{position:relative;overflow:hidden;min-height:0;background:radial-gradient(ellipse at 50% 40%,#1a1612,#0b0907 70%)}
#explain{border-left:1px solid #2e281f;background:#110e0b;overflow:auto;padding:14px 16px 24px;font-size:13px;line-height:1.5;color:var(--text)}
body.embed #toolbar,body.embed #explain{display:none}
body.embed #app{grid-template-rows:minmax(0,1fr)}
body.embed #stage{grid-template-columns:minmax(0,1fr)}
body.embed #frameHost{background:#0b0907}
@media (max-width:980px){#stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}#explain{border-left:0;border-top:1px solid #2e281f;max-height:42vh}}

/* explain panel */
.ex-thesis{border-left:2px solid var(--gold);padding:2px 0 2px 10px;color:var(--muted);font-size:12px;margin:0 0 14px}
.ex-thesis b{color:var(--ink);font-weight:600}
.ex h2{font-family:var(--f-display);font-weight:500;color:var(--gold);font-size:19px;margin:0 0 2px}
.ex .q{color:var(--ink);margin:0 0 12px;font-style:italic}
.ex h3{font-family:var(--f-display);font-weight:500;font-size:14px;color:var(--ink);margin:16px 0 6px;letter-spacing:.02em}
.ex ul{margin:0;padding-left:18px}.ex li{margin:3px 0}
.ex .ctl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ex .btn{background:#231e18;border:1px solid #4a4032;color:var(--ink);padding:6px 11px;font-size:12.5px;cursor:pointer;border-radius:3px}
.ex .btn:hover{border-color:var(--gold)}
.ex .btn.primary{background:#3a2f1d;border-color:var(--gold);color:#f3dfa6}
.ex .btn[aria-pressed=true]{background:#3a2f1d;border-color:var(--gold)}
.ex .counter{font-family:var(--f-display);font-size:15px;color:var(--gold);margin:4px 0}
.facts{margin-top:16px;padding:8px 10px;border:1px solid #3a3226;background:#16120e;font-size:12px;color:var(--muted)}
.facts b{color:var(--ink);font-size:15px}
.facts small{display:block;margin-top:4px;line-height:1.4}
.ex .small{font-size:11.5px;color:var(--muted)}
.ex code{font-size:11px;color:#cbbf9f}

/* ── The frame ───────────────────────────────────────────────────────────── */
#frame{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#000;font-family:var(--f-body);color:var(--text);box-shadow:0 0 0 1px #3a3328,0 24px 70px rgba(0,0,0,.65)}
#frame.desktop{width:1280px;height:720px}
#frame.portrait{width:390px;height:844px;border-radius:22px}
.world{position:relative;overflow:hidden;background:#0c120c}
.world canvas{position:absolute;left:0;top:0;display:block}
.wl{position:absolute;inset:0;pointer-events:none}
.dl{position:absolute;inset:0;pointer-events:none;z-index:40}
.dl>*{pointer-events:auto}

/* desktop shell (client: 260 | canvas | 260) */
.d-shell{display:grid;grid-template-columns:260px 760px 260px;height:720px}
.d-shell .world{height:720px}
.rail{background:var(--mat-rail);display:flex;flex-direction:column;gap:9px;padding:10px;overflow:hidden;font-size:12px}
.rail.l{border-right:1px solid rgba(50,50,80,.6)}.rail.r{border-left:1px solid rgba(50,50,80,.6)}
.panel{background:var(--mat-panel);border:1px solid var(--edge-light);border-right-color:#7d6630;border-bottom-color:#7d6630;padding:8px 10px}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-word);font-weight:600;font-size:12px;color:var(--primary-strong);letter-spacing:.04em}
.ptitle .chev{color:var(--muted);font-family:var(--f-body);font-size:11px}
.crown{display:flex;align-items:center;gap:7px;margin:8px 0 5px;font-family:var(--f-mono);font-size:12px}
.crown b{color:var(--success)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}
.hpbar{position:relative;height:16px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:#44ee44;border-radius:3px;transition:width .18s linear,background .3s}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font:700 10.5px var(--f-mono);color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000}
.headline{display:flex;align-items:baseline;gap:6px;margin-top:9px;padding:6px 8px;background:var(--mat-inset);border:1px solid var(--edge-light)}
.headline b{font:700 18px var(--f-mono);color:var(--ink)}.headline small{color:var(--muted);font-family:var(--f-mono)}.headline em{margin-left:auto;font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.1em}
.srail{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}
.srail span{display:flex;justify-content:space-between;padding:3px 6px;background:var(--mat-control);font:10.5px var(--f-mono);color:var(--muted)}
.srail b{color:var(--ink)}
.panel.coll .ptitle{color:var(--muted)}
.guide .gtop{display:flex;gap:3px;margin:7px 0 6px}.guide .gtop i{flex:1;height:3px;background:#3a3427}.guide .gtop i.on{background:var(--primary)}
.guide .chapter{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.guide .gline{margin:5px 0 8px;font-size:12.5px;line-height:1.45;color:var(--ink)}
.guide .gline.ph{border:1px dashed #6a5a3a;padding:4px 6px;color:#b9a77d;font-size:11px;margin-top:-2px}
.guide .gact{display:flex;gap:6px}
.tbtn{background:var(--mat-control);border:1px solid var(--edge-medium);color:var(--text);font-size:11.5px;padding:5px 12px;cursor:pointer}
.tbtn.primary{border-color:var(--primary-strong);color:var(--primary-strong);background:color-mix(in srgb,var(--primary) 18%,var(--mat-control))}
.mini{background:none;border:0;color:var(--muted);font-size:10.5px;cursor:pointer}
.guide.collapsed .gbody{display:none}
.rnav{display:flex;flex-direction:column;gap:3px}
.rn{display:flex;align-items:center;gap:9px;background:var(--mat-control);border:1px solid var(--edge-light);padding:6px 9px;font-size:12px;color:var(--text);cursor:pointer;text-align:left;position:relative}
.rn:hover{border-color:var(--primary)}
.rn .ic{width:20px;height:20px;display:grid;place-items:center;font-size:14px}
.rn .ic img{width:20px;height:20px;image-rendering:pixelated}
.rn.on{border-color:var(--primary-strong);background:color-mix(in srgb,var(--primary) 14%,var(--mat-control));color:var(--primary-strong)}
.mats .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mats .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 7px;background:var(--mat-inset);border:1px solid var(--edge-light);font:11px var(--f-mono);color:var(--muted)}
.mats .chip i{width:9px;height:9px;border-radius:2px;background:#9d6ad6;transform:rotate(45deg)}
.mats .chip b{color:var(--ink)}
.mats .note{font-size:10px;color:var(--dim);margin-top:5px}

/* world overlays (client positions) */
.tframe{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:300px;padding:7px 12px 8px;background:rgba(20,18,13,.94);border:1px solid var(--edge-light);border-right-color:var(--edge-dark);border-bottom-color:var(--edge-dark);box-shadow:2px 2px 8px rgba(0,0,0,.6);font-family:var(--f-mono);z-index:11}
.tframe .tn{text-align:center;font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.tframe .tt{position:relative;height:16px;border-radius:5px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);overflow:hidden}
.tframe .tt i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .15s linear}
.tframe .tt span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;text-shadow:1px 1px 0 #000}
.tframe .ts{display:flex;justify-content:center;gap:12px;margin-top:4px;font-size:10px;color:var(--muted)}.tframe .ts b{color:var(--text)}
.tframe.hide{display:none}
.bxp{position:absolute;top:12px;right:12px;width:196px;padding:6px 9px;background:rgba(20,18,13,.96);border:1px solid var(--edge-light);border-right-color:var(--edge-dark);border-bottom-color:var(--edge-dark);font:10.5px var(--f-mono);color:var(--muted);z-index:10}
.bxp .h{display:flex;justify-content:space-between}.bxp .h b{color:#7fbf6a}
.bxp .bar{height:5px;margin-top:4px;background:#000;border:1px solid #2c2a22}.bxp .bar i{display:block;height:100%;width:42%;background:linear-gradient(90deg,#4f8a3c,#7fbf6a)}
.dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;z-index:12}
.dock .slot{width:42px;height:42px;background:rgba(20,18,13,.9);border:1px solid var(--edge-light);border-right-color:var(--edge-dark);border-bottom-color:var(--edge-dark)}
.dock .auto{height:42px;padding:0 12px;background:var(--mat-control);border:1px solid var(--edge-medium);color:var(--primary-strong);font:700 11px var(--f-mono);letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.dock .auto.on{color:var(--success);background:var(--mat-inset);box-shadow:0 0 12px rgba(101,209,132,.15)}

/* arrival banner (client area-arrival) */
.arrival{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);width:min(580px,94%);padding:20px 22px;text-align:center;color:#eee4d1;text-shadow:0 2px 4px #000;background:linear-gradient(90deg,transparent,#101116d9 18%,#101116d9 82%,transparent);z-index:24;pointer-events:none;opacity:0}
.arrival::before,.arrival::after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,#ab9271,transparent)}
.arrival::before{margin-bottom:13px}.arrival::after{margin-top:13px}
.arrival .eb{color:#c9b58f;text-transform:uppercase;font-size:10px;letter-spacing:.2em;margin-bottom:7px}
.arrival h2{margin:0 0 7px;font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:500;letter-spacing:.045em;line-height:1.15}
.arrival .md{font-size:13px;color:#d4cbbb;margin-bottom:4px}
.arrival .terr{margin:10px auto 0;max-width:430px;font-size:13.5px;line-height:1.5;color:#d9d1c3;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.arrival .terr img{width:18px;height:18px;image-rendering:pixelated}
.arrival .terr strong{color:#f0d6a7}
#frame.portrait .arrival{top:33%;padding:13px 12px}
#frame.portrait .arrival h2{font-size:25px}
#frame.portrait .arrival .terr{font-size:12px}

/* world-attached badges: the target's state, on the target (thesis C) */
.wb{position:absolute;display:flex;gap:3px;align-items:flex-end;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap}
.wbt{position:relative;display:flex;align-items:center;gap:2px;height:22px;padding:0 4px 0 1px;background:rgba(10,12,9,.86);border:1px solid rgba(255,255,255,.14);border-radius:4px;box-shadow:0 0 8px var(--glow,rgba(0,0,0,.4));transform-origin:50% 100%;pointer-events:auto}
.wbt img{width:20px;height:20px;image-rendering:auto;display:block}
.wbt b{font:700 12.5px var(--f-body);color:#d9f5bf;text-shadow:0 1px 0 #000,0 0 4px #000;min-width:12px;letter-spacing:-.01em}
.wbt.ic{padding:0 1px;width:22px;justify-content:center;overflow:hidden}
.wbt .sw{position:absolute;inset:0;border-radius:3px}
#frame.portrait .wbt{height:20px}#frame.portrait .wbt img{width:18px;height:18px}#frame.portrait .wbt b{font-size:11.5px}#frame.portrait .wbt.ic{width:20px}
.fword{position:absolute;transform:translate(-50%,-100%);font:700 16px var(--f-word);white-space:nowrap;pointer-events:none;letter-spacing:.02em}
#frame.portrait .fword{font-size:15px}

/* portrait shell (client MobileHUD) */
.p-shell{position:relative;width:390px;height:844px}
.p-shell .world{position:absolute;inset:0}
.mtop{position:absolute;top:0;left:0;right:0;min-height:56px;z-index:30;background:var(--mat-rail);border-bottom:1px solid var(--edge-light);display:flex;flex-direction:column;gap:3px;padding:16px 14px 5px;font-family:var(--f-mono)}
.mtop .r1{display:flex;align-items:center;gap:7px}
.mtop .nm{color:var(--success);font-size:12px;font-weight:700}
.mtop .hp{flex:1;height:9px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:3px;overflow:hidden;position:relative}
.mtop .hp i{position:absolute;left:0;top:0;bottom:0;background:#44ee44;transition:width .18s linear}
.mtop .ht{color:var(--muted);font-size:9px}.mtop .zn{color:var(--primary);font-size:9px}
.mtop .ctx{display:flex;align-items:center;gap:7px}
.mtop .stance{padding:1px 5px;border:1px solid var(--divider);color:var(--dim);font-size:8px;font-weight:700}
.mtop .mech{font-size:9px;color:var(--muted);display:flex;gap:3px;align-items:center}.mtop .mech i{width:6px;height:9px;background:#4e9bb9;border-radius:1px}.mtop .mech i.e{background:#21323a}
.mauto{position:absolute;right:14px;bottom:110px;width:62px;height:62px;border-radius:50%;z-index:35;background:var(--mat-control);border:2px solid var(--edge-light);border-right-color:var(--edge-dark);border-bottom-color:var(--edge-dark);color:var(--primary-strong);font-family:var(--f-mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 12px rgba(0,0,0,.5);font-size:9px;letter-spacing:1px}
.mauto .i{font-size:16px;letter-spacing:0}
.mauto.on{background:var(--mat-inset);color:var(--success)}
.mquest{position:absolute;right:27px;bottom:182px;width:36px;height:36px;border-radius:50%;z-index:35;background:var(--mat-control);border:2px solid var(--edge-light);border-right-color:var(--edge-dark);border-bottom-color:var(--edge-dark);color:var(--warning);font:700 18px var(--f-mono);display:grid;place-items:center;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.mbottom{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--mat-rail);border-top:1px solid var(--edge-light);font-family:var(--f-mono);padding-bottom:10px}
.mbottom .bx{padding:5px 12px 4px;border-bottom:1px solid var(--divider);font-size:9.5px;color:var(--muted)}
.mbottom .bx .h{display:flex;justify-content:space-between}.mbottom .bx b{color:#7fbf6a}
.mbottom .bx .bar{height:4px;margin-top:3px;background:#000}.mbottom .bx .bar i{display:block;height:100%;width:42%;background:linear-gradient(90deg,#4f8a3c,#7fbf6a)}
.mtabs{display:flex}
.mtab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);padding:7px 0 4px;min-height:50px;cursor:pointer;position:relative}
.mtab .ti{font-size:17px;line-height:1;height:22px;display:grid;place-items:center}
.mtab .ti img{width:22px;height:22px;image-rendering:pixelated}
.mtab .tl{font-size:8px;letter-spacing:.4px;text-transform:uppercase}
.mtab.on{color:var(--primary-strong)}.mtab.on .ti{filter:drop-shadow(0 0 6px var(--primary))}
.mguide{position:absolute;left:10px;right:10px;z-index:28;background:rgba(26,23,18,.95);border:1px solid var(--edge-medium);border-left:3px solid var(--primary);padding:7px 10px 8px;box-shadow:0 4px 14px rgba(0,0,0,.55)}
.mguide .chapter{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.mguide .gline{margin:3px 0 0;font-size:11.5px;line-height:1.42;color:var(--ink)}
.mguide .gline.ph{border:1px dashed #6a5a3a;padding:3px 6px;color:#b9a77d;font-size:10.5px;margin-top:5px}
#frame.portrait .tframe{top:62px;width:250px;padding:5px 10px 6px}
#frame.portrait .tframe .tn{font-size:12px;margin-bottom:3px}
#frame.portrait .tframe .tt{height:13px}

/* Gear tab */
.scrim{position:absolute;inset:0;background:rgba(4,3,2,.55)}
#frame.first .scrim{background:transparent}
.gd{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:600px;background:var(--mat-panel);border:1px solid var(--edge-medium);box-shadow:0 18px 60px rgba(0,0,0,.7);font-size:12.5px}
.gd-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--edge-light);background:linear-gradient(180deg,#2a251c,#221f18)}
.gd-title{font-family:var(--f-word);font-weight:600;font-size:16px;color:var(--primary-strong)}
.gd-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.x{margin-left:auto;background:none;border:1px solid transparent;color:var(--muted);width:30px;height:30px;font-size:15px;cursor:pointer}
.x:hover{border-color:var(--edge-medium);color:var(--ink)}
.gd-list{padding:12px;display:flex;flex-direction:column;gap:8px}
.gi{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--mat-control);border:1px solid var(--edge-light);text-align:left;width:100%}
.gi-art{width:64px;height:64px;display:grid;place-items:center;background:var(--mat-inset);border:1px solid var(--edge-light)}
.gi-art img{width:64px;height:64px;image-rendering:pixelated}
.gi-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.gi-slot{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gi-name{font-family:var(--f-display);font-size:18px;color:var(--ink);line-height:1.15}
.gi-stats{font:11px var(--f-mono);color:var(--muted)}
.gi.weapon{cursor:pointer;border-color:color-mix(in srgb,var(--primary) 55%,var(--edge-light));background:linear-gradient(90deg,color-mix(in srgb,#9be564 6%,var(--mat-control)),var(--mat-control) 60%)}
.gi.weapon:hover{border-color:var(--primary-strong);box-shadow:0 0 0 1px rgba(224,192,112,.35)}
.gi.weapon .gi-name{color:#f0e2bf}
.gi-page{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gi-open{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--primary-strong);color:var(--primary-strong);background:color-mix(in srgb,var(--primary) 16%,var(--mat-control));font-weight:600;font-size:12px}
.gi-open svg{width:16px;height:14px}
.gi-page small{font-size:10.5px;color:var(--muted)}

<script>
(() => {
'use strict';
const D = window.UI_PROTO_DATA;
if (!D) { document.body.innerHTML = '<p style="color:#ece4d4;padding:24px">../data.js did not load.</p>'; return; }

// ═══ Data access (every name, sentence, cost, colour and number comes from here) ═══
const DS = D.daggerScenes, PK = D.packets;
const art = (p) => (p ? '../../../' + p : null);
const pageOf = (k) => DS.pages.find((p) => p.key === k);
const compT1 = (verbId, leanId) => DS.compositionsT1Slinger.find((c) => c.verbId === verbId && c.leanId === (leanId ?? null));
const statusOf = (id) => D.statuses.target.find((s) => s.id === id);
const nodeOf = (id) => D.nodes.find((n) => n.id === id);
const FAMS = D.families.swamp;
const monByName = (name) => { for (const f of FAMS) for (const m of f.monsters) if (m.name === name) return { ...m, family: f.id }; return null; };
const OOZE = monByName('Mire Ooze');
const DAG = D.weapons.find((w) => w.lineageId === 'dagger');
const BEAT_PAY = DS.tutorialBeats.find((b) => b.id === 'card:dagger-t1-affliction-payoff');
const ST = DS.playerStats;
const VERB = 'dagger-t1-affliction-payoff', LEAN_AFF = 'dagger-t1-affliction-stat', LEAN_CTL = 'dagger-t1-control-stat';
const PURE = compT1(VERB, LEAN_AFF), COMPOSED = compT1(VERB, LEAN_CTL);
const POISON = statusOf('poison-dagger-burn'), SLOWED = statusOf('ability-slowed'), ROOTED = statusOf('ability-rooted');
const ICON = {
  poison: POISON.icon, slow: D.statuses.playerDebuffIcons.slow, root: D.statuses.playerDebuffIcons.root,
  stun: D.statuses.playerDebuffIcons.stunned,
};
const SPR = {
  slinger: D.art.slingerSprite, ooze: D.art.monsters['bog-slime'], hexer: D.art.monsters['fen-hexer'],
  toad: D.art.monsters['mud-toad'], dagger: DAG.t1Form.iconArt, boss: D.art.bosses.swamp,
};
const SLOT_LABEL = { weapon: 'Weapon', armor: 'Armor', recovery: 'Recovery', mobility: 'Boots' }; // client SLOT_LABELS
const STAT_LABEL = { attack: ['ATK', (v) => '+' + v], maxHp: ['HP', (v) => '+' + v], evasion: ['EVS', (v) => '+' + Math.round(v * 100) + '%'], damageReduction: ['DR', (v) => '+' + Math.round(v * 100) + '%'], recovery: ['RECOV', (v) => '+' + v], speed: ['SPD', (v) => '+' + v] }; // client STAT_META

// The prototype combat rule (SCENES.md) — a UI rule built from the export, not the server's DoT formula.
const RULE = {
  swingMs: 500, hit: ST.attack, conv: DAG.t1Form.weaponDot.convPct,
  leanBleedPct: 0.10, // Coated Edge's "a tenth" (SCENES combat rule)
  tickMs: DAG.t1Form.weaponDot.tickIntervalMs, capMs: PURE.trigger.capMs, rootMs: COMPOSED.payoff.durationMs,
  oozeHp: OOZE.hp, oozeAtk: OOZE.attack, oozeCd: OOZE.attackCooldownMs, hp0: 171, hpMax: ST.maxHp,
  wordRise: D.rhythm.floatingWord.risePx, wordMs: D.rhythm.floatingWord.riseMs, wordHold: D.rhythm.floatingWord.holdShare,
};
const TEACH_FIRINGS = 3; // mockup rule 2: the callout plays for the first three firings of a newly bought card

// ═══ Utils ═══
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

  if (rootAge != null && rootAge < comp.payoff.durationMs) items.push({ icon: ICON.root, sweep: rootAge / comp.payoff.durationMs });
  if (slowed) items.push({ icon: ICON.slow });
  if (stunAge != null && stunAge < comp.payoff.durationMs) items.push({ icon: ICON.stun });
  const tw = items.reduce((a, it) => a + (it.n != null ? 34 * it.grow : 18) + 3, -3); bxp = tb.x - tw / 2;
  for (const it of items) {
    const s = 16 * (it.grow || 1); const wdt = it.n != null ? 34 * it.grow : 18; const y = bys - s;
    g.fillStyle = 'rgba(8,10,8,.88)'; g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1; g.beginPath(); g.roundRect(bxp, y, wdt, s + 2, 3); g.fill(); g.stroke();
    const ic = im(it.icon); if (ic) g.drawImage(ic, bxp + 1, y + 1, s, s);
    if (it.sweep != null) { g.fillStyle = 'rgba(0,0,0,.6)'; g.beginPath(); g.moveTo(bxp + 9, y + 9); g.arc(bxp + 9, y + 9, 9, -Math.PI / 2, -Math.PI / 2 + it.sweep * Math.PI * 2); g.fill(); }
    if (it.n != null) { g.font = `700 ${11 * it.grow}px 'IBM Plex Sans',sans-serif`; g.fillStyle = '#d9f5bf'; g.strokeStyle = '#000'; g.lineWidth = 2.5; g.strokeText(String(it.n), bxp + s + 2, y + s * 0.78); g.fillText(String(it.n), bxp + s + 2, y + s * 0.78); }
    bxp += wdt + 3;
  }
  if (needsSlow && t > 1600) { g.save(); g.font = "600 10px 'IBM Plex Sans',sans-serif"; g.fillStyle = 'rgba(236,228,212,.75)'; g.textAlign = 'center'; g.fillText('…', tb.x, tb.top - 30); g.restore(); }
}

function findCard(pg, id) { for (const b of pg.bands) for (const r of b.rows) for (const c of r.cards) if (c.id === id) return c; return null; }
function buyable(pg) { let n = 0; for (const b of pg.bands) if (b.mode === 'lit') for (const r of b.rows) for (const c of r.cards) if (c.state === 'buy') n++; return n; }
function sceneDefaultPage() { if (S.scene === 3) return S.pair === 'pure' ? 'scene2-after-buy' : 'scene3-composed'; if (S.scene === 4) return 'scene2-after-buy'; return S.pageKey; }
function verbSentence(pg, card) {
  // a verb card reads its sentence with the lean being previewed (desktop hover / phone peek) or the active lean
  const activeLean = (pg.progress.active || {}).stat || null; const lean = S.previewLean || activeLean;
  const leanCard = lean ? findCard(pg, lean) : null; const leanLane = leanCard ? leanCard.lane : null;
  if (S.previewLean && card.tier === 1) { const c = compT1(card.id, S.previewLean); if (c) return { halves: [{ text: c.sentence, color: c.momentColor, pure: c.momentColor === c.payloadColor }].length && splitHalves(c.sentence, c.verbLane, c.leanLane), note: c.note }; }
  if (S.previewLean && card.tier === 2) { const c = DS.compositionsT2Slinger.find((x) => x.verbId === card.id && x.leanLane === leanLane); if (c) return { halves: splitHalves(c.sentence, c.verbLane, c.leanLane), note: c.note }; }
  return { halves: splitHalves(card.sentence, card.lane, leanLane), note: card.note };
}

    <ul><li>The HUD carries nothing about cards: no rings, no proc icons, no card tiles. The only card words outside the book are the guide's line.</li>
    <li>The Gear tab is a rail entry on desktop and a bottom-bar tab on the phone; its icon is the worn weapon.</li><li>Press the Poison Dagger to open its page (scene 2). The three plain items say so and go nowhere.</li></ul></div>`;
  if (sc === 2) body = `<div class="ex"><h2>2 · The weapon page</h2><p class="q">What does the page say about the Poison Dagger at Tier 1?</p>
    <div class="ctl"><button class="btn" data-x="buy">Press Into the Wound</button><button class="btn" data-x="short">Press Silent Step (short)</button><button class="btn" data-x="reset">Reset page</button></div>
    <h3>Lean preview</h3><div class="ctl">${[[null, 'None'], [LEAN_AFF, 'Coated Edge'], [LEAN_CTL, 'Tendon Cut'], ['dagger-t1-kill-chain-stat', 'Silent Step']].map(([id, l]) => `<button class="btn" data-x="lean" data-id="${id || ''}" aria-pressed="${S.previewLean === id}">${l}</button>`).join('')}</div>
    <p class="small">Desktop: hover a lean. Phone: tap its Preview button (thumb-sized, sticky until tapped again). The stat sheet shows before → after, every verb re-reads, and the plate redraws the pair.</p>
    <ul><li><b>The plate</b> (“In the fight”) is this thesis's addition to the book: a looping figure of the pair as the body will show it (blade glow in the moment's colour, ground mark in the payload's colour, the badge). It is the book teaching the world's vocabulary.</li>
    <li>A composed sentence is drawn in its two colours, moment half and payload half (see Easy Prey and Next Throat now; Into the Wound under Tendon Cut).</li>
    <li>No lean ranks. Six steps per tier would read as three notches on the lean card's top edge, the sentence's number re-rendering per notch, and the plate's drip growing.</li></ul></div>`;
  if (sc === 3) {
    const f = S.fight; body = `<div class="ex"><h2>3 · A fight</h2><p class="q">Where do “coming”, “landed” and “lasting” live?</p>
    <div class="ctl"><button class="btn" data-x="pair" data-id="pure" aria-pressed="${S.pair === 'pure'}">Pure: Coated Edge + Into the Wound</button><button class="btn" data-x="pair" data-id="composed" aria-pressed="${S.pair === 'composed'}">Composed: Tendon Cut + Into the Wound</button></div>
    <div class="ctl"><button class="btn primary" data-x="hit">Land a hit</button><button class="btn" data-x="auto" aria-pressed="${!!S.autoPlay}">Auto-play</button><button class="btn" data-x="restart">Restart</button></div>
    <h3>Key frames</h3><div class="ctl"><button class="btn" data-x="kf" data-id="coming" aria-pressed="${S.frozen === 'coming'}">Coming</button><button class="btn" data-x="kf" data-id="landed" aria-pressed="${S.frozen === 'landed'}">Landed</button><button class="btn" data-x="kf" data-id="lasting" aria-pressed="${S.frozen === 'lasting'}">Lasting</button></div>
    <ul><li><b>Coming</b>: the blade fills with the moment's colour over the 5 s clock and glints ✦ when clear; the ground under an afflicted target marks in the payload's colour (venom sigil, or four pegs for the root).</li>
    <li><b>Landed</b>: the charged slash discharges into the target; pure: the poison is drawn in and bursts, the badge number jumps and swells; composed: chains fly in and lock on the pegs.</li>
    <li><b>Lasting</b>: one Poison badge on the body (one-DoT rule), its number the damage still owed, growing with it; composed adds the root (with its clock) and the slow, and the body is visibly pinned and crawling.</li>
    <li>The two-colour sentence lives in the book: <button class="btn" data-x="book">Open the book here</button></li></ul>
    ${S.view === 'portrait' ? `<h3>Phone camera</h3><div class="ctl"><button class="btn" data-x="cam" data-id="c" aria-pressed="${S.phoneCam === 'c'}">C: 1.0 in a fight</button><button class="btn" data-x="cam" data-id="today" aria-pressed="${S.phoneCam === 'today'}">Today: 0.4</button></div><p class="small">Today's phone camera (cameraZoom.ts) frames 1350 px of world at zoom 0.4, so a 64 px body is 26 px. A body-first HUD needs the fight closer.</p>` : ''}
    <p class="small">Illustrative combat rule from SCENES.md (not the server's DoT formula). Sim time ${(f.t / 1000).toFixed(1)} s${S.paused ? ' · paused' : ''}.</p></div>`;
  }
  if (sc === 4) {
    const f = S.fight; const n = f ? f.firings : 0;
    body = `<div class="ex"><h2>4 · A new card's first firings</h2><p class="q">What teaches the player what just happened, and when does it stop?</p>
    <div class="ctl"><button class="btn primary" data-x="fire">Fire again</button><button class="btn" data-x="reset">Reset</button></div>
    <div class="counter">${n === 0 ? 'Bought, not fired yet' : 'Firing #' + n}${n > TEACH_FIRINGS ? ' · teaching over' : n > 0 ? ' · teaching' : ''}</div>
    <ul><li><b>What teaches:</b> on firings #1–#3 the card's name (the floating word) rises from the wound it just doubled, so the body fx gets a name; the guide's lesson line (<code>lesson.read</code>) stays on the guide card through the same three.</li>
    <li><b>The rule that ends it:</b> a newly bought card names itself on its first three firings, then never again. From #4 the body alone: glow, mark, burst, badge.</li>
    <li>The lesson's <code>ring</code> line describes a HUD ring this thesis does not have; it is shown as a visible <code>[n]</code> placeholder.</li></ul></div>`;
  }
  if (sc === 5) body = `<div class="ex"><h2>5 · The node</h2><p class="q">Which family lives here, and which shard does it pay, before the first kill?</p>
    <div class="ctl"><button class="btn primary" data-x="arrive">Arrive</button></div>
    <div class="ctl">${['node-t1-swamp-04', 'node-t1-swamp-02', 'node-t1-swamp-05'].map((id) => `<button class="btn" data-x="node" data-id="${id}" aria-pressed="${S.nodeId === id}">${esc(nodeOf(id).mapTileLabel)}</button>`).join('')}</div>
    <ul><li>The banner names the family and the shard (the export's <code>arrival.discovery</code>), with the shard's icon.</li>
    <li>The world answers it: the node's shard grows in its ground as crystals, which flare once as the banner lands. Assumed from mockup rule 4's “the node looks like what it pays”; the art is the shard icon standing in for a prop.</li>
    <li>The bodies are the real blend (<code>spawnCycle</code>): Blackwater Crown is 7 Oozes, 2 Hexers, 1 Toad; Sunkroot Bog shows the “every node fields everything” problem. No roster rule is assumed.</li></ul></div>`;
  ex.innerHTML = thesis + body + `<div class="facts" id="factCount"></div>`;
  updateFacts();
}
document.getElementById('explain').addEventListener('click', (e) => {
  const b = e.target.closest('[data-x]'); if (!b) return; const x = b.dataset.x, id = b.dataset.id;
  if (x === 'gear') { S.gearOpen = true; renderDialogs(); }
  else if (x === 'reset') { enterScene(S.scene); }
  else if (x === 'buy') { if (!S.pageOpen) { S.pageOpen = true; renderDialogs(); } pressCard(VERB); }
  else if (x === 'short') { if (!S.pageOpen) { S.pageOpen = true; renderDialogs(); } pressCard('dagger-t1-kill-chain-stat'); }
  else if (x === 'lean') { S.previewLean = id || null; if (!S.pageOpen) { S.pageOpen = true; renderDialogs(); } refreshBookPreview(); renderExplain(); }
  else if (x === 'pair') { S.frozen = null; setPair(id, S.autoPlay); }
  else if (x === 'hit') { S.frozen = null; S.paused = false; S.fight.auto = !!S.autoPlay; if (!S.autoPlay) S.fight.queued = true; renderExplain(); }
  else if (x === 'auto') { S.frozen = null; S.autoPlay = !S.autoPlay; S.fight.auto = S.autoPlay; S.paused = false; if (S.autoPlay && S.fight.nextSwing < S.fight.t) S.fight.nextSwing = S.fight.t + 100; renderExplain(); }
  else if (x === 'restart') { S.frozen = null; setPair(S.pair, S.autoPlay); }
  else if (x === 'kf') { freezeAt(id); }
  else if (x === 'book') { S.pageOpen = true; renderDialogs(); }
  else if (x === 'cam') { S.phoneCam = id; renderExplain(); }
  else if (x === 'fire') { fireAgain(); }
  else if (x === 'arrive') { arrive(); }
  else if (x === 'node') { S.nodeId = id; arrive(); renderExplain(); }
});

// ═══ Toolbar + URL hash: #scene=1..5&view=desktop|portrait&first=0|1&embed=0|1 ═══
const segScene = document.getElementById('segScene');
segScene.innerHTML = [1, 2, 3, 4, 5].map((n) => `<button data-scene="${n}">${n} ${SCENE_NAMES[n]}</button>`).join('');
segScene.addEventListener('click', (e) => { const b = e.target.closest('[data-scene]'); if (b) setScene(+b.dataset.scene); });
document.getElementById('segView').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (!b) return; S.view = b.dataset.view; build(); writeHash(); });
document.getElementById('firstToggle').addEventListener('change', (e) => { S.first = e.target.checked; writeHash(); frame.classList.toggle('first', S.first); if (S.first && S.scene === 1 && !S.gearOpen && !S.pageOpen) { S.gearOpen = true; renderDialogs(); } if (S.first && S.scene === 3 && !S.embed) freezeAt('coming'); });
function syncToolbar() {
  segScene.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.scene === S.scene)));
  document.querySelectorAll('#segView button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
  document.getElementById('firstToggle').checked = S.first; document.body.classList.toggle('embed', S.embed);
}
function readHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  const scene = clamp(parseInt(p.get('scene') || '1', 10) || 1, 1, 5); const view = p.get('view') === 'portrait' ? 'portrait' : 'desktop';
  return { scene, view, first: p.get('first') === '1', embed: p.get('embed') === '1' };
}
let writing = false;
function writeHash() { writing = true; const h = `#scene=${S.scene}&view=${S.view}&first=${S.first ? 1 : 0}&embed=${S.embed ? 1 : 0}`; if (location.hash !== h) history.replaceState(null, '', h); writing = false; syncToolbar(); }
function applyHash() { const h = readHash(); S.view = h.view; S.first = h.first; S.embed = h.embed; document.body.classList.toggle('embed', S.embed); enterScene(h.scene); syncToolbar(); }
window.addEventListener('hashchange', () => { if (!writing) applyHash(); });

applyHash();
requestAnimationFrame(loop);
// fonts land after first paint: refit and recount once they do
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); updateFacts(); });
})();
</script>
</body>
</html>
