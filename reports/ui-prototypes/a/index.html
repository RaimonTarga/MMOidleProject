<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing but the Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Prototype A — "Nothing but the ring". Palette: client/src/ui/lineage/weaponPage.css,
   client/src/hud/primitives/tokens.css and the mockup's tokens. */
:root {
  --bg: #14120f; --panel: #1d1a16; --ink: #ece4d4; --gold: #d9b25c;
  --rail: rgba(14, 12, 9, 0.97); --hud-panel: #221f18; --control: #2a2720; --inset: #080706;
  --edge-light: #3e3a30; --edge-medium: #63553e; --edge-strong: #75664d; --edge-dark: #0c0a07;
  --divider: rgba(100, 88, 60, 0.4);
  --primary: #c8a860; --primary-strong: #e0c070;
  --text: #ccc5b4; --muted: #8a806c; --dim: #524a3f; --success: #55cc77; --danger: #cc4433;
  --display: 'Cinzel', 'Palatino Linotype', Georgia, serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0a08; color: var(--ink); font-family: var(--sans); }
button { font: inherit; color: inherit; }

/* ── Prototype chrome (outside the frame) ──────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100%; }
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; border-bottom: 1px solid #2b261d; background: #110f0c; }
#bar h1 { margin: 0 8px 0 0; font: 600 14px/1.2 var(--display); color: var(--gold); letter-spacing: .04em; }
#bar h1 small { display: block; font: 500 10px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.seg { display: inline-flex; border: 1px solid #3a3226; border-radius: 3px; overflow: hidden; }
.seg button { background: #191612; border: 0; border-right: 1px solid #3a3226; padding: 6px 10px; font: 500 12px var(--sans); color: var(--text); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: #3a3020; color: var(--primary-strong); }
.seg button:hover { background: #2a241b; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); cursor: pointer; user-select: none; }
.chk input { accent-color: var(--gold); }
#main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#frame-wrap { position: absolute; }
#frame { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px #2c261d, 0 10px 40px rgba(0,0,0,.6); }
#panel { width: 340px; flex: none; overflow-y: auto; border-left: 1px solid #2b261d; background: #110f0c; padding: 16px; font-size: 13px; line-height: 1.5; color: var(--text); }
#panel h2 { margin: 0 0 4px; font: 600 16px var(--display); color: var(--primary-strong); }
#panel .q { margin: 0 0 12px; color: var(--muted); font-style: italic; }
#panel h3 { margin: 16px 0 6px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
#panel p { margin: 0 0 8px; }
#panel .ctl { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
#panel .ctl button { background: #231e17; border: 1px solid #4a3f2e; border-radius: 3px; padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--ink); }
#panel .ctl button:hover { border-color: var(--gold); }
#panel .ctl button.on { background: #3a3020; border-color: var(--gold); color: var(--primary-strong); }
#panel .ctl button.primary { background: #3d3220; border-color: var(--gold); color: var(--primary-strong); font-weight: 600; }
#panel .readout { font: 12px var(--mono); color: var(--ink); background: #0b0a08; border: 1px solid #2b261d; padding: 8px 10px; white-space: pre-line; }
#panel .fine { font-size: 11.5px; color: var(--muted); }
body.embed #bar, body.embed #panel { display: none; }
body.embed { background: var(--bg); }
@media (max-width: 960px) { #main { flex-direction: column; } #panel { width: auto; max-height: 38vh; border-left: 0; border-top: 1px solid #2b261d; } }

/* ── The frame ─────────────────────────────────────────────────────────── */
.fr { position: absolute; inset: 0; font-family: var(--mono); color: var(--text); }
.fr canvas.world { position: absolute; image-rendering: pixelated; }
img.px { image-rendering: pixelated; }

/* Desktop shell: rail | game | rail (client/index.html + hud/rail.css). */
.d-rail { position: absolute; top: 0; bottom: 0; width: 232px; padding: 8px; display: flex; flex-direction: column; gap: 7px;
  background: linear-gradient(135deg, #1a1712, #0e0c09 36%, #0b0a07); box-shadow: inset 0 0 0 1px rgba(0,0,0,.72); }
.d-rail.l { left: 0; border-right: 1px solid rgba(50,50,80,.6); }
.d-rail.r { right: 0; border-left: 1px solid rgba(50,50,80,.6); }
.d-game { position: absolute; left: 232px; top: 0; width: 816px; height: 720px; overflow: hidden; background: #2a2e1e; }
.pn { background: linear-gradient(180deg, #27231b, #221f18 56%, #1b1813); border: 1px solid var(--edge-dark); border-top-color: var(--edge-light); border-left-color: var(--edge-light); padding: 8px 10px; }
.pt { display: flex; justify-content: space-between; align-items: center; font: 600 11px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--primary-strong); }
.pt span, .pt button { font: 500 10px var(--mono); letter-spacing: .04em; text-transform: none; color: var(--muted); background: none; border: 0; padding: 0; }
.pt.sub { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--divider); }
.char-name { display: flex; align-items: center; gap: 6px; margin: 8px 0 6px; font: 600 12px var(--mono); color: var(--ink); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #3bd16f; box-shadow: 0 0 5px #3bd16f; }
.hp-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.hp-row b { color: var(--ink); font-weight: 600; }
.hpbar { height: 9px; margin: 3px 0 8px; background: #0a0907; border: 1px solid #000; position: relative; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #5af06a, #2fb84a); transition: width .18s linear; }
.dps { display: flex; align-items: baseline; gap: 7px; padding: 6px 0; border-top: 1px solid var(--divider); }
.dps img { width: 16px; height: 16px; align-self: center; }
.dps b { font: 600 20px var(--mono); color: var(--primary-strong); }
.dps small { color: var(--muted); font-size: 11px; }
.dps em { margin-left: auto; font: 600 9px var(--mono); color: var(--muted); font-style: normal; letter-spacing: .1em; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; padding-top: 6px; border-top: 1px solid var(--divider); font-size: 11px; color: var(--ink); }
.sgrid span { display: flex; align-items: center; gap: 5px; }
.sgrid img { width: 13px; height: 13px; }
.ltabs { display: flex; gap: 4px; margin-top: 7px; }
.ltabs b { flex: 1; text-align: center; font: 500 9px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--edge-light); padding: 4px 0; background: #1a1712; }
.guide p { margin: 6px 0 8px; font: 12px/1.5 var(--sans); color: var(--ink); }
.guide .chap { margin-top: 6px; font: 600 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.guide .next { width: 100%; padding: 6px; border: 1px solid var(--primary-strong); background: #3a3020; color: var(--primary-strong); font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.guide.collapsed { padding: 6px 10px; }
.navgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; background: linear-gradient(180deg, #27231b, #1b1813); border: 1px solid var(--edge-dark); border-top-color: var(--edge-light); }
.nb { display: flex; align-items: center; gap: 7px; padding: 7px 7px; border: 1px solid var(--edge-light); background: #1f1c16; font: 500 11px var(--mono); color: var(--text); cursor: pointer; text-align: left; position: relative; }
.nb img { width: 22px; height: 22px; flex: none; }
.nb:hover { border-color: var(--primary); color: var(--ink); }
.nb.on { border-color: var(--primary-strong); background: #2e281c; color: var(--primary-strong); }
.erow { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 12px; }
.erow i { width: 9px; height: 9px; transform: rotate(45deg); background: #b066e0; }
.erow b { margin-left: auto; color: #c58fff; }

/* Game-area overlays. */
.bxp { position: absolute; top: 12px; right: 12px; width: 206px; padding: 7px 10px; background: rgba(16,14,11,.88); border: 1px solid #3a3326; }
.bxp div { display: flex; justify-content: space-between; font: 600 10px var(--mono); letter-spacing: .1em; color: var(--muted); }
.bxp b { color: var(--primary-strong); }
.bxp i { display: block; height: 4px; margin-top: 5px; background: #0a0907; position: relative; }
.bxp i::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 46%; background: #8c6bd6; }
.auto { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: linear-gradient(180deg, #3a3129, #241e19); border: 1px solid #6a5a44; font: 600 11px var(--mono); letter-spacing: .14em; color: var(--text); }
.auto b { padding-left: 12px; border-left: 1px solid #6a5a44; color: #6fe08a; font-size: 14px; }

/* Target frame (client/src/hud/targetFrame.css). */
.tf { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 320px; padding: 8px 12px 9px; background: rgba(20,18,13,.94); border: 1px solid #3e3a30; border-right-color: #0c0a07; border-bottom-color: #0c0a07; box-shadow: 2px 2px 8px rgba(0,0,0,.6); }
.tf-name { text-align: center; font: 700 14px var(--mono); color: var(--text); margin-bottom: 5px; }
.tf-track { position: relative; height: 18px; border-radius: 5px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12); overflow: hidden; }
.tf-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(180deg, #57e05a, #33b13a); }
.tf-track span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 11px var(--mono); color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000; }
.tf-stats { margin-top: 5px; text-align: center; font: 600 10px var(--mono); color: var(--muted); letter-spacing: .06em; }
.tf-tiles { display: flex; justify-content: center; gap: 10px; margin-top: 7px; min-height: 0; }
.tf-tiles:empty { display: none; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 58px; }
.ti { position: relative; width: 32px; height: 32px; border-radius: 3px; background: #11161d; border: 1px solid rgba(255,255,255,.18); overflow: hidden; }
.ti img { width: 100%; height: 100%; image-rendering: pixelated; }
.ti .sw { position: absolute; inset: 0; }
.ti .st { position: absolute; right: 1px; bottom: 0; font: 700 11px var(--mono); color: #fff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; line-height: 1; padding: 1px; }
.tl { font: 700 9px var(--mono); letter-spacing: .02em; white-space: nowrap; }
.tile.jump .ti { animation: tilejump .5s ease-out; }
@keyframes tilejump { 0% { transform: scale(1.35); box-shadow: 0 0 12px #9be564; } 100% { transform: scale(1); } }

/* THE RING — the only card element on the HUD (thesis A). */
.ring { position: absolute; width: var(--rs); height: var(--rs); --rs: 56px; pointer-events: auto; cursor: help; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring .plate { fill: rgba(10,9,7,.82); stroke: rgba(255,255,255,.10); stroke-width: 6; }
.ring .arc { fill: none; stroke: var(--lane); stroke-width: 6; stroke-linecap: butt; opacity: .55; }
.ring .glint { fill: #fff; opacity: 0; }
.ring .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 15px var(--mono); color: var(--ink); text-shadow: 0 1px 0 #000, 0 0 4px #000; }
.ring .badge { position: absolute; right: -5px; bottom: -5px; width: 24px; height: 24px; border-radius: 50%; background: #0b0a08; border: 1.5px solid var(--pay); display: grid; place-items: center; opacity: .8; }
.ring .badge canvas { width: 16px; height: 16px; image-rendering: pixelated; }
.ring .flash { position: absolute; inset: -2px; border-radius: 50%; box-shadow: 0 0 0 3px var(--lane), 0 0 18px 4px var(--lane); opacity: 0; pointer-events: none; }
.ring .spend { position: absolute; inset: 8px; border-radius: 50%; background: radial-gradient(circle, #fff 0, var(--lane) 40%, transparent 70%); opacity: 0; pointer-events: none; }
.ring .hl { position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--primary-strong); box-shadow: 0 0 12px rgba(224,192,112,.7); opacity: 0; pointer-events: none; }
.ring.coming .arc { opacity: 1; filter: drop-shadow(0 0 3px var(--lane)); }
.ring.coming .txt { color: var(--lane); }
.ring.coming .glint { opacity: 1; }
.ring.coming svg { animation: tighten .5s ease-in-out infinite; }
@keyframes tighten { 50% { transform: scale(1.07); } }
.ring.ready .arc { opacity: 1; filter: drop-shadow(0 0 4px var(--lane)) drop-shadow(0 0 8px var(--lane)); animation: breathe 2.2s ease-in-out infinite; }
.ring.ready .txt { color: var(--lane); font-size: 24px; }
.ring.ready .badge { opacity: 1; }
@keyframes breathe { 50% { filter: drop-shadow(0 0 2px var(--lane)); } }
.d-game .ring { left: 14px; top: 49px; }
.ring-tip { position: absolute; z-index: 30; max-width: 300px; padding: 10px 12px; background: #15130f; border: 1px solid var(--edge-medium); box-shadow: 0 8px 24px rgba(0,0,0,.6); font: 12px/1.45 var(--sans); color: var(--ink); pointer-events: none; }
.ring-tip b { display: block; font: 600 14px var(--display); margin-bottom: 4px; }
.ring-tip small { display: block; margin-top: 6px; font: 600 10px var(--mono); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }

/* The teaching line: one transient line, first three firings, then never. */
.teach { position: absolute; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; padding: 8px 14px 9px; background: linear-gradient(90deg, rgba(12,11,8,.95), rgba(12,11,8,.88)); border: 1px solid color-mix(in srgb, var(--lane) 55%, #000); border-left: 3px solid var(--lane); box-shadow: 0 6px 20px rgba(0,0,0,.55), 0 0 18px color-mix(in srgb, var(--lane) 18%, transparent); font: 13px/1.4 var(--sans); color: var(--ink); opacity: 0; pointer-events: none; }
.teach b { font: 700 14px var(--display); color: var(--lane); text-shadow: 0 0 8px color-mix(in srgb, var(--lane) 45%, transparent); }
.teach::before { content: ''; position: absolute; width: 2px; background: linear-gradient(var(--lane), color-mix(in srgb, var(--lane) 30%, transparent)); }
.d-game .teach { left: 14px; top: 140px; max-width: 560px; }
.d-game .teach::before { left: 25px; top: -36px; height: 35px; }
.mv .teach { right: 8px; top: 186px; max-width: 374px; padding: 7px 11px 8px; font-size: 12.5px; }
.mv .teach::before { right: 21px; top: -62px; height: 61px; }

/* Arrival banner (client/src/hud/areaInformation.css). */
.arrival { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); width: min(580px, 94%); padding: 20px 22px; text-align: center; background: linear-gradient(90deg, transparent, #101116d9 18%, #101116d9 82%, transparent); font-family: ui-sans-serif, system-ui, sans-serif; color: #eee4d1; text-shadow: 0 2px 4px #000; pointer-events: none; opacity: 0; }
.arrival::before, .arrival::after { content: ''; display: block; height: 1px; background: linear-gradient(90deg, transparent, #ab9271, transparent); }
.arrival::before { margin-bottom: 13px; } .arrival::after { margin-top: 13px; }
.arrival .eb { color: #c9b58f; text-transform: uppercase; font-size: 10px; letter-spacing: .2em; margin-bottom: 7px; }
.arrival h2 { margin: 0 0 7px; font: 500 34px/1.15 Georgia, 'Times New Roman', serif; letter-spacing: .045em; }
.arrival .md { font-size: 13px; color: #d4cbbb; }
.arrival .terr { display: inline-flex; align-items: center; gap: 6px; margin: 10px auto 0; font-size: 13.5px; line-height: 1.5; color: #d9d1c3; }
.arrival .terr strong { color: #f0d6a7; }
.arrival .terr img { width: 18px; height: 18px; }
.mv .arrival { top: 34%; padding: 13px 12px; }
.mv .arrival h2 { font-size: 26px; }
.mv .arrival .terr { font-size: 12px; }

/* Dialogs. */
.backdrop { position: absolute; inset: 0; background: rgba(5,4,3,.6); }
.dlg { position: absolute; display: flex; flex-direction: column; background: #191611; border: 1px solid var(--edge-medium); box-shadow: 0 18px 60px rgba(0,0,0,.75); font-family: var(--sans); color: var(--ink); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; height: 48px; flex: none; border-bottom: 1px solid var(--edge-light); background: linear-gradient(180deg, #24201a, #1a1712); }
.dlg-head .barx { width: 3px; height: 24px; background: var(--primary-strong); }
.dlg-head h2 { flex: 1; margin: 0; font: 600 15px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--primary-strong); }
.dlg-head .sub { font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.dlg-head .x { width: 48px; height: 48px; border: 0; border-left: 1px solid var(--edge-light); background: transparent; color: var(--text); font-size: 20px; cursor: pointer; }
.dlg-head .back { border: 1px solid var(--edge-light); background: #211d17; color: var(--text); font: 500 11px var(--mono); padding: 5px 9px; cursor: pointer; }
.dlg-tabs { display: flex; gap: 0; padding: 0 16px; border-bottom: 1px solid var(--edge-light); flex: none; }
.dlg-tabs button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 10px 16px 9px; font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.dlg-tabs button.on { color: var(--primary-strong); border-bottom-color: var(--primary-strong); }

/* Gear tab. */
.gear-list { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.gl-h { font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
.g-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--edge-light); background: var(--control); text-align: left; }
.g-row .art { width: 52px; height: 52px; display: grid; place-items: center; background: var(--inset); border: 1px solid var(--edge-medium); }
.g-row .art img { width: 40px; height: 40px; }
.g-row .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.g-row small { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.g-row b { font: 600 16px var(--display); color: var(--ink); }
.g-row em { font: 12px var(--mono); font-style: normal; color: var(--text); }
.g-row.weapon { cursor: pointer; border-color: color-mix(in srgb, var(--primary) 60%, var(--edge-light)); background: linear-gradient(90deg, rgba(200,168,96,.12), var(--control) 60%); padding: 14px 12px; }
.g-row.weapon:hover { border-color: var(--primary-strong); box-shadow: 0 0 0 1px rgba(224,192,112,.35); }
.g-row.weapon b { color: var(--primary-strong); font-size: 19px; }
.g-row .go { padding: 8px 14px; border: 1px solid var(--primary-strong); background: #3a3020; color: var(--primary-strong); font: 600 12px var(--mono); letter-spacing: .04em; white-space: nowrap; }
.g-row.plain { opacity: .78; cursor: default; }
.g-row.plain b { font-size: 14px; color: var(--text); }
.g-row .plainchip { padding: 3px 8px; border: 1px dashed var(--edge-medium); color: var(--muted); font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.map-grid { padding: 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; overflow-y: auto; }
.mv .map-grid { grid-template-columns: 1fr; }
.map-tile { position: relative; display: flex; align-items: center; gap: 9px; padding: 14px 12px; border: 1px solid var(--edge-light); border-left: 4px solid var(--sc); background: linear-gradient(90deg, color-mix(in srgb, var(--sc) 12%, var(--control)), var(--control) 70%); font: 12.5px/1.4 var(--sans); color: var(--ink); }
.map-tile.here { border-color: var(--primary-strong); border-left-color: var(--sc); box-shadow: inset 0 0 0 1px var(--primary-strong); }
.map-tile em { position: absolute; right: 8px; top: 4px; font: 600 8.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--primary-strong); font-style: normal; }
.make-stub { padding: 30px 16px; color: var(--muted); font-size: 13px; }

/* The weapon page (weaponPage.css, extended for thesis A). */
.wp-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #4a3f2e transparent; }
.wp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 16px; padding: 14px 16px 18px; align-items: start; }
.wp-main { display: flex; flex-direction: column; gap: 13px; min-width: 0; }
.wp-side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }

<body>
<div id="app">
  <header id="bar">
    <h1>Prototype A · Nothing but the ring<small>one ring per active verb · every other fact on the page or the target</small></h1>
    <div class="seg" id="sceneSeg"></div>
    <div class="seg" id="viewSeg"></div>
    <label class="chk"><input type="checkbox" id="firstChk"> First-time player</label>
  </header>
  <div id="main">
    <div id="stage"><div id="frame-wrap"><div id="frame"></div></div></div>
    <aside id="panel"></aside>
  </div>
</div>
<script src="../data.js"></script>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════════
   DATA — every name, sentence, cost, colour and number comes from the export.
   ════════════════════════════════════════════════════════════════════════ */
const D = window.UI_PROTO_DATA;
const DS = D.daggerScenes;
const P = D.packets;
const A = (p) => (p ? '../../../' + p : null);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pageBy = (k) => DS.pages.find((p) => p.key === k);
const statusById = (id) => D.statuses.target.find((s) => s.id === id);
const comps = DS.compositionsT1Slinger;
const comp = (verbId, leanId) => comps.find((c) => c.verbId === verbId && c.leanId === leanId);
const BEAT = DS.tutorialBeats.find((b) => b.id === 'card:dagger-t1-affliction-payoff');
const DAGGER = D.weapons.find((w) => w.lineageId === 'dagger');
const WDOT = DAGGER.t1Form.weaponDot;
const PS = DS.playerStats;
const SWAMP_MONSTERS = D.families.swamp.flatMap((f) => f.monsters.map((m) => ({ ...m, family: f })));
const OOZE = SWAMP_MONSTERS.find((m) => m.id === 'bog-slime');
const VERB_ID = 'dagger-t1-affliction-payoff';
const LEAN_AFF = 'dagger-t1-affliction-stat';
const LEAN_CTL = 'dagger-t1-control-stat';
const PURE = comp(VERB_ID, LEAN_AFF);
const COMPOSED = comp(VERB_ID, LEAN_CTL);
const VERB_CARD = pageBy('scene2').bands[0].rows[1].cards[0];
const POISON = statusById('poison-dagger-burn');
const SLOWED = statusById('ability-slowed');
const ROOTED = statusById('ability-rooted');
const BLACKWATER = 'node-t1-swamp-04';
const NODE_IDS = ['node-t1-swamp-04', 'node-t1-swamp-02', 'node-t1-swamp-05'];
const nodeBy = (id) => D.nodes.find((n) => n.id === id);

/* The prototype combat rule (SCENES.md): a UI rule built from the export's
   numbers, not the server's DoT formula. */
const RULE = {
  swingMs: 500,                                   // 1.98 swings/s, rounded per SCENES
  attack: PS.attack,                              // 26
  dose: PS.attack * WDOT.convPct,                 // 13: the Dagger's reservoir
  leanBleed: PS.attack * 0.10,                    // 2.6: Coated Edge's "a tenth" (SCENES)
  tickMs: WDOT.tickIntervalMs,                    // 1000
  capMs: PURE.trigger.capMs,                      // 5000
  rootMs: COMPOSED.payoff.durationMs,             // 2000
  slowPct: 0.15,                                  // Tendon Cut's 15% (SCENES)
  oozeHp: OOZE.hp, oozeAtk: OOZE.attack, oozeCd: OOZE.attackCooldownMs,
  hp0: 171, maxHp: PS.maxHp,
};

/* Art not carried by the export: the client's own environment and menu icons. */
const ENV = 'client/public/assets/environment/swamp/';
const ICONS = 'client/public/assets/concept-icons/';
const ART = {
  wang: ENV + 'ground-bogpool-wang.png',
  props: ['bogleaf-clump.png', 'bogleaf-clump-variant-2.png', 'sedge-tuft.png', 'sedge-tuft-variant-2.png', 'dead-reed-scatter.png', 'dead-reed-scatter-variant-2.png', 'moss-clumps.png'].map((f) => ENV + f),
  stump: ENV + 'rotted-root-crown.png',
  menu: (n) => ICONS + 'menu/' + n + '.png',
  stat: (n) => ICONS + 'stats/' + n + '.png',
};

/* ════════════════════════════════════════════════════════════════════════
   IMAGES
   ════════════════════════════════════════════════════════════════════════ */
const IMG = {};
function img(path) {
  if (!path) return null;
  if (!IMG[path]) {
    const i = new Image();
    i.onload = () => { groundCache.clear(); paintGlyphs(); };
    i.src = A(path);
    IMG[path] = i;
  }
  return IMG[path];
}
const ok = (i) => i && i.complete && i.naturalWidth > 0;
[ART.wang, ART.stump, ...ART.props, D.art.slingerSprite, ...Object.values(D.art.monsters), D.art.bosses.swamp, P.affliction.shardIcon].forEach(img);

/* A payload glyph tinted to the payload's lane colour (the ring's badge). */
function paintGlyphs() {
  document.querySelectorAll('canvas[data-glyph]').forEach((c) => {
    const im = img(c.dataset.glyph);
    if (!ok(im)) return;
    const g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.imageSmoothingEnabled = false;
    g.globalCompositeOperation = 'source-over';
    g.drawImage(im, 0, 0, c.width, c.height);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = c.dataset.color;
    g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'source-over';
  });
}

/* ════════════════════════════════════════════════════════════════════════
   STATE + HASH CONTRACT  (#scene=1..5&view=desktop|portrait&first=0|1&embed=0|1)
   ════════════════════════════════════════════════════════════════════════ */
const S = { scene: 1, view: 'desktop', first: false, embed: false };
let SC = {};          // the current scene's state
let sceneGen = 0;     // bumped on every scene entry; timers from an older entry never run
const sceneTimers = new Set();
function later(fn, ms) {
  const gen = sceneGen;
  const id = setTimeout(() => { sceneTimers.delete(id); if (gen === sceneGen) fn(); }, ms);
  sceneTimers.add(id);
  return id;
}
function clearSceneTimers() { sceneGen++; for (const id of sceneTimers) clearTimeout(id); sceneTimers.clear(); }
let director = null;  // embed autoplay
const SCENES = [
  { n: 1, short: 'Finding the tree', q: 'Where does the player go to see their cards?' },
  { n: 2, short: 'The weapon page', q: 'What does the page say about the Poison Dagger at Tier 1?' },

/* The fight scene, drawn at sim time t. */
function drawFight(sim, t, opts = {}) {
  const vw = V(), g = ctx, z = vw.z, k = vw.z * vw.k, m = isM();
  const fr = frameAt(sim, t);
  const unit = pipUnit(sim.mode);
  drawGround(1);
  const [sx, sy] = W2S(0, 0);
  const ents = [];
  const hitBy = (id, ms) => eventsIn(sim, t, ms).filter((e) => e.type === 'hit' && e.id === id);
  for (const o of fr.oozes) {
    if (!o.alive && (o.deadAt === null || t - o.deadAt > 600)) continue;
    ents.push({ y: o.y, draw: () => drawOoze(sim, fr, o, t) });
  }
  ents.push({ y: 0, draw: () => {
    const hurt = eventsIn(sim, t, 180).some((e) => e.type === 'oozeAtk');
    const throwing = eventsIn(sim, t, 140).some((e) => e.type === 'throw');
    const shake = hurt ? Math.sin(t / 15) * 1.5 : 0;
    ellipse(g, sx, sy, 15 * z, 5 * z, 'rgba(0,0,0,.38)');
    sprite(g, D.art.slingerSprite, sx + shake + (throwing ? 2 * z : 0), sy, 64 * z, { sy: 1 + Math.sin(t / 260) * 0.012 });
    if (hurt) ellipse(g, sx, sy - 26 * z, 15 * z, 22 * z, 'rgba(220,40,30,.28)');
    plate(g, DS.className, sx, sy - 58 * z, fr.hp / RULE.maxHp, '#4be36a', '#f2f2f2');
  } });
  ents.sort((a, b) => a.y - b.y).forEach((e) => e.draw());

  // projectiles, sparks, numbers, shard pops
  for (const e of eventsIn(sim, t, 1000)) {
    const u = t - e.t, o = fr.oozes.find((q) => q.id === e.id);
    if (e.type === 'throw' && u < 150 && o) {
      const [ox, oy] = W2S(o.x, o.y);
      dagger(g, sx + 8 * z, sy - 30 * z, ox, oy - 18 * z, u / 150, k);
    }
    if (e.type === 'hit' && o) {
      const [ox, oy] = W2S(o.x, o.y);
      if (u < 110) { g.strokeStyle = `rgba(255,255,255,${1 - u / 110})`; g.lineWidth = 2 * k; for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + 0.6; g.beginPath(); g.moveTo(ox + Math.cos(a) * 4 * k, oy - 18 * z + Math.sin(a) * 4 * k); g.lineTo(ox + Math.cos(a) * 11 * k, oy - 18 * z + Math.sin(a) * 11 * k); g.stroke(); } }
      if (u < 650) text(g, String(e.d), ox + 30 * z + hash(e.t, 1, 1) * 6, oy - 26 * z - 20 * ease(u / 650), '#ffffff', m ? 10 : 12, 700, 'left', undefined, 1 - clamp01((u - 350) / 300));
    }
    if (e.type === 'tick' && u < 700 && o) {
      const [ox, oy] = W2S(o.x, o.y);
      text(g, String(e.d), ox - 30 * z - hash(e.t, 2, 2) * 6, oy - 14 * z - 18 * ease(u / 700), AFF, m ? 9 : 11, 700, 'right', undefined, 1 - clamp01((u - 400) / 300));
    }
    if (e.type === 'oozeAtk' && u < 700) text(g, String(e.d), sx - 22 * z, sy - 24 * z - 18 * ease(u / 700), '#ff5a46', m ? 10 : 12, 700, 'right', undefined, 1 - clamp01((u - 400) / 300));
    if (e.type === 'death' && u >= 200 && u < 900) {
      const dead = sim.frames[Math.floor(e.t / STEP)].oozes.find((q) => q.id === e.id);
      if (dead) {
        const [ox, oy] = W2S(dead.x, dead.y), p = (u - 200) / 700;
        const x = p < 0.3 ? ox : ox + (sx - ox) * ease((p - 0.3) / 0.7);
        const y = p < 0.3 ? oy - 20 * z - 26 * (p / 0.3) : (oy - 46 * z) + (sy - 30 * z - (oy - 46 * z)) * ease((p - 0.3) / 0.7);
        const im = img(P.affliction.shardIcon), s = m ? 14 : 18;
        if (ok(im)) { g.save(); g.imageSmoothingEnabled = false; g.drawImage(im, x - s / 2, y - s / 2, s, s); g.restore(); }
      }
    }
  }
  if (opts.after) opts.after(fr);
  return fr;
}
function drawOoze(sim, fr, o, t) {
  const vw = V(), g = ctx, z = vw.z, k = vw.z * vw.k;
  const [fx, fy0] = W2S(o.x, o.y);
  let fy = fy0, sxs = 1, sys = 1, ox = 0, alpha = 1, skew = 0;
  const moving = o.alive && o.x > MELEE + 0.5 && t >= o.rootUntil;
  const slowed = t < o.slowUntil, rooted = t < o.rootUntil;
  const bob = Math.sin(t / (slowed ? 230 : 180) + o.y);
  sys = 1 + 0.05 * bob; sxs = 1 - 0.03 * bob;
  if (moving) fy -= Math.abs(Math.sin(t / (slowed ? 210 : 170))) * 3 * z;
  const hit = eventsIn(sim, t, 130).find((e) => e.type === 'hit' && e.id === o.id);
  if (hit) { sys *= 0.88; sxs *= 1.08; }
  const fire = eventsIn(sim, t, 1600).find((e) => e.type === 'fire' && e.id === o.id);
  if (fire && sim.mode === 'pure') {                     // swells as the dose is drawn in, then is squashed flat
    const u = t - fire.t;
    if (u < 150) { const p = u / 150; sys *= 1 + 0.16 * p; sxs *= 1 - 0.08 * p; }
    else if (u < 700) { const p = (u - 150) / 550, e = Math.sin(p * Math.PI) * (1 - p * 0.5); sys *= 1.16 - 0.16 * p - 0.42 * e; sxs *= 0.92 + 0.08 * p + 0.38 * e; }
  }
  const atk = eventsIn(sim, t, 320).find((e) => e.type === 'oozeAtk' && e.id === o.id);
  if (atk) ox -= Math.sin(clamp01((t - atk.t) / 320) * Math.PI) * 12 * z;
  let pull = 0;
  if (rooted) {                                          // straining against the chains: feet pinned, top lunging
    const ph = ((t - (o.rootUntil - RULE.rootMs)) % 650) / 650;
    pull = ph < 0.3 ? Math.sin((ph / 0.3) * Math.PI / 2) : Math.cos(((ph - 0.3) / 0.7) * Math.PI / 2);
    skew = 0.42 * pull; sxs *= 1 + 0.1 * pull; sys *= 1 - 0.08 * pull;
  }
  if (!o.alive) { const p = clamp01((t - o.deadAt) / 500); sys *= 1 - 0.8 * p; sxs *= 1 + 0.3 * p; alpha = 1 - p; }
  const cx = fx + ox, cy = fy - 20 * z;
  if (fr.tgt === o.id && o.alive) ellipse(g, fx, fy0 + 1, 27 * z, 9 * z, null, 'rgba(230,50,40,.95)', 2.2);
  ellipse(g, fx, fy0, 24 * z, 7 * z, `rgba(0,0,0,${0.35 * alpha})`);
  if (rooted && o.alive) shackle(g, fx, fy0, z, k, 'back', pull);
  if (slowed && o.alive && !rooted) slowLook(g, cx, cy, t, k, z);
  sprite(g, D.art.monsters['bog-slime'], cx, fy, 64 * z, { sx: sxs, sy: sys, alpha, skew });
  if (rooted && o.alive) shackle(g, fx, fy0, z, k, 'front', pull);
  if (fire && sim.mode === 'composed') fxClamp(g, fx, fy0, t - fire.t, z, k);
  const lastRoot = lastEvent(sim, t, 'fire', (e) => e.id === o.id && e.mode === 'composed');
  if (lastRoot && o.alive) fxBreak(g, fx, fy0, t - (lastRoot.t + RULE.rootMs), z, k);
  if (!o.alive) return;
  if (o.owed > 0) drips(g, cx, cy, fy0, o.owed, t, k, o.x0 + (o.label === 'A' ? 1 : 2), z);
  const top = fy0 - 58 * z;
  plate(g, OOZE.name, fx, top, o.hp / RULE.oozeHp, '#e04a3a', '#f0a0a0');
  const pipTop = top - 13 - 7 * k;
  const unit = pipUnit(sim.mode);
  if (fire && sim.mode === 'pure' && t - fire.t < 450) {
    const u = t - fire.t, n0 = Math.max(1, Math.round(fire.before / unit));
    if (u < 150) pipRow(g, fx, pipTop + 5 * (u / 150) * k, n0, k, { scale: 1 - 0.25 * (u / 150) });
    else pipSplit(g, fx, pipTop, n0, u - 150, k);
  } else if (o.owed > 0) {
    pipRow(g, fx, pipTop, Math.max(1, Math.round(o.owed / unit)), k);
  }
  if (fire && sim.mode === 'pure') fxSurge(g, cx, cy, fy0, t - fire.t, k);
}
function drawGround(seed) {
  const vw = V(), g = ctx, gr = ground(seed);
  g.fillStyle = '#3b3f27'; g.fillRect(0, 0, vw.cw, vw.ch);
  if (gr) {
    g.save(); g.imageSmoothingEnabled = false;
    g.drawImage(gr.c, vw.ox + gr.wx0 * vw.z, vw.oy + gr.wy0 * vw.z, gr.c.width * vw.z, gr.c.height * vw.z);
    g.restore();
  }
  const vg = g.createRadialGradient(vw.cw / 2, vw.ch / 2, Math.min(vw.cw, vw.ch) * 0.35, vw.cw / 2, vw.ch / 2, Math.max(vw.cw, vw.ch) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
  g.fillStyle = vg; g.fillRect(0, 0, vw.cw, vw.ch);
}

/* Idle world (scenes 1, 2, 5): the Slinger and a node's bodies, out of combat. */
const SLOTS = {
  desktop: [[200, -150], [330, 40], [470, -90], [150, 160], [520, 150], [300, -250], [-150, 170], [600, -10]],
  portrait: [[180, -330], [330, -160], [90, -560], [260, 230], [380, 380], [40, 330], [250, -470], [220, -720]],
};
function bodiesFor(nodeId, seed) {
  const n = nodeBy(nodeId);
  return n.spawnCycle.slice(0, 7).map((fam, i) => {
    const name = n.fieldedByFamily[fam][0];
    const mon = SWAMP_MONSTERS.find((q) => q.name === name);
    const [x, y] = dryNear(SLOTS[S.view][i][0], SLOTS[S.view][i][1], seed);
    return { name, mon, art: D.art.monsters[mon.id] ?? null, x, y, seed: i };
  });
}
function drawIdle(nodeId, t, opts = {}) {
  const g = ctx, z = V().z;
  drawGround(opts.seed ?? 1);
  const ents = bodiesFor(nodeId, opts.seed ?? 1).map((b) => ({ y: b.y, draw: () => {
    const dx = Math.sin(t / 1400 + b.seed * 2) * 14, dy = Math.cos(t / 1900 + b.seed) * 6;
    const [fx, fy] = W2S(b.x + dx, b.y + dy);
    const bob = Math.sin(t / 200 + b.seed);
    ellipse(g, fx, fy, 22 * z, 7 * z, 'rgba(0,0,0,.35)');
    if (b.art) sprite(g, b.art, fx, fy, 64 * z, { sy: 1 + 0.04 * bob, sx: 1 - 0.02 * bob });
    else plainBody(g, b.mon.color, fx, fy, 64 * z, { sy: 1 + 0.04 * bob });

  } }));
  const walk = opts.walkIn ? clamp01(t / 1200) : 1;
  ents.push({ y: 0, draw: () => {
    const [sx, sy] = W2S(-240 * (1 - ease(walk)), 0);
    const step = walk < 1 ? Math.abs(Math.sin(t / 110)) * 2 : 0;
    ellipse(g, sx, sy, 15 * z, 5 * z, 'rgba(0,0,0,.38)');
    sprite(g, D.art.slingerSprite, sx, sy - step, 64 * z, { sy: 1 + Math.sin(t / 260) * 0.012 });
    plate(g, DS.className, sx, sy - 58 * z, RULE.hp0 / RULE.maxHp, '#4be36a', '#f2f2f2');
  } });
  ents.sort((a, b) => a.y - b.y).forEach((e) => e.draw());
}

  const el = document.getElementById('ring'); if (!el) return;
  const r = readyAt - t;

  const fill = r <= 0 ? 1 : 1 - r / RULE.capMs;

  const gl = document.getElementById('ring-glint'); gl.setAttribute('cx', String(30 + Math.cos(a) * RING_R)); gl.setAttribute('cy', String(30 + Math.sin(a) * RING_R));

  if (readyAt > 0 && since >= 0 && since < 560) { const p = since / 560; fl.style.opacity = String(1 - p); fl.style.transform = `scale(${0.9 + 0.6 * p})`; }
  else fl.style.opacity = '0';
  const sp = document.getElementById('ring-spend');       // the spend when it fires
  const u = lastFireT === null ? 9999 : t - lastFireT;
  if (u >= 0 && u < 320) { const p = u / 320; sp.style.opacity = String(1 - p); sp.style.transform = `scale(${1.3 - 0.9 * p})`; }

}

/* ── The page's fx preview: what the body will show (thesis A's lesson that
   never stops: the page keeps it after the HUD has stopped teaching). ───── */
function drawVignettes(now) {
  document.querySelectorAll('canvas[data-vig]').forEach((c) => {
    const g = c.getContext('2d'), mode = c.dataset.vig, W = c.width, H = c.height;
    g.imageSmoothingEnabled = false;
    g.fillStyle = '#3d4229'; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(36,48,31,.4)'; g.fillRect(0, 0, W, H);
    const T = 2600, u = now % T, z = 0.62, k = 0.75;
    const fx = mode === 'composed' ? 70 - Math.min(u, 900) * 0.022 : 56, fy = 48;
    ellipse(g, fx, fy, 15, 4.5, 'rgba(0,0,0,.35)');
    const fireAt = 900, held = mode === 'composed' && u >= fireAt && u < 2200;
    const pull = held ? Math.max(0, Math.sin(((u - fireAt) % 650) / 650 * Math.PI)) : 0;
    if (held) shackle(g, fx, fy, z, k, 'back', pull);
    const im = img(D.art.monsters['bog-slime']);
    const sq = mode === 'pure' && u > fireAt + 150 && u < fireAt + 600 ? Math.sin(((u - fireAt - 150) / 450) * Math.PI) : 0;
    if (ok(im)) { g.save(); g.translate(fx, fy); g.transform(1, 0, 0.4 * pull, 1, 0, 0); g.scale(1 + 0.3 * sq + 0.1 * pull, 1 - 0.35 * sq); g.drawImage(im, -20, -38, 40, 40); g.restore(); }
    if (held) shackle(g, fx, fy, z, k, 'front', pull);
    if (mode === 'composed') { fxClamp(g, fx, fy, u - fireAt, z, k); fxBreak(g, fx, fy, u - 2200, z, k); }
    if (mode === 'pure') {
      const n0 = 2, top = 9;
      if (u < fireAt) pipRow(g, fx, top, n0, k);
      else if (u < fireAt + 150) pipRow(g, fx, top + 3 * ((u - fireAt) / 150), n0, k);
      else if (u < fireAt + 410) pipSplit(g, fx, top, n0, u - fireAt - 150, k);
      else pipRow(g, fx, top, n0 * 2, k);
      fxSurge(g, fx, fy - 14, fy, u - fireAt, k * 0.6);
    }
    // a dagger lands at the firing moment
    if (u > fireAt - 150 && u < fireAt) dagger(g, 4, 30, fx, fy - 14, (u - fireAt + 150) / 150, k);
  });
}

function fightShell(c, teach) {

function fightFrame(sim, t, teachN) {
  const fr = drawFight(sim, t);
  const lf = lastEvent(sim, t, 'fire');
  const teaching = teachN && lf && lf.n <= teachN && t - lf.t < 3400 ? lf : null;
  updateRing(fr.readyAt, t, lf ? lf.t : null, !!teaching);
  updateTF(sim, fr, t);
  const hpT = document.getElementById('hp-text'), hpF = document.getElementById('hp-fill');
  if (hpT) hpT.textContent = isM() ? `${fr.hp}/${RULE.maxHp}` : `${fr.hp} / ${RULE.maxHp}`;
  if (hpF) hpF.style.width = `${(fr.hp / RULE.maxHp) * 100}%`;
  const te = document.getElementById('teach');
  if (te) {
    const u = teaching ? t - teaching.t : -1;
    te.style.opacity = teaching ? String(Math.min(clamp01((u - 250) / 220), clamp01((3400 - u) / 400))) : '0';
    te.style.transform = teaching ? `translateY(${(1 - clamp01((u - 250) / 220)) * -8}px)` : '';
  }
  if (teaching) {                                         // a spark ties the body to the ring
    const u = t - teaching.t;
    if (u > 120 && u < 700) {
      const o = fr.oozes.find((q) => q.id === teaching.id) || frameAt(sim, teaching.t).oozes.find((q) => q.id === teaching.id);
      const ring = document.getElementById('ring');
      if (o && ring) {
        const [ox, oy] = W2S(o.x, o.y);
        const rx = ring.offsetLeft + ring.offsetWidth / 2, ry = ring.offsetTop + ring.offsetHeight / 2;
        const p = ease((u - 120) / 580), sx0 = ox, sy0 = oy - 30 * V().z;
        for (let i = 0; i < 6; i++) {
          const q = Math.max(0, p - i * 0.04);
          const x = sx0 + (rx - sx0) * q, y = sy0 + (ry - sy0) * q - Math.sin(q * Math.PI) * 60;
          ellipse(ctx, x, y, (5 - i * 0.7) * V().k, (5 - i * 0.7) * V().k, hexA(teaching.mode === 'composed' ? COMPOSED.momentColor : AFF, 1 - i * 0.15));

}

    if (ctx) drawIdle(SC.node, SC.t, { seed: NODE_IDS.indexOf(SC.node) + 3, walkIn: true });
    updateRing(0, SC.t, null, false);
    const b = document.getElementById('banner'), dur = D.arrival.durationsMs.discovery;
    if (b) { const p = SC.t / dur; b.style.opacity = String(p < 0.1 ? p / 0.1 : p <= 0.76 ? 1 : Math.max(0, 1 - (p - 0.76) / 0.24)); }
  },
  marks() {
    const bodies = bodiesFor(SC.node, NODE_IDS.indexOf(SC.node) + 3).filter((b) => b.name === nodeBy(SC.node).fieldedByFamily[nodeBy(SC.node).family.id][0]).filter((b) => { const br = rectOf('banner'); if (!br) return true; const [x, y] = W2S(b.x, b.y); const sx = V().cx + x; return !(sx > br.x && sx < br.x + br.w && y - 70 * V().z < br.y + br.h && y > br.y); })
      .sort((a, b) => Math.hypot(a.x, a.y) - Math.hypot(b.x, b.y)).slice(0, 1);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const b of bodies) { const [x, y] = W2S(b.x, b.y); x0 = Math.min(x0, x - 34 * V().z); x1 = Math.max(x1, x + 34 * V().z); y0 = Math.min(y0, y - 80 * V().z); y1 = Math.max(y1, y + 8); }
    return [['terr', 1], [{ x: V().cx + x0, y: y0, w: x1 - x0, h: y1 - y0 }, 2], ['nav-map', 3]];
  },
  autoplay() {
    return [[0, () => { SC.node = NODE_IDS[0]; SC.t = 0; this.build(); }], [6200, () => { SC.node = NODE_IDS[1]; SC.t = 0; this.build(); }], [12400, () => { SC.node = NODE_IDS[2]; SC.t = 0; this.build(); }], [18600, () => {}]];
  },
};
const SCN = { 1: scene1, 2: scene2, 3: scene3, 4: scene4, 5: scene5 };

/* ════════════════════════════════════════════════════════════════════════
   FIRST-TIME OVERLAY — three numbered markers, everything else dimmed.
   ════════════════════════════════════════════════════════════════════════ */
function rectOf(target) {
  if (!target) return null;
  if (typeof target === 'object' && 'x' in target) return target;
  const el = target.startsWith('[') ? document.querySelector('#frame ' + target) : document.getElementById(target);
  if (!el) return null;
  const f = document.getElementById('frame').getBoundingClientRect(), r = el.getBoundingClientRect(), s = scale();
  return { x: (r.left - f.left) / s, y: (r.top - f.top) / s, w: r.width / s, h: r.height / s };
}
function renderFTO() {
  const box = document.getElementById('fto'); if (!box) return;
  if (!S.first) { box.innerHTML = ''; return; }
  const vw = V();
  const marks = (SCN[S.scene].marks() || []).map(([t, n]) => ({ r: rectOf(t), n })).filter((m) => m.r);
  const pad = 6;
  box.innerHTML = `<svg width="${vw.w}" height="${vw.h}" style="position:absolute;inset:0"><defs><mask id="ftm"><rect width="100%" height="100%" fill="#fff"/>${marks.map((m) => `<rect x="${m.r.x - pad}" y="${m.r.y - pad}" width="${m.r.w + pad * 2}" height="${m.r.h + pad * 2}" rx="6" fill="#000"/>`).join('')}</mask></defs>
    <rect width="100%" height="100%" fill="rgba(6,5,4,.74)" mask="url(#ftm)"/>${marks.map((m) => `<rect x="${m.r.x - pad}" y="${m.r.y - pad}" width="${m.r.w + pad * 2}" height="${m.r.h + pad * 2}" rx="6" fill="none" stroke="#e0c070" stroke-width="2"/>`).join('')}</svg>
    ${marks.map((m) => `<div class="num" style="left:${Math.max(16, m.r.x - pad)}px;top:${Math.max(16, m.r.y - pad)}px">${m.n}</div>`).join('')}`;
}

/* ════════════════════════════════════════════════════════════════════════
   CHROME, SCALING, LOOP
   ════════════════════════════════════════════════════════════════════════ */
function scale() { return parseFloat(document.getElementById('frame').dataset.scale || '1'); }
function fit() {
  const st = document.getElementById('stage'), vw = V(), wrap = document.getElementById('frame-wrap'), fr = document.getElementById('frame');
  const pad = S.embed ? 0 : 20;
  const s = Math.min((st.clientWidth - pad * 2) / vw.w, (st.clientHeight - pad * 2) / vw.h);
  fr.style.transform = `scale(${s})`; fr.dataset.scale = String(s);
  wrap.style.width = vw.w * s + 'px'; wrap.style.height = vw.h * s + 'px';
  wrap.style.left = (st.clientWidth - vw.w * s) / 2 + 'px'; wrap.style.top = (st.clientHeight - vw.h * s) / 2 + 'px';
}
window.addEventListener('resize', () => { fit(); renderFTO(); });
function chrome() {
  document.body.classList.toggle('embed', S.embed);
  document.getElementById('sceneSeg').innerHTML = SCENES.map((s) => `<button data-s="${s.n}" class="${S.scene === s.n ? 'on' : ''}">${s.n} · ${s.short}</button>`).join('');
  document.getElementById('viewSeg').innerHTML = ['desktop', 'portrait'].map((v) => `<button data-v="${v}" class="${S.view === v ? 'on' : ''}">${v === 'desktop' ? 'Desktop 1280×720' : 'Portrait 390×844'}</button>`).join('');
  document.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => go({ scene: +b.dataset.s })));
  document.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => go({ view: b.dataset.v })));
  const chk = document.getElementById('firstChk'); chk.checked = S.first; chk.onchange = () => go({ first: chk.checked });
}
function enterScene() {
  chrome();
  const sc = SCN[S.scene];
  director = null;
  clearSceneTimers();
  sc.init();
  if (S.first) sc.keyframe();
  sc.build();
  sc.frame(0);
  later(() => { renderFTO(); }, 60);
  if (S.embed && !S.first) { const steps = sc.autoplay(); const len = steps[steps.length - 1][0]; director = { steps, len, start: performance.now(), i: 0 }; }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(100, now - last); last = now;
  if (director) {
    const e = now - director.start;
    while (director && director.i < director.steps.length && director.steps[director.i][0] <= e) director.steps[director.i++][1]();
    if (director && director.len > 0 && e >= director.len) { director.start = now; director.i = 0; }
  }
  const sc = SCN[S.scene];
  try { sc.frame(S.first ? 0 : dt); } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
readHash();
enterScene();
requestAnimationFrame(loop);
window.__proto = { S, SIM, go, keyTimes, get SC() { return SC; }, rebuild: () => SCN[S.scene].build(), stopDirector: () => { director = null; } };
</script>
