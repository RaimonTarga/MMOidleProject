<style>
/* The comparison page: every scene of every prototype as a live iframe, the thesis under
   each, then the reviewer's matrix. Dark like the game the prototypes mock. */
:root{
  color-scheme:dark;
  --bg:#14120f; --panel:#1d1a16; --panel2:#24201b; --line:#3a332b; --line2:#4d4437;
  --ink:#ece4d4; --ink2:#a99e8a; --ink3:#6f6656; --gold:#d9b25c; --gold2:#8a6d2b;
  --yes:#9be564; --partly:#e8c15a; --no:#e07a5f;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;padding:16px 16px 64px}
h1,h2,h3{font-family:"Alegreya SC","IBM Plex Sans",serif;font-weight:500;margin:0;text-wrap:balance}
a{color:var(--gold)}
.wrap{max-width:1600px;margin:0 auto;display:grid;gap:18px}
.top{display:grid;gap:6px}
.top h1{font-size:24px;color:var(--gold)}
.top p{margin:0;color:var(--ink2);max-width:90ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.group{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.group .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink2);padding:6px 11px;border-radius:4px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--line2);color:var(--ink)}
.btn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold2)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.scene-q{color:var(--ink2);margin:0;max-width:110ch}
.scene-q b{color:var(--ink)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;overflow:hidden;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.card header h2{font-size:16px;min-width:0}
.card header h2 .letter{color:var(--gold);margin-right:6px}
.card header a{font-size:12px;white-space:nowrap}
.frame{position:relative;background:#000;aspect-ratio:var(--aspect,16/9)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.under{padding:10px 12px;display:grid;gap:8px;align-content:start}
.thesis{margin:0;color:var(--ink2);font-size:13px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.v-yes{border-color:var(--yes);color:var(--yes)}
.v-partly{border-color:var(--partly);color:var(--partly)}
.v-no{border-color:var(--no);color:var(--no)}
.why{margin:0;font-size:12px;color:var(--ink3)}
.crit{margin:0;font-size:13px;color:var(--ink);border-left:3px solid var(--gold2);padding-left:8px}
section.matrix{display:grid;gap:10px}
section.matrix h2{font-size:20px;color:var(--gold)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:1560px;font-size:13px}
th,td{min-width:150px}
th:first-child,td:first-child{min-width:110px}
th:nth-last-child(2),td:nth-last-child(2){min-width:240px}
th:last-child,td:last-child{min-width:300px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);background:var(--panel2);font-weight:500}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td .why{display:block;margin-top:2px}
tr:last-child td{border-bottom:0}
.note{color:var(--ink3);font-size:12px;margin:0}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.lists .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}

.lists ul{margin:0;padding-left:18px;display:grid;gap:5px;color:var(--ink2)}

<script>
// ─── Review data (the conductor's; filled after the builds) ──────────────────
const Y = 'yes', P = 'partly', N = 'no';
const s = (facts, d, p, why) => ({ facts, sound: { d, p }, why });
const REVIEW = {
  intro: 'Five interactive prototypes of the lineage UI, each built by a separate builder from one design thesis, against the same five scenes (<a href="SCENES.md">SCENES.md</a>) and the same data export (<a href="data.json">data.json</a>, generated from the client\'s own models). Each frame below is the prototype itself, live, in its <code>embed</code> mode: it plays the scene on a loop. "Open interactive" opens it with its own controls. The report is <a href="../../docs/briefs/ui-prototypes-report-2026-10-04.md">docs/briefs/ui-prototypes-report-2026-10-04.md</a>.',

      files: ['RhythmReadout.tsx (+model, css)', 'new TeachingLine.tsx', 'cardWord.ts (retired)', 'lineagePayloadFx.ts', 'auraDefs.ts', 'lineagePayloadStates.ts', 'cameraZoom.ts', 'TargetFrame.tsx', 'targetStatusMeta.ts', 'statusHelp.ts', 'MaterialsPanel.tsx', 'MenuButtons.tsx', 'MobileHUD.tsx', 'CraftingPanel.tsx', 'MakeTab.tsx', 'new GearTab.tsx', 'LineageTreePanel.tsx', 'weaponPageModel.ts', 'weaponPage.css', 'tutorial/director.ts', '+ shared sentence halves'],

    },

      files: ['new CardHand.tsx (replaces RhythmReadout)', 'cardHandModel.ts', 'cardHand.css', 'cardWord.ts', 'new cardThread.ts', 'shared sentences.ts (sentence parts)', 'weaponPageModel.ts', 'LineageTreePanel.tsx', 'weaponPage.css', 'MenuButtons.tsx', 'new GearPanel.tsx', 'MobileHUD.tsx', 'BuffBar.tsx', 'TargetFrame.tsx', 'targetStatusMeta.ts', 'statusHelp.ts', 'tutorial director + TutorialPanel', 'shared tutorial script', 'MakeTab.tsx', 'AreaInformation.tsx', 'client/index.html'],

      files: ['RhythmReadout.tsx (deleted)', 'rhythmReadoutModel.ts', 'BuffBar.tsx', 'TargetFrame.tsx + css', 'targetStatusMeta.ts', 'statusHelp.ts', 'cardWord.ts', 'new worldBadges.ts', 'new weaponCharge.ts', 'render/players.ts', 'new groundMark.ts', 'lineagePayloadFx.ts', 'lineagePayloadStates.ts', 'auraDefs.ts', 'cameraZoom.ts', 'LineageTreePanel.tsx', 'weaponPage.css', 'weaponPageModel.ts', 'new PairPlate.tsx', 'new GearPanel.tsx', 'MenuButtons.tsx', 'MaterialsPanel.tsx', 'MobileHUD.tsx', 'MakeTab.tsx', 'tutorial director + TutorialPanel', 'shared tutorial script', 'new nodeShardProps.ts + art'],

      critique: 'The best weapon page (its plate teaches the world\'s visual vocabulary) and the cleanest HUD. It is also the thesis most at the mercy of sprite size, needs a new phone camera to work at all, and cannot say which card is talking once a second verb, a frame window or an amplifier shares the blade.',

      scenes: {
        1: s('14 / 4', Y, Y, 'Text; the column\'s Weapon section is also a door to the page.'),
        2: s('72 / 42', Y, Y, 'Text. The most compact page: one row per card, so Tier 1, a collapsed Tier 2 and the gate fit on one screen.'),
        3: s('D 13·13·13 | 14·15·15 · P 5·5·5 | 6·7·7', Y, P, 'Fixed homes read on desktop (Target: owes / slowed / held), though the 27 px clock is 350–450 px from the bodies. The phone spine keeps icons and numbers, no words.'),
        4: s('14 → 13 / 6 → 5', Y, P, 'The verb row flashes with a tether to the body for #1–#3 and keeps its name; the closed phone spine has no names.'),

      scenes: {
        1: s('7 / 1', Y, Y, 'Text.'),
        2: s('69 / 31', Y, Y, 'Text, plus a beat line on every verb card drawn like the HUD strip, so the strip is learnt on the page (no legend for it yet).'),

      },
      portrait: { verdict: 'good', cls: Y, why: 'The strip as the top bar\'s second row is the best phone home any thesis found for a rhythm element.' },
      files: ['new BeatStrip.tsx (replaces RhythmReadout)', 'beatStripModel.ts', 'beatStrip.css', 'StatPlate.tsx', 'StatPanel.tsx', 'client/index.html', 'main.ts', 'MobileHUD.tsx', 'MenuButtons.tsx', 'new GearTab.tsx', 'LineageTreePanel.tsx', 'weaponPageModel.ts', 'weaponPage.css', 'cardWord.ts (removed)', 'combatFx.ts', 'BuffBar.tsx', 'targetStatusMeta.ts', 'statusHelp.ts', 'areaInformationModel.ts', 'shared anchors.ts, concepts.ts, classScript.ts', 'tutorial director', '+ node spawn order to the client'],

    '<b>The two-colour sentence</b>: the moment half in the verb\'s lane colour, the payload half in the lean\'s. All five built it; all five split the string, so ship the halves from shared (<code>composedSentence</code> parts), never parse text.',
    '<b>B\'s teaching thread</b>: on firings #1–#3 the card (or ring, or row) sends a line to the body it hit, then stops. Counted only when the fight was on screen (A\'s rule).',

    '<b>D\'s compact row layout</b> for the page: Tier 1, a collapsed Tier 2 and the gate on one screen.',
    '<b>A\'s "coming" state</b>: the last second of a cap clock brightens and pulses. B found the reason: with a 500 ms swing and a 5 s cap, the ✦ ready state almost never shows, so the clock IS the forecast.',

    '<b>Node identity</b>: D\'s permanent territory line; B\'s glint of the cards whose shard this node pays; E\'s spawn-order silhouettes before the first pull.',

const PROTOTYPES = [
  { x: 'a', name: 'Nothing but the ring', thesis: 'The HUD shows one ring per active verb and nothing else about cards. Every other fact lives on the page or the target. Teaching is one transient line of text, three times, then never. The bet: the body fx alone carry the payoff.' },
  { x: 'b', name: 'The card is the HUD', thesis: 'The active lean and verb sit on the HUD as two small cards that light when they fire; no rings. The sentence the player bought is always on screen. The bet: players read the thing they chose, not an abstraction of it.' },
  { x: 'c', name: 'Body first, book second', thesis: 'No HUD element for cards at all. Anticipation and payoff are in the world: the weapon\'s glow builds, the ground marks, the target\'s badge grows. The page is a book the player opens from a tab. The bet: §24.1 taken literally.' },
  { x: 'd', name: 'The dense sidebar', thesis: 'A classic MMO side panel, always visible on desktop, a drawer on portrait: cards, their state, the target\'s effects, the node\'s shard, in one ordered column. The bet: density is fine when it is ordered and never moves.' },
  { x: 'e', name: 'The beat strip', thesis: 'A horizontal strip near the HP bar showing the next few hits as ticks, the one that fires the verb marked, the lane colour on it; fired hits scroll off. No rings, no callouts. The bet: rhythm reads better as a line than a circle.' },
];

  { n: 1, name: 'Finding the tree', q: 'Where does the player go to see their cards? <b>Key frame:</b> the Gear tab open, before the weapon is pressed.' },
  { n: 2, name: 'The weapon page', q: 'The Poison Dagger at Tier 1: lean row, verb row, the locked Tier 2 rows, the gate. Press Into the Wound to buy it. <b>Key frame:</b> the page as it opens.' },
  { n: 3, name: 'A fight', q: 'Three facts to place: <b>the verb is coming</b>, <b>the verb landed</b>, <b>the lasting state on the target</b>. The embed loops the pure pair (Coated Edge + Into the Wound) and the composed pair (Tendon Cut + Into the Wound) against two Mire Oozes.' },

const VIEWS = [
  { key: 'desktop', label: 'Desktop 1280', aspect: '16/9', cols: 2 },
  { key: 'portrait', label: 'Portrait 390', aspect: '390/844', cols: 5 },
];

// ─── State, from and to the hash ─────────────────────────────────────────────
const state = { scene: 1, view: 'desktop', first: 0, cols: 2 };
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const n = Number(p.get('scene'));
  if (n >= 1 && n <= 5) state.scene = n;
  if (p.get('view') === 'portrait' || p.get('view') === 'desktop') state.view = p.get('view');
  state.first = p.get('first') === '1' ? 1 : 0;
  const c = Number(p.get('cols'));
  state.cols = c >= 1 && c <= 5 ? c : VIEWS.find((v) => v.key === state.view).cols;
}
function writeHash() {
  history.replaceState(null, '', `#scene=${state.scene}&view=${state.view}&first=${state.first}&cols=${state.cols}`);
}

// ─── Controls ────────────────────────────────────────────────────────────────
function button(label, pressed, onClick, title) {
  const b = document.createElement('button');
  b.className = 'btn';
  b.type = 'button';
  b.textContent = label;
  if (title) b.title = title;
  b.setAttribute('aria-pressed', String(pressed));
  b.addEventListener('click', onClick);
  return b;
}
function renderControls() {
  const fill = (id, items) => {
    const g = document.getElementById(id);
    g.querySelectorAll('button').forEach((b) => b.remove());
    items.forEach((b) => g.appendChild(b));
  };
  fill('scenes', SCENES.map((s) => button(`${s.n} · ${s.name}`, state.scene === s.n, () => { state.scene = s.n; update(); })));
  fill('views', VIEWS.map((v) => button(v.label, state.view === v.key, () => { state.view = v.key; state.cols = v.cols; update(); })));
  fill('firsts', [
    button('Off', !state.first, () => { state.first = 0; update(); }),
    button('On', !!state.first, () => { state.first = 1; update(); }, 'Each prototype overlays what the eye should land on first, second, third'),
  ]);
  fill('colsg', [1, 2, 3, 5].map((c) => button(String(c), state.cols === c, () => { state.cols = c; update(); })));
}

// ─── The grid of live iframes ────────────────────────────────────────────────
function pill(text, cls) {
  const s = document.createElement('span');
  s.className = `pill ${cls || ''}`;
  s.innerHTML = text;
  return s;
}
function renderGrid() {
  const grid = document.getElementById('grid');
  const view = VIEWS.find((v) => v.key === state.view);
  grid.style.setProperty('--cols', state.cols);
  grid.innerHTML = '';
  const scene = SCENES[state.scene - 1];
  document.getElementById('sceneq').innerHTML = `<b>Scene ${scene.n} · ${scene.name}.</b> ${scene.q}`;
  for (const p of PROTOTYPES) {
    const r = REVIEW.prototypes[p.x] || {};
    const sc = (r.scenes && r.scenes[state.scene]) || {};
    const card = document.createElement('article');
    card.className = 'card';
    const hash = `scene=${state.scene}&view=${state.view}&first=${state.first}&embed=1`;
    const full = `${p.x}/index.html#scene=${state.scene}&view=${state.view}&first=${state.first}&embed=0`;
    card.innerHTML = `
      <header><h2><span class="letter">${p.x.toUpperCase()}</span>${p.name}</h2>
        <a href="${full}" target="_blank" rel="noopener">Open interactive ↗</a></header>
      <div class="frame" style="--aspect:${view.aspect}">
        <iframe title="Prototype ${p.x.toUpperCase()}, scene ${state.scene}, ${state.view}" loading="lazy" src="${p.x}/index.html#${hash}"></iframe>
      </div>
      <div class="under"></div>`;
    const under = card.querySelector('.under');
    const thesis = document.createElement('p');
    thesis.className = 'thesis';
    thesis.textContent = p.thesis;
    under.appendChild(thesis);
    const stats = document.createElement('div');
    stats.className = 'stats';
    if (sc.facts !== undefined) stats.appendChild(pill(`card facts <b>${sc.facts}</b>`));
    if (sc.sound) {
      const verdict = state.view === 'portrait' ? sc.sound.p : sc.sound.d;
      stats.appendChild(pill(`sound off, ${state.view === 'portrait' ? 'phone' : 'desktop'}: <b>${verdict}</b>`, `v-${verdict}`));
    }
    if (stats.children.length) under.appendChild(stats);
    if (sc.why) {
      const why = document.createElement('p');
      why.className = 'why';
      why.textContent = sc.why;
      under.appendChild(why);
    }
    if (r.critique) {
      const c = document.createElement('p');
      c.className = 'crit';
      c.textContent = r.critique;
      under.appendChild(c);
    }
    grid.appendChild(card);
  }
}

// ─── The matrix ──────────────────────────────────────────────────────────────
function renderMatrix() {
  document.getElementById('mxnote').textContent = REVIEW.matrixNote;
  const t = document.getElementById('matrix');
  const head = `<tr><th>Prototype</th>${SCENES.map((s) => `<th>${s.n} · ${s.name}<br>facts · sound off</th>`).join('')}
    <th>Portrait fit</th><th>Client files touched</th><th>Reviewer's critique</th></tr>`;
  const rows = PROTOTYPES.map((p) => {
    const r = REVIEW.prototypes[p.x] || {};
    const cells = SCENES.map((s) => {
      const sc = (r.scenes && r.scenes[s.n]) || {};
      const facts = sc.facts !== undefined ? String(sc.facts) : '—';
      const sound = sc.sound
        ? `<span class="pill v-${sc.sound.d}">D ${sc.sound.d}</span> <span class="pill v-${sc.sound.p}">P ${sc.sound.p}</span>` : '';
      return `<td><div class="num" style="text-align:left">${facts}</div><div style="margin-top:4px">${sound}</div>${sc.why ? `<span class="why">${sc.why}</span>` : ''}</td>`;
    }).join('');
    const fit = r.portrait ? `<span class="pill v-${r.portrait.cls}">${r.portrait.verdict}</span><span class="why">${r.portrait.why || ''}</span>` : '—';
    const files = r.files ? `<b>${r.fileCount || r.files.length}</b><span class="why">${r.files.join(', ')}</span>` : '—';
    return `<tr><td><b>${p.x.toUpperCase()} · ${p.name}</b></td>${cells}<td>${fit}</td><td>${files}</td><td>${r.critique || '—'}</td></tr>`;
  }).join('');
  t.innerHTML = head + rows;
}

function renderLists() {
  const el = document.getElementById('lists');
  const block = (title, items) => items.length
    ? `<div class="panel"><h3>${title}</h3><ul>${items.map((i) => `<li>${i}</li>`).join('')}</ul></div>` : '';
  el.innerHTML = block('Worth reusing across theses', REVIEW.reuse) + block('What no thesis solved', REVIEW.unsolved);
}

function update() {
  writeHash();
  renderControls();
  renderGrid();
}

readHash();
document.getElementById('intro').innerHTML = REVIEW.intro;
renderMatrix();
renderLists();
update();
window.addEventListener('hashchange', () => { readHash(); renderControls(); renderGrid(); });
</script>
</body>
