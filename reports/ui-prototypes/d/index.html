<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dense Sidebar · D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens: the mockup's palette plus the client's HUD materials ─────────── */
:root{
  --bg:#14120f; --panel:#1d1a16; --panel2:#24201a; --ctrl:#2a2620; --inset:#0b0a08;
  --ink:#ece4d4; --ink2:#cfc5b2; --muted:#958a75; --dim:#5f574a;
  --gold:#d9b25c; --gold2:#f0cf7a;
  --edge:#3b352b; --edge2:#5f5341; --edgeD:#070605;
  --danger:#e4705e; --ok:#7fd48f; --rot:#b98ae0;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --sc:'Alegreya SC',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --display:'Cinzel','Palatino Linotype',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0908;color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
img.px{image-rendering:pixelated}

/* ── Prototype chrome (outside the game frame) ─────────────────────────────── */
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:#12100d;border-bottom:1px solid #2c271f;font-size:12px}
#bar .brand{font:700 15px var(--sc);color:var(--gold);letter-spacing:.04em;white-space:nowrap}
#bar .brand b{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:6px;border:1px solid var(--gold);color:var(--gold2);font-family:var(--display)}
.grp{display:flex;gap:2px;background:#0b0a08;border:1px solid #2c271f;padding:2px}
.tb{padding:5px 10px;border:0;background:transparent;color:#b8ad98;cursor:pointer;white-space:nowrap;border-radius:2px}
.tb:hover{background:#221e18;color:var(--ink)}
.tb.on{background:#3a3223;color:var(--gold2);box-shadow:inset 0 0 0 1px #6b5a36}
.tb[disabled]{opacity:.4;cursor:default}
.tb.solo{border:1px solid #2c271f;background:#0b0a08}
.ctl-note{color:#8f8571;font-size:11px}
.ctl-count{font:600 12px var(--mono);color:var(--gold2);padding:0 6px}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(ellipse at 50% 40%,#17140f,#0a0908 70%)}
#frameWrap{position:relative;flex:none;box-shadow:0 0 0 1px #2c271f,0 20px 60px rgba(0,0,0,.6)}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--ink);user-select:none}
#aside{width:330px;flex:none;overflow:auto;padding:14px 16px 24px;background:#100e0b;border-left:1px solid #2c271f;font-size:12.5px;line-height:1.5;color:#c9bfab}
#aside h2{font:700 16px var(--sc);color:var(--gold);margin-bottom:6px;letter-spacing:.03em}
#aside h3{font:700 12px var(--sc);color:var(--gold2);margin:14px 0 4px;letter-spacing:.08em}
#aside p{margin-bottom:7px}
#aside ol{padding-left:18px}
#aside li{margin-bottom:3px}
#aside .meter{display:flex;justify-content:space-between;align-items:baseline;padding:5px 8px;margin-top:4px;background:#1a1712;border:1px solid #2c271f}
#aside .meter b{font:600 15px var(--mono);color:var(--gold2)}
#aside .q{color:var(--ink);font-style:italic}
#aside .k{color:var(--gold2)}
#aside small{color:#8f8571}
body.embed #bar,body.embed #aside{display:none}
body.embed #stage{padding:0;background:#000}
body.embed #frameWrap{box-shadow:none}
@media (max-width:1100px){#aside{display:none}}

/* ── Frame: shared game furniture ─────────────────────────────────────────── */
.v-desktop{width:1280px;height:720px}
.v-portrait{width:390px;height:844px}
.rail{position:absolute;top:0;bottom:0;width:260px;background:linear-gradient(90deg,rgba(255,240,200,.025),transparent 8%,transparent 92%,rgba(0,0,0,.3)),linear-gradient(135deg,#1a1712,#110f0c 40%,#0e0c0a);overflow:hidden}
.rail-l{left:0;border-right:1px solid #050403;box-shadow:inset -1px 0 #2d2820}
.rail-r{right:0;border-left:1px solid #050403;box-shadow:inset 1px 0 #2d2820;padding:8px;display:flex;flex-direction:column;gap:7px}
.canvas{position:absolute;left:260px;right:260px;top:0;bottom:0;overflow:hidden;background:#0d0f0a}
.panel{background:linear-gradient(180deg,#25211a,#1d1a15 60%,#191612);border:1px solid var(--edgeD);border-top-color:#4a4134;border-left-color:#3d362b;box-shadow:inset 0 0 0 1px rgba(255,240,200,.025),0 2px 5px rgba(0,0,0,.35)}
.ptitle{display:flex;align-items:center;justify-content:space-between;height:24px;padding:0 8px;font:700 11.5px/1 var(--sc);letter-spacing:.1em;color:var(--gold);background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,240,200,.03),rgba(0,0,0,.25));border-bottom:1px solid #0a0907}

/* Right rail: guide, behaviour, navigation (the client's shell, unchanged but for Gear) */
.guide{padding-bottom:8px}
.guide .chap{margin:7px 9px 4px;font:600 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.guide .line{margin:0 9px;font-size:12px;line-height:1.45;color:var(--ink)}
.guide .line + .line{margin-top:6px}
.guide .line.check{color:var(--ink2);font-size:11.5px}
.guide .line.check::before{content:'✓ ';color:var(--ok)}
.guide .acts{display:flex;gap:6px;margin:9px 9px 0}
.guide .route{display:flex;gap:3px;margin:8px 9px 0}
.guide .route i{flex:1;height:4px;background:#3a3328}
.guide .route i.done{background:var(--gold)}
.guide.collapsed .line,.guide.collapsed .acts{display:none}
.gbtn{padding:5px 12px;border:1px solid #6b5a36;background:linear-gradient(#3a3223,#2c261b);color:var(--gold2);font-size:11.5px;font-weight:600;cursor:pointer}
.gbtn.ghost{border-color:var(--edge2);background:#221e18;color:var(--ink2)}
.stopbtn{font:500 10px var(--sans);letter-spacing:.04em;color:var(--muted);background:none;border:0;text-transform:none}
.behav{padding:8px}
.autobar{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border:1px solid #3a5a3a;background:#14201a;font-size:12px;font-weight:600;color:#bfe6c4}
.autobar b{font-family:var(--mono);color:var(--ok)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px}
.navb{position:relative;display:flex;align-items:center;gap:7px;height:36px;padding:0 8px;border:1px solid #0c0a07;border-top-color:#4a4134;border-left-color:#3d362b;background:linear-gradient(#2c271f,#221e18);font-size:11.5px;color:var(--ink2);cursor:pointer;text-align:left}
.navb .ic{width:20px;text-align:center;color:var(--gold);font-size:14px}
.navb .ic img{width:20px;height:20px;display:block}
.navb:hover,.navb.on{border-color:#6b5a36;color:var(--gold2)}
.navb.on{background:linear-gradient(#3a3223,#2a241a)}
.navb .badge{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--gold2);box-shadow:0 0 6px var(--gold)}
.navb.press{transform:translateY(1px);filter:brightness(1.3)}

/* Canvas overlays (shell): biome XP top-right, Auto Combat bottom-centre */
.xpbar{position:absolute;top:12px;right:12px;width:230px;padding:7px 9px;background:rgba(20,18,13,.94);border:1px solid #3b352b;border-right-color:#070605;border-bottom-color:#070605;font:600 10.5px var(--mono);color:var(--ink2);z-index:12}
.xpbar .hd{display:flex;justify-content:space-between;margin-bottom:4px}
.xpbar .tr{height:6px;background:#0b0a08;border:1px solid #333}
.xpbar .tr i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#6b8f3a,#9be564)}
.autoc{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 16px;background:linear-gradient(#2c271f,#1f1b15);border:2px solid #4a4134;border-right-color:#0c0a07;border-bottom-color:#0c0a07;font:600 12px var(--mono);color:var(--gold);z-index:12}
.autoc b{color:var(--ok)}
.toastline{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);max-width:520px;padding:8px 14px;background:var(--inset);border:1px solid var(--gold);color:var(--ink);font-size:12.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.55);z-index:45;pointer-events:none;opacity:0;transition:opacity .2s}
.toastline.show{opacity:1}
.toastline.warn{border-color:var(--danger)}
.toastline.proto{border-style:dashed;border-color:#8f8571;color:#cfc5b2;font-style:italic}

/* ── THE COLUMN (thesis D): fixed sections, fixed order, fixed row heights ── */
.col{display:flex;flex-direction:column;gap:6px;padding:8px}
.sec{position:relative;flex:none;padding:0 7px 7px}
.sec-h{display:flex;align-items:center;justify-content:space-between;height:23px;margin:0 -7px 0;padding:0 8px;font:700 11.5px/1 var(--sc);letter-spacing:.12em;color:var(--gold);background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,240,200,.035),rgba(0,0,0,.28));border-bottom:1px solid #0a0907}
.sec-h .ix{font:600 9px var(--mono);color:#7d7058;letter-spacing:0;margin-right:6px}
.sec-link{border:1px solid #5a4b30;background:#2a241a;color:var(--gold2);font:600 9.5px var(--sans);letter-spacing:.06em;padding:2px 7px;cursor:pointer;text-transform:uppercase}
.sec-link:hover,.sec-link.on{background:#3a3223;border-color:var(--gold)}
/* YOU */
.you{height:84px}
.you .nm{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font:700 14px var(--sc);color:#9fe0a8}
.you .nm span{font:600 11.5px var(--mono);color:var(--ink)}
.hpbar{position:relative;height:12px;margin-top:4px;background:#0b0a08;border:1px solid #3a342a;overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#5ee36a,#2fa23d);transition:width .18s linear}
.hpbar.hurt i{background:linear-gradient(#ff8a6a,#d9442f)}
.you .st{display:flex;gap:10px;margin-top:6px;font:500 10.5px var(--mono);color:var(--muted)}
.you .st b{color:var(--ink2);font-weight:600}
/* WEAPON */
.wpn{display:flex;align-items:center;gap:8px;height:36px;margin-top:5px;cursor:pointer}
.wpn .ic{width:34px;height:34px;display:grid;place-items:center;background:var(--inset);border:1px solid #4a4134}
.wpn .ic img{width:32px;height:32px}
.wpn b{display:block;font:700 13.5px/1.1 var(--sc);color:var(--gold2)}
.wpn small{display:block;font-size:10px;color:var(--muted);letter-spacing:.04em}
.crow{position:relative;margin-top:5px;padding:4px 6px 5px 10px;background:var(--ctrl);border:1px solid #3a342a;overflow:hidden}
.crow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lane,#4a4236)}
.crow-lean{height:66px}
.crow-verb{height:82px}
.crow-verb .crow-k,.crow-verb .crow-n{padding-right:58px}
.crow-k{display:block;height:12px;font:600 8.5px/12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#857a65}
.crow-n{display:block;height:16px;font:700 13.5px/16px var(--sc);color:var(--lane,var(--dim));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-s{display:block;font:400 11px/14px var(--sans);color:var(--ink2)}
.crow-lean .crow-s{height:28px}
.crow-verb .crow-s{height:42px}
.crow.empty .crow-n{color:var(--dim)}
.crow.empty .crow-s{color:var(--dim);font-style:italic}
.crow.filled{animation:fillslot 1.1s ease-out}
@keyframes fillslot{0%{background:#4a3f22;box-shadow:inset 0 0 0 1px var(--gold2)}100%{background:var(--ctrl);box-shadow:none}}
.crow.fire{box-shadow:inset 0 0 0 1px var(--lane),0 0 14px -2px var(--lane)}
.crow.fire .crow-n{text-shadow:0 0 8px var(--lane)}
.crow.teach{outline:2px solid var(--gold2);outline-offset:1px;animation:teachpulse 1.2s ease-in-out infinite}
@keyframes teachpulse{50%{outline-color:rgba(240,207,122,.35)}}
.h-moment,.h-payload,.h-whole{color:color-mix(in srgb,var(--hc) 80%,var(--ink))}
.crow .glyph{position:absolute;right:36px;top:9px;width:18px;height:18px;padding:1px;border-radius:3px;background:#0b0a08;border:1px solid #4a4134;z-index:2}
/* the verb's clock: the rhythm ring, moved into its row */
.ring{position:absolute;right:5px;top:3px;width:27px;height:27px}
.ring svg{width:100%;height:100%;overflow:visible;display:block}
.ring .tr{fill:rgba(10,9,7,.8);stroke:rgba(255,255,255,.12);stroke-width:4}
.ring .fl{fill:none;stroke:var(--rc,var(--gold));stroke-width:4;transform:rotate(-90deg);transform-origin:20px 20px}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;font:600 10px/1 var(--mono);color:var(--ink)}
.ring.ready .rt{font-size:14px;color:var(--rc)}
.ring.ready svg{filter:drop-shadow(0 0 3px var(--rc))}
.ring.ghost{opacity:.22;filter:grayscale(1)}
.ring.flash::after{content:'';position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 0 2px var(--rc),0 0 14px 3px var(--rc);opacity:var(--fo,0)}
/* TARGET */
.tgt{height:136px}
.tg-head{display:flex;justify-content:space-between;align-items:baseline;height:17px;margin-top:5px;font-size:12px}
.tg-head .n{font-weight:600;color:var(--ink)}
.tg-head .n.none{color:var(--dim);font-weight:400;font-style:italic}
.tg-head .h{font:500 10.5px var(--mono);color:var(--muted)}
.tgbar{height:6px;margin:2px 0 5px;background:#0b0a08;border:1px solid #333}
.tgbar i{display:block;height:100%;background:#7aa83f;transition:width .15s linear}
.fx{position:relative;display:grid;grid-template-columns:22px 1fr auto;align-items:center;column-gap:7px;height:22px;margin-top:2px;padding:0 6px 0 3px;background:rgba(0,0,0,.18);border:1px solid #2c271f;transition:opacity .15s}
.fx::before{content:'';position:absolute;left:-1px;top:3px;bottom:3px;width:3px;background:var(--src,transparent)}
.fx img{width:18px;height:18px;display:block;border-radius:3px}
.fx .l{font-size:11.5px;font-weight:600;color:var(--fc,var(--ink))}
.fx .v{font:600 12px var(--mono);color:var(--ink);white-space:nowrap}
.fx .v small{font:500 9px var(--sans);color:var(--muted);margin-left:3px;letter-spacing:.04em}
.fx .v .ba{color:var(--gold2)}
.fx .t{position:absolute;left:0;bottom:-1px;height:2px;background:var(--fc,#888);opacity:.8}
.fx.off{background:transparent;border-color:#221e18}
.fx.off img{opacity:.16;filter:grayscale(1)}
.fx.off .l,.fx.off .v,.fx.off .t{visibility:hidden}
.fx.jump{background:rgba(155,229,100,.18)}
/* HERE */
.here{height:84px}
.here .node{margin-top:6px;height:17px;font:700 13px/17px var(--sc);color:var(--ink)}
.here .terr{display:flex;align-items:center;gap:6px;height:20px;font-size:11.5px;color:var(--ink2)}
.here .terr img{width:16px;height:16px}
.here .terr strong{color:#f0d6a7;font-weight:600}
.here .mix{height:15px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.here.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{box-shadow:inset 0 0 0 1px var(--gold2),0 0 16px -4px var(--gold)}100%{box-shadow:none}}
/* PURSE */
.purse{height:82px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.pc{position:relative;display:flex;align-items:center;gap:4px;height:22px;padding:0 5px;background:rgba(0,0,0,.22);border:1px solid #2c271f;font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.pc img{width:15px;height:15px;flex:none}
.pc .orb{width:11px;height:11px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e3c6ff,var(--rot) 55%,#4a2a66);margin:0 2px}
.pc .gl{width:11px;height:11px;flex:none;border-radius:2px 6px 2px 6px;background:radial-gradient(circle at 40% 40%,#b9d98a,#4f6d2c);margin:0 2px}
.pc b{margin-left:auto;font:600 11px var(--mono);color:var(--ink)}
.pc.herec{border-color:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.pc.herec::after{content:'';position:absolute;right:0;top:0;border:5px solid transparent;border-top-color:var(--c);border-right-color:var(--c)}
.pc.gain{background:color-mix(in srgb,var(--c) 22%,transparent)}
.pc.gain .pw{font:600 10px var(--mono);color:var(--c)}
/* shell remnants under the column */
.rest{margin:0 8px;display:flex;flex-direction:column;gap:5px}
.rest div{height:24px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;font:700 11px var(--sc);letter-spacing:.1em;color:#8b7c5c}
/* Grid view: draw the fixed slots */
.show-grid [data-slot]{outline:1px dashed rgba(240,207,122,.55);outline-offset:-1px}
.show-grid .sec[data-slot]::after{top:4px;bottom:auto;right:56px}
.show-grid [data-slot]::after{content:attr(data-slot);position:absolute;right:2px;bottom:1px;font:600 8px var(--mono);color:rgba(240,207,122,.85);background:rgba(0,0,0,.7);padding:0 3px;pointer-events:none;z-index:3}

/* ── The world (bodies and their fx; illustrative, sim-driven) ─────────────── */
.world{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(ellipse 22% 13% at 18% 76%,rgba(16,30,24,.95),rgba(16,30,24,0) 70%),
  radial-gradient(ellipse 18% 10% at 82% 22%,rgba(16,30,24,.9),rgba(16,30,24,0) 70%),
  radial-gradient(ellipse 30% 16% at 70% 88%,rgba(18,34,26,.8),rgba(18,34,26,0) 70%),
  radial-gradient(ellipse 14% 8% at 30% 18%,rgba(14,28,22,.85),rgba(14,28,22,0) 70%),
  radial-gradient(ellipse 60% 50% at 50% 55%,#33331f,#262718 60%,#1b1c13)}
.world::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(130,140,80,.16) 1px,transparent 1.7px),radial-gradient(rgba(10,14,8,.4) 1.5px,transparent 2.2px);background-size:26px 26px,37px 37px;background-position:0 0,13px 9px}
.pool{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,rgba(10,22,22,.96),rgba(18,36,32,.85) 55%,rgba(40,52,30,0) 72%);box-shadow:inset 0 3px 8px rgba(140,180,140,.10)}
.stone{position:absolute;width:14px;height:9px;border-radius:50% 50% 40% 40%;background:linear-gradient(#5b5a48,#33332a);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.world::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 52%,transparent 55%,rgba(0,0,0,.55))}
.reed{position:absolute;width:14px;height:22px;background:linear-gradient(90deg,transparent 2px,#4f5a2c 2px,#4f5a2c 3px,transparent 3px,transparent 6px,#5d6a33 6px,#5d6a33 7px,transparent 7px,transparent 10px,#46512a 10px,#46512a 11px,transparent 11px);opacity:.75}
.bd{position:absolute;width:0;height:0}
.bd > *{position:absolute;pointer-events:none}
.bd .sh{left:-26px;top:-9px;width:52px;height:16px;border-radius:50%;background:rgba(0,0,0,.45)}
.bd .pud{left:-34px;top:-12px;width:68px;height:22px;border-radius:50%;background:radial-gradient(ellipse,rgba(155,229,100,.55),rgba(90,160,50,.25) 60%,transparent 72%);opacity:0}
.bd .slw{left:-36px;top:-13px;width:72px;height:24px;border-radius:50%;background:radial-gradient(ellipse,rgba(143,184,255,.4),transparent 70%);opacity:0}
.bd .tgr{left:-34px;top:-12px;width:68px;height:24px;border-radius:50%;border:2px dashed rgba(240,120,90,.85);opacity:0}
.bd .rt{left:-38px;top:-15px;width:76px;height:28px;opacity:0}
.bd .rt svg{width:100%;height:100%;overflow:visible}
.bd .im{left:-48px;top:-92px;width:96px;height:96px;transform-origin:50% 100%}
.bd .blob{left:-26px;top:-38px;width:52px;height:38px;border-radius:50% 50% 42% 42%/62% 62% 38% 38%;transform-origin:50% 100%;box-shadow:inset -6px -6px 0 rgba(0,0,0,.25),inset 5px 5px 0 rgba(255,255,255,.08)}
.bd .blob::before,.bd .blob::after{content:'';position:absolute;top:9px;width:7px;height:7px;border-radius:50%;background:#e8e2a0;box-shadow:inset 2px 2px 0 #222}
.bd .blob::before{left:12px}.bd .blob::after{right:12px}
.bd .hpo{left:-22px;top:-100px;width:44px;height:5px;background:rgba(0,0,0,.75);border:1px solid rgba(0,0,0,.9)}
.bd .hpo i{display:block;height:100%;background:#d14b3a}
.bd.player .hpo i{background:#5ee36a}
.bd .sg{left:-44px;top:calc(var(--head) / 2 - 44px);width:88px;height:88px;border-radius:50%;border:4px solid rgba(155,229,100,.95);box-shadow:0 0 18px rgba(155,229,100,.7),inset 0 0 14px rgba(155,229,100,.5);opacity:0}
.bd .gy{left:-26px;top:calc(var(--head) - 50px);width:52px;height:calc(50px - var(--head));border-radius:40% 40% 50% 50%;background:linear-gradient(0deg,rgba(155,229,100,.0),rgba(155,229,100,.55) 40%,rgba(200,255,160,.0));opacity:0;transform-origin:50% 100%}
.bd .drops{left:-60px;top:calc(var(--head) - 40px);width:120px;height:120px}
.bd .drops i{position:absolute;width:8px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#a8f070;box-shadow:0 0 8px #9be564}
.bd .pin{left:-46px;top:calc(var(--head) / 2 - 40px);width:92px;height:80px;border-radius:50%;border:3px solid rgba(143,184,255,.95);box-shadow:0 0 14px rgba(143,184,255,.6);opacity:0}
.proj{position:absolute;width:18px;height:3px;background:linear-gradient(90deg,transparent,#e7e3d2 40%,#fff);border-radius:2px;opacity:0;pointer-events:none;z-index:6;transform-origin:50% 50%}
.dmgs{position:absolute;inset:0;pointer-events:none;z-index:7}
.dm{position:absolute;transform:translate(-50%,-50%);font:700 13px var(--mono);color:#f2eee2;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000;white-space:nowrap}
.dm.pz{color:#a7ef72;font-size:12px}
.dm.ph{color:#ff8a76}
.dm.big{font-size:16px}

/* Arrival banner (the client's AreaInformation, as it is) */
.arrival{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);width:min(560px,94%);padding:18px 20px;text-align:center;background:linear-gradient(90deg,transparent,rgba(16,17,22,.86) 18%,rgba(16,17,22,.86) 82%,transparent);color:#eee4d1;text-shadow:0 2px 4px #000;z-index:20;pointer-events:none}
.arrival::before,.arrival::after{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,#ab9271,transparent)}
.arrival::before{margin-bottom:12px}.arrival::after{margin-top:12px}
.arrival .eb{color:#c9b58f;text-transform:uppercase;font-size:10px;letter-spacing:.2em;margin-bottom:6px}
.arrival h2{font:500 34px/1.15 Georgia,'Times New Roman',serif;letter-spacing:.045em;margin-bottom:6px}
.arrival .md{font-size:13px;color:#d4cbbb}
.arrival .terr{margin:10px auto 0;font-size:13px;color:#d9d1c3;display:flex;align-items:center;justify-content:center;gap:6px}
.arrival .terr strong{color:#f0d6a7}
.arrival .terr img{width:16px;height:16px}

/* ── Dialogs: Gear tab and the weapon page ────────────────────────────────── */
.dlg-layer{position:absolute;left:260px;top:0;right:0;bottom:0;z-index:40}
.dlg-back{position:absolute;inset:0;background:rgba(5,4,3,.66)}
.dlg{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge2);box-shadow:0 18px 50px rgba(0,0,0,.65)}
.dlg-tb{flex:none;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;border-bottom:1px solid #0a0907;background:linear-gradient(#2a251d,#1d1a15)}
.dlg-tb h2{font:700 15px var(--sc);letter-spacing:.06em;color:var(--gold2)}
.dlg-tb .sub{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:12px}
.dlg-x{width:28px;height:28px;border:1px solid var(--edge2);background:#221e18;color:var(--ink2);cursor:pointer;font-size:15px}
/* Gear */
.gear{left:50%;top:70px;width:560px;transform:translateX(-50%)}
.gear-list{padding:12px;display:flex;flex-direction:column;gap:6px}
.gitem{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:8px 10px;background:var(--ctrl);border:1px solid #3a342a;text-align:left;width:100%}
.gitem .ic{width:44px;height:44px;display:grid;place-items:center;background:var(--inset);border:1px solid #4a4134}
.gitem .ic img{width:40px;height:40px}
.gitem .nm{font:700 14px var(--sc);color:var(--ink)}
.gitem .mt{font-size:11px;color:var(--muted);margin-top:1px}
.gitem .sm{font-size:11px;color:var(--ink2);margin-top:2px}
.gitem.weapon{border-color:#6b5a36;cursor:pointer;background:linear-gradient(90deg,rgba(217,178,92,.10),var(--ctrl) 60%)}
.gitem.weapon:hover,.gitem.weapon.hover{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.gitem.weapon .nm{color:var(--gold2)}
.gitem .go{font:600 11px var(--sans);letter-spacing:.04em;color:var(--gold2);padding:6px 10px;border:1px solid #6b5a36;background:#2c261b;white-space:nowrap}
.gitem.plain{opacity:.72;cursor:default}
.gitem .plaintag{font:600 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 8px;border:1px dashed #4a4236}
.gear-sec{font:600 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
/* Page */
.page{left:10px;top:10px;right:10px;bottom:10px}
.pg-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#5f5341 transparent}
.pg-grid{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:14px;padding:8px 14px 10px}
.pg-main{display:flex;flex-direction:column;gap:7px;min-width:0}
.pg-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.form{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:6px 10px;border:1px solid #3a342a;background:linear-gradient(180deg,rgba(217,178,92,.07),transparent 70%),#1f1c17}
.form .art{width:54px;height:54px;display:grid;place-items:center;background:var(--inset);border:1px solid #63553e}
.form .art img{width:48px;height:48px}
.form .eb{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.form h3{font:700 19px/1.1 var(--display);color:var(--gold2);margin:0 0 1px}
.form .meta{font-size:11px;color:var(--muted)}
.form .lanes{display:flex;gap:6px;margin-top:4px}
.lanechip{padding:1px 8px;border:1px solid var(--lane);border-radius:999px;color:var(--lane);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.grp-h{display:flex;align-items:baseline;gap:10px;margin:2px 0 4px;padding-left:2px}
.grp-h h4{font:700 13px var(--sc);letter-spacing:.05em;color:var(--ink)}
.grp-h span{font-size:11px;color:var(--muted)}
.row{position:relative;display:grid;grid-template-columns:12px 138px minmax(0,1fr) 128px 62px;align-items:center;column-gap:10px;width:100%;height:42px;margin-bottom:4px;padding:3px 8px 3px 12px;background:var(--ctrl);border:1px solid #3a342a;text-align:left;cursor:pointer}
.row.verb{height:50px}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lane)}
.row:hover,.row.hover{border-color:var(--lane);box-shadow:0 0 0 1px color-mix(in srgb,var(--lane) 45%,transparent)}
.row .rd{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--lane);opacity:.8}
.row .nm{font:700 13.5px/1.15 var(--sc);color:var(--lane)}
.row .note{display:inline-block;margin-top:3px;padding:0 5px;border:1px dashed var(--lane);color:var(--lane);font:600 8.5px/14px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.row .sn{font-size:11.5px;line-height:15px;color:var(--ink2)}
.row .cs{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:4px}
.chip b{font-weight:600;color:var(--ink)}
.chip.short,.chip.short b,.chip.short span{color:var(--danger)!important}
.req{font-size:10px;color:var(--muted)}
.req.unmet{color:var(--danger)}
.stc{justify-self:end;font:700 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border:1px solid transparent;white-space:nowrap}
.stc.active{color:var(--gold2);border-color:#6b5a36;background:#2c261b}
.stc.buy{color:#1b160d;background:linear-gradient(#f0cf7a,#c99d45);border-color:#f0cf7a}
.stc.short{color:var(--muted);border-color:#3a342a}
.stc.owned{color:var(--ink2);border-color:#4a4236}
.row.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--ctrl))}
.row.active .rd{background:var(--lane);box-shadow:0 0 6px var(--lane);opacity:1}
.row.short .sn{color:var(--muted)}
.row.preview{border-color:var(--pl);box-shadow:0 0 0 1px color-mix(in srgb,var(--pl) 40%,transparent),0 0 12px color-mix(in srgb,var(--pl) 22%,transparent)}
.row.guide-ring{outline:2px solid var(--gold2);outline-offset:2px;animation:teachpulse 1.2s ease-in-out infinite}
.row .pv{display:none}
.t2{padding:5px 10px 6px;border:1px solid #2f2a22;background:#191612;opacity:.62}
.t2 .grp-h{margin:0 0 4px}
.t2 .ln{display:grid;grid-template-columns:128px 1fr;gap:8px;font-size:11px;line-height:17px}
.t2 .ln span:first-child{color:var(--muted);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.t2 .ln i{font-style:normal;color:var(--lane);font-family:var(--sc);font-weight:700;font-size:12px}
.t2 .ln i + i::before{content:' · ';color:var(--dim)}
.gate{display:grid;grid-template-columns:54px minmax(0,1fr) 168px;gap:12px;align-items:center;padding:7px 11px;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(217,178,92,.09),transparent 80%),#1f1c17}
.gate .por{width:54px;height:54px;border-radius:50%;overflow:hidden;border:1px solid var(--gold);background:var(--inset);display:grid;place-items:center}
.gate .por img{width:72px;height:72px}
.gate h4{font:700 14px var(--sc);color:var(--gold2)}
.gate p{font-size:11.5px;line-height:1.4;color:var(--ink);margin:2px 0}
.gate .pr{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted)}
.pips{display:inline-flex;gap:3px}
.pips i{width:10px;height:10px;border:1px solid var(--gold)}
.pips i.f{background:var(--gold2)}
.door{display:flex;flex-direction:column;gap:3px}
.door .dn{font:700 12px var(--sc);color:var(--ink)}
.door button{padding:6px 10px;border:1px solid #63553e;background:#2a261f;color:var(--dim);font-weight:700;font-size:11.5px;cursor:not-allowed}
.door small{font-size:10px;color:var(--danger)}
.side{padding:9px 10px;border:1px solid #3a342a;background:#1f1c17}
.side h4{font:700 12.5px var(--sc);color:var(--gold2);margin-bottom:5px;letter-spacing:.04em}
.sheet{display:flex;flex-direction:column;gap:1px;font-size:11.5px}
.sheet div{display:flex;justify-content:space-between;padding:2px 4px;margin:0 -4px}
.sheet dt{color:var(--muted)}
.sheet dd{color:var(--ink);font-variant-numeric:tabular-nums}
.sheet .mv{background:rgba(217,178,92,.12)}
.sheet .mv dt{color:var(--ink)}
.sheet s{color:var(--dim)}
.sheet .up{color:var(--ok);font-weight:700}
.wnote{margin-top:6px;padding-left:7px;border-left:2px solid var(--gold);font-size:10.5px;line-height:1.4;color:var(--muted)}
.wnote.live{color:var(--ink2)}
.mats{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:11px}
.mats li{display:grid;grid-template-columns:16px 1fr auto;gap:7px;align-items:start}
.mats img{width:16px;height:16px}
.mats .mn{color:var(--ink)}
.mats small{display:block;font-size:10px;line-height:1.35;color:var(--muted)}
.mats b{font:600 11px var(--mono)}
.side .hint{font-size:10px;color:var(--dim);margin-top:5px;font-style:italic}
.pg-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(520px,calc(100% - 32px));padding:8px 14px;border:1px solid var(--gold);background:var(--inset);box-shadow:0 8px 24px rgba(0,0,0,.55);font-size:12.5px;line-height:1.4;color:var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.pg-toast.show{opacity:1}
.pg-toast.warn{border-color:var(--danger)}
.pg-toast.proto{border-style:dashed;border-color:#8f8571;color:#cfc5b2;font-style:italic}

/* ── First-time overlay and teaching tether ───────────────────────────────── */
.ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
#frame.counting *{pointer-events:auto!important}
#frame.counting .ovl,#frame.counting .ovl *,#frame.counting .tether,#frame.counting .tether *{pointer-events:none!important}
.tether{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ── Portrait (390 × 844): the phone shell, the spine and the drawer ──────── */
.v-portrait .dlg-layer{left:0}
.mtop{position:absolute;left:0;right:0;top:0;height:54px;padding:5px 10px;background:rgba(14,12,9,.97);border-bottom:1px solid #3a342a;z-index:30;font-family:var(--mono)}
.mtop .r1{display:flex;align-items:center;gap:7px;height:22px}
.mtop .dot{width:7px;height:7px;border-radius:50%;background:#55cc77}
.mtop .nm{font:700 12px var(--sc);color:#9fe0a8}
.mtop .hpbar{flex:1;margin:0;height:9px}
.mtop .hp{font-size:9.5px;color:var(--ink2)}
.mtop .zn{font-size:9.5px;color:var(--gold)}
.mtop .r2{display:flex;align-items:center;gap:7px;height:18px;margin-top:3px}
.mtop .stance{font-size:8.5px;font-weight:700;color:var(--dim);border:1px solid #3a342a;padding:1px 5px}
.mworld{position:absolute;left:0;right:0;top:54px;bottom:86px;overflow:hidden}
.mbottom{position:absolute;left:0;right:0;bottom:0;height:86px;background:rgba(14,12,9,.97);border-top:1px solid #3e3a30;z-index:30}
.mbottom .mxp{height:30px;padding:5px 10px 0;border-bottom:1px solid rgba(100,88,60,.4);font:600 9px var(--mono);color:var(--ink2)}
.mbottom .mxp .hd{display:flex;justify-content:space-between;margin-bottom:3px}
.mbottom .mxp .tr{height:5px;background:#0b0a08;border:1px solid #333}
.mbottom .mxp .tr i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#6b8f3a,#9be564)}
.mtabs{display:flex;height:56px}
.mtab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font:600 8px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.mtab .ic{font-size:17px;line-height:1;color:#b8ad98;height:20px;display:grid;place-items:center}
.mtab .ic img{width:20px;height:20px}
.mtab.on{color:var(--gold2)}
.mtab.on .ic{filter:drop-shadow(0 0 6px var(--gold))}
.mtab .badge{position:absolute;top:7px;right:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:var(--gold2);box-shadow:0 0 6px var(--gold)}
.mtab.press{filter:brightness(1.5)}
.mauto{position:absolute;right:54px;bottom:12px;width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14201a;border:2px solid #3a5a3a;color:var(--ok);font:600 8.5px var(--mono);letter-spacing:.08em;z-index:25;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.mauto span{font-size:15px}
.mquest{position:absolute;right:65px;bottom:80px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#221e18;border:2px solid #4a4134;color:#dfa844;font:700 17px var(--mono);z-index:25}
.mguide{position:absolute;left:8px;top:8px;right:54px;padding:6px 9px 7px;background:rgba(20,18,14,.93);border:1px solid #4a4134;z-index:22}
.mguide .hd{display:flex;justify-content:space-between;font:700 10px var(--sc);letter-spacing:.12em;color:var(--gold)}
.mguide .hd span:last-child{font:600 9px var(--sans);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.mguide .line{margin-top:3px;font-size:11.5px;line-height:1.4;color:var(--ink)}
.mguide .line.check{font-size:11px;color:var(--ink2)}
.mguide .line.check::before{content:'✓ ';color:var(--ok)}
.mguide.collapsed .line{display:none}
/* The spine: the closed drawer keeps the column's order as one glyph per fact */
.spine{position:absolute;right:0;top:86px;width:46px;bottom:84px;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(10,9,7,.88),rgba(18,16,12,.95));border:1px solid #3e3a30;border-right:0;z-index:24;cursor:pointer}
.spine .ss{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0;border-bottom:1px solid #2f2a22}
.spine .ss:last-of-type{border-bottom:0}
.spine .cap{font:600 7px var(--mono);letter-spacing:.08em;color:#7d7058;text-transform:uppercase}
.spine .wic{width:30px;height:30px;display:grid;place-items:center;background:var(--inset);border:1px solid #4a4134}
.spine .wic img{width:28px;height:28px}
.spine .lp{width:30px;height:4px;background:var(--lane,#3a342a)}
.spine .ring{position:relative;right:auto;top:auto;width:32px;height:32px}
.spine .sfx{position:relative;width:34px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;padding-top:2px;border:1px solid #2c271f;background:rgba(0,0,0,.25)}
.spine .sfx::before{content:'';position:absolute;left:-1px;top:3px;bottom:3px;width:2px;background:var(--src,transparent)}
.spine .sfx img{width:20px;height:20px;border-radius:3px}
.spine .sfx b{font:600 10px/1 var(--mono);color:var(--ink)}
.spine .sfx .t{position:absolute;left:0;bottom:0;height:2px;background:var(--fc,#888)}
.spine .sfx.off{border-color:#211d17;background:transparent}
.spine .sfx.off img{opacity:.15;filter:grayscale(1)}
.spine .sfx.off b,.spine .sfx.off .t{visibility:hidden}
.spine .sfx.jump{background:rgba(155,229,100,.2)}
.spine .shic{width:22px;height:22px}
.spine .pc2{display:flex;flex-direction:column;align-items:center;gap:1px;font:600 10px var(--mono);color:var(--ink)}
.spine .pc2 img{width:18px;height:18px}
.spine .grip{margin-top:auto;padding:8px 0 10px;text-align:center;font:700 16px var(--sans);color:var(--gold)}
.spine .ring.teach{outline:2px solid var(--gold2);outline-offset:3px;border-radius:50%;animation:teachpulse 1.2s ease-in-out infinite}
.spine.fresh .ss.here{animation:fresh 1.6s ease-out}
.drawer{position:absolute;top:54px;bottom:86px;right:0;width:304px;background:linear-gradient(135deg,#1a1712,#110f0c 40%,#0e0c0a);border-left:1px solid #4a4134;box-shadow:-12px 0 30px rgba(0,0,0,.6);z-index:35;transform:translateX(100%);transition:transform .28s ease}
.drawer.open{transform:translateX(0)}
.drawer:not(.open) .dclose{visibility:hidden}
.drawer .dclose{position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:30px;height:64px;border:1px solid #4a4134;border-right:0;background:#1a1712;color:var(--gold);font-size:16px;cursor:pointer}
.drawer .col{padding:7px 8px}
.mtap{position:absolute;inset:0;z-index:34;background:rgba(0,0,0,.25)}
/* Portrait Gear sheet and page */
.v-portrait .gear{left:0;right:0;top:auto;bottom:0;width:auto;transform:none;border-left:0;border-right:0;border-bottom:0}
.v-portrait .gear-list{padding:10px 10px 18px}
.v-portrait .gitem{grid-template-columns:44px 1fr auto;gap:10px;padding:8px}
.v-portrait .gitem .go{padding:8px 10px}
.v-portrait .page{left:0;top:0;right:0;bottom:0;border:0}
.v-portrait .pg-grid{grid-template-columns:minmax(0,1fr);padding:10px 10px 90px;gap:10px}
.v-portrait .row{display:block;height:auto;min-height:0;padding:7px 9px 8px 13px}
.v-portrait .row .rd{position:absolute;left:12px;top:11px}
.v-portrait .row .nmw{padding-left:18px;padding-right:70px}
.v-portrait .row .stc{position:absolute;right:8px;top:6px}
.v-portrait .row .sn{display:block;margin-top:3px;font-size:12px;line-height:16px}
.v-portrait .row .cs{flex-direction:row;justify-content:space-between;align-items:center;margin-top:5px}

</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="main">
    <div id="stage"><div id="frameWrap"><div id="frame"></div></div></div>
    <aside id="aside"></aside>
  </div>
</div>
<script src="../data.js"></script>
<script>
'use strict';
/* =============================================================================
   Thesis D — The dense sidebar.
   A classic MMO side column, always visible on desktop and a drawer on portrait:
   You · Weapon (lean, verb + its clock) · Target (three fixed effect homes) ·
   Here (the node's territory and shard) · Purse. Fixed sections, fixed order,
   fixed row heights: nothing reflows when a verb fires or a badge appears.
   Every name, sentence, cost, colour and number comes from window.UI_PROTO_DATA.
   ========================================================================== */
const D = window.UI_PROTO_DATA;
const DS = D.daggerScenes, PK = D.packets;
const A = p => (p ? '../../../' + p : '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/* ── Data lookups ──────────────────────────────────────────────────────────── */
const PAGES = Object.fromEntries(DS.pages.map(p => [p.key, p]));
const NODE = Object.fromEntries(D.nodes.map(n => [n.id, n]));
const FAMS = Object.fromEntries(D.families.swamp.map(f => [f.id, f]));
const ALL_MON = D.families.swamp.flatMap(f => f.monsters);
const MON_BY_NAME = Object.fromEntries(ALL_MON.map(m => [m.name, m]));
const OOZE = ALL_MON.find(m => m.id === 'bog-slime');
const DAG = D.weapons.find(w => w.lineageId === 'dagger');
const WDOT = DAG.t1Form.weaponDot;
const GEAR = DS.gear;
const WEAPON = GEAR.find(g => g.hasPage);
const BEAT_SAY = DS.tutorialBeats.find(b => b.id === 'card:dagger-t1-affliction-payoff');
const LESSON = BEAT_SAY.lesson;
const CONCEPTS = BEAT_SAY.teaches.map(k => DS.tutorialConcepts[k]);
const ST = id => D.statuses.target.find(s => s.id === id);
const POISON = ST('poison-dagger-burn'), SLOWED = ST('ability-slowed'), ROOTED = ST('ability-rooted');
const DEBUFF_ICONS = D.statuses.playerDebuffIcons;
const MARK = D.rhythm.marks;
const HOME_NODE = 'node-t1-swamp-04';
const NODE_PICK = ['node-t1-swamp-04', 'node-t1-swamp-02', 'node-t1-swamp-05'];
const t1Band = pg => pg.bands.find(b => b.tier === 1);
const rowOf = (pg, row) => t1Band(pg).rows.find(r => r.row === row);
const allCards = pg => pg.bands.flatMap(b => b.rows.flatMap(r => r.cards));
const cardOf = (pg, id) => allCards(pg).find(c => c.id === id);
const activeLean = pg => (pg.progress.active.stat ? cardOf(pg, pg.progress.active.stat) : null);
const activeVerb = pg => (pg.progress.active.payoff ? cardOf(pg, pg.progress.active.payoff) : null);
const comp = (verbId, leanId) => DS.compositionsT1Slinger.find(c => c.verbId === verbId && c.leanId === (leanId || null));
const ITW_ID = 'dagger-t1-affliction-payoff';
const COMP_PURE = comp(ITW_ID, 'dagger-t1-affliction-stat');
const COMP_ROOT = comp(ITW_ID, 'dagger-t1-control-stat');
const matOf = (pg, key) => pg.materials.find(m => m.key === key);

/* The prototype combat rule (SCENES.md), built from the export's numbers.
   Illustrative UI motion, NOT the server's DoT formula. */
const ATK = DS.playerStats.attack;                 // 26
const SWING_MS = 500;                              // 1.98 swings/s, rounded per SCENES.md
const PER_HIT_POISON = ATK * WDOT.convPct;         // 13: the Dagger's reservoir
const LEAN_BLEED = 0.10;                           // SCENES.md: Coated Edge's light bleed ("a tenth"), fed into the one Poison record
const TICK_MS = WDOT.tickIntervalMs;               // 1000
const START_HP = 171;                              // SCENES.md frame
const MAX_HP = DS.playerStats.maxHp;               // 193

/* Split a verb sentence into its moment half and payload half, using the
   packet's own moment template (no retyping): the two-colour sentence. */
function halves(sentence, verbLane, momentColor, payloadColor) {
  const whole = [{ t: sentence, c: momentColor, r: 'whole' }];
  if (!verbLane || !momentColor || momentColor === payloadColor) return whole;
  const mp = PK[verbLane].momentPhrase;
  const m = sentence.match(new RegExp('^' + mp.text.split(/\{[a-zA-Z]+\}/).map(reEsc).join('(.+?)')));
  if (!m) return whole;
  let cut = m[0].length;
  if (sentence[cut] === ',') cut += 1;
  return [{ t: sentence.slice(0, cut), c: momentColor, r: 'moment' }, { t: sentence.slice(cut), c: payloadColor, r: 'payload' }];
}
const halvesHTML = parts => parts.map(p => `<span class="h-${p.r}" style="--hc:${p.c || 'var(--ink2)'}">${esc(p.t)}</span>`).join('');
function verbSentenceHTML(verbCard, leanId) {
  const c = comp(verbCard.id, leanId);
  if (!c) return esc(verbCard.sentence);
  return halvesHTML(halves(c.sentence, c.verbLane, c.momentColor, c.payloadColor));
}

/* ── State ─────────────────────────────────────────────────────────────────── */
const S = {
  scene: 1, view: 'desktop', first: false, embed: false, grid: false,
  open: 'none',            // scenes 1/2: 'none' | 'gear' | 'page'
  bought: false,           // scenes 1/2: Into the Wound bought
  hoverLean: null,         // desktop lean preview
  previewLean: null,       // portrait lean preview (tap control)
  mode: 'pure',            // scene 3: 'pure' | 'composed'
  auto: false,             // scenes 3/4: auto-play
  node: HOME_NODE,         // scene 5
  arrivedAt: 0,            // scene 5 (wall ms)
  drawer: false,           // portrait drawer
  justFilled: false,
};
let toast = null;          // {text, kind, at, where}

/* ── The fight (deterministic, event-driven) ──────────────────────────────── */
const SIM = {
  reset(mode) {
    this.mode = mode; this.t = 0; this.php = START_HP; this.cap = 0; this.n = 0;
    this.firings = []; this.hits = []; this.ticks = []; this.pHits = []; this.kills = [];
    this.nextSwing = 0; this.respawnAt = null; this.wave = 0; this.spawn(0, 0);
  },
  spawn(t, swingAt) {
    this.wave++;
    const born = this.wave === 1 ? t - 1000 : t;   // the first pull is already standing there
    const mk = (id, atk) => ({ id, hp: OOZE.hp, max: OOZE.hp, owed: 0, nextTick: null, slowUntil: -1, rootUntil: -1, dead: false, deadAt: null, nextAtk: t + atk, spawnAt: born, surgeAt: -1e9, rootAt: -1e9 });
    this.mobs = [mk('A', 900), mk('B', 1500)];
    this.nextSwing = swingAt;
  },
  target() { return this.mobs.find(m => !m.dead) || null; },
  advanceTo(T) {
    for (let guard = 0; guard < 20000; guard++) {
      let next = Infinity;
      if (this.respawnAt != null) next = this.respawnAt;
      else {
        if (this.target()) next = Math.min(next, this.nextSwing);
        for (const m of this.mobs) if (!m.dead) { if (m.nextTick != null) next = Math.min(next, m.nextTick); next = Math.min(next, m.nextAtk); }
      }
      if (!(next <= T)) break;
      this.t = next;
      if (this.respawnAt != null) { this.respawnAt = null; this.php = START_HP; this.spawn(next, next + 300); continue; }
      for (const m of this.mobs) if (!m.dead && m.nextTick != null && m.nextTick <= next) this.tick(m, next);
      for (const m of this.mobs) if (!m.dead && m.nextAtk <= next) this.mobAttack(m, next);
      if (this.nextSwing <= next && this.target()) this.swing(next);
    }
    this.t = T;
    const old = T - 3000;
    for (const k of ['hits', 'ticks', 'pHits']) if (this[k].length > 60) this[k] = this[k].filter(e => e.t > old);
  },
  swing(t) {
    const m = this.target();
    const before = m.owed;
    m.hp -= ATK; this.hits.push({ t, id: m.id, v: ATK });
    m.owed += PER_HIT_POISON + (this.mode === 'pure' ? ATK * LEAN_BLEED : 0);
    if (m.nextTick == null) m.nextTick = t + TICK_MS;
    if (this.mode === 'composed') m.slowUntil = t + SWING_MS;          // Tendon Cut: slowed until the next swing
    if (before > 0 && t >= this.cap) {                                 // the moment: a hit on an afflicted target, clock clear
      this.n++; this.cap = t + COMP_PURE.trigger.capMs;
      if (this.mode === 'pure') {                                      // the re-dose: adds what it still owes
        const b = m.owed; m.owed += m.owed * COMP_PURE.payoff.magnitude; m.surgeAt = t;
        this.firings.push({ t, n: this.n, id: m.id, before: b, after: m.owed });
      } else {                                                         // composed: root 2 s
        m.rootUntil = t + COMP_ROOT.payoff.durationMs; m.rootAt = t;
        this.firings.push({ t, n: this.n, id: m.id });
      }
    }
    if (m.hp <= 0) this.kill(m, t);
    this.nextSwing = t + SWING_MS;
  },
  tick(m, t) {
    const d = Math.min(m.owed, Math.ceil(m.owed / 4));
    m.hp -= d; m.owed -= d; this.ticks.push({ t, id: m.id, v: d });
    if (m.owed < 0.5) { m.owed = 0; m.nextTick = null; } else m.nextTick = t + TICK_MS;
    if (m.hp <= 0) this.kill(m, t);
  },
  mobAttack(m, t) {
    this.php = Math.max(1, this.php - OOZE.attack);
    this.pHits.push({ t, id: m.id, v: OOZE.attack });
    m.nextAtk = t + OOZE.attackCooldownMs;
  },
  kill(m, t) {
    m.dead = true; m.deadAt = t; m.owed = 0; m.nextTick = null; m.slowUntil = -1; m.rootUntil = -1;
    this.kills.push({ t, id: m.id });
    if (this.mobs.every(x => x.dead)) this.respawnAt = t + 1300;
  },
  lastFiring() { return this.firings.length ? this.firings[this.firings.length - 1] : null; },
};
SIM.reset('pure');
let simPlaying = false, simStopAt = Infinity, lastWall = 0;

/* ── Scene context: which page model each scene reads ─────────────────────── */
function ctxPage() {
  if (S.scene === 1 || S.scene === 2) return S.bought ? PAGES['scene2-after-buy'] : PAGES.scene2;
  if (S.scene === 3 && S.mode === 'composed') return PAGES['scene3-composed'];
  return PAGES['scene2-after-buy'];
}
const inCombat = () => S.scene === 3 || S.scene === 4;
const ctxNode = () => NODE[S.scene === 5 ? S.node : HOME_NODE];

/* =============================================================================
   THE COLUMN
   ========================================================================== */
function youHTML() {
  return `<section class="sec panel you" data-slot="You">
    <h4 class="sec-h"><span><span class="ix">I</span>You</span><span style="font:600 9.5px var(--sans);letter-spacing:.06em;color:var(--muted)">Tier ${PAGES.scene2.wallet.playerTier}</span></h4>
    <div class="nm">${esc(DS.className)}<span data-live="php">${START_HP} / ${MAX_HP}</span></div>
    <div class="hpbar" data-live="phpbar"><i style="width:${(START_HP / MAX_HP) * 100}%"></i></div>
    <div class="st"><span>DPS <b>${esc(DS.playerStats.dps)}</b></span><span><b>${DS.playerStats.attacksPerSecond.toFixed(2)}</b>/s</span><span>Atk <b>${ATK}</b></span></div>
  </section>`;
}

function weaponSecHTML(pg, where) {
  const lean = activeLean(pg), verb = activeVerb(pg);
  const lr = rowOf(pg, 'stat'), vr = rowOf(pg, 'payoff');
  const c = verb ? comp(verb.id, lean && lean.id) : null;
  const pageOn = S.open === 'page';
  const ringHTML = verb
    ? `<div class="ring ready" data-live="ring" style="--rc:${c.momentColor}" data-fact="ring" ${firstAttr('ring')}><svg viewBox="0 0 40 40"><circle class="tr" cx="20" cy="20" r="16"/><circle class="fl" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="0"/></svg><span class="rt">${MARK.ready}</span></div>
       <img class="glyph px" src="${A(c.ringGlyph)}" alt="" title="payload">`
    : `<div class="ring ghost"><svg viewBox="0 0 40 40"><circle class="tr" cx="20" cy="20" r="16"/></svg></div>`;
  return `<section class="sec panel" data-slot="Weapon">
    <h4 class="sec-h"><span><span class="ix">II</span>Weapon</span><button class="sec-link${pageOn ? ' on' : ''}" data-act="open-page" ${firstAttr('colpage')}>Page ›</button></h4>
    <div class="wpn" data-act="open-page" data-slot="Form" ${firstAttr('colweapon')}><div class="ic"><img class="px" src="${A(pg.header.iconArt)}" alt=""></div>
      <div><b data-fact="name">${esc(pg.header.name)}</b><small>Tier ${WEAPON.tier} · ${esc(DAG.homeBiomeName)}</small></div></div>
    <div class="crow crow-lean" data-slot="Lean" style="--lane:${lean ? lean.laneColor : '#4a4236'}" ${firstAttr('leanrow')}>
      <span class="crow-k">${esc(lr.title)}</span>
      <span class="crow-n" data-fact="name">${lean ? esc(lean.name) : '—'}</span>
      <span class="crow-s" data-fact="sentence">${lean ? esc(lean.sentence) : esc(lr.question)}</span>
    </div>
    <div class="crow crow-verb${verb ? '' : ' empty'}${S.justFilled ? ' filled' : ''}" data-slot="Verb" data-live="verbrow" style="--lane:${verb ? verb.laneColor : '#4a4236'}" ${firstAttr('verbrow')}>
      <span class="crow-k">${esc(vr.title)}</span>
      <span class="crow-n"${verb ? ' data-fact="name"' : ''}>${verb ? esc(verb.name) : '—'}</span>
      <span class="crow-s" data-fact="${verb ? 'sentence' : 'teach'}">${verb ? halvesHTML(halves(c.sentence, c.verbLane, c.momentColor, c.payloadColor)) : esc(vr.question)}</span>
      ${ringHTML}
    </div>
  </section>`;
}

function fxRowHTML(kind, where) {
  const meta = {
    dot: { icon: POISON.icon, label: POISON.label, color: POISON.color, help: POISON.help && POISON.help.help, slot: 'Owes' },
    slow: { icon: DEBUFF_ICONS.slow, label: SLOWED.prettified, color: '#8fb8ff', help: null, slot: 'Slowed' },
    hold: { icon: DEBUFF_ICONS.root, label: ROOTED.prettified, color: '#8fb8ff', help: null, slot: 'Held' },
  }[kind];
  return `<div class="fx off" data-live="fx-${kind}" data-slot="${meta.slot}" style="--fc:${meta.color}" ${meta.help ? `title="${esc(meta.help)}"` : ''} ${firstAttr('fx-' + kind)}>
    <img class="px" src="${A(meta.icon)}" alt=""><span class="l">${esc(meta.label)}</span><span class="v"></span><i class="t"></i></div>`;
}

function targetSecHTML() {
  return `<section class="sec panel tgt" data-slot="Target">
    <h4 class="sec-h"><span><span class="ix">III</span>Target</span></h4>
    <div class="tg-head"><span class="n none" data-live="tgname">—</span><span class="h" data-live="tghp"></span></div>
    <div class="tgbar"><i data-live="tgbar" style="width:0%"></i></div>
    ${fxRowHTML('dot')}${fxRowHTML('slow')}${fxRowHTML('hold')}
  </section>`;
}

function hereLines(node) {
  const label = node.mapTileLabel;                    // the map's own label, split at its first " · "
  const cut = label.indexOf(' · ');
  const name = cut > 0 ? label.slice(0, cut) : node.displayName;
  const rest = cut > 0 ? label.slice(cut + 3) : '';
  const terr = node.arrival.return ? node.arrival.return.territory : '';
  const restHTML = rest.startsWith(terr) && terr ? `<strong>${esc(terr)}</strong>${esc(rest.slice(terr.length))}` : esc(rest);
  const mix = Object.entries(node.resolvedShares || {}).sort((a, b) => b[1] - a[1])
    .map(([fid, share]) => `${(node.fieldedByFamily[fid] || []).join(', ')} ${Math.round(share * 100)}%`).join(' · ');
  return { name, restHTML, mix };
}

function hereSecHTML(node) {
  const h = hereLines(node);
  return `<section class="sec panel here" data-slot="Here" data-live="here" ${firstAttr('here')}>
    <h4 class="sec-h"><span><span class="ix">IV</span>Here</span></h4>
    <div class="node">${esc(h.name)}</div>
    <div class="terr" data-fact="shard"><img class="px" src="${A(PK[node.shard].shardIcon)}" alt="">${h.restHTML}</div>
    <div class="mix" title="${esc(h.mix)}">${esc(h.mix)}</div>
  </section>`;
}

function purseSecHTML(pg, node) {
  const cells = [];
  for (const m of pg.materials) {
    if (m.kind === 'shard') {
      const here = node && node.shard === m.key;
      cells.push(`<div class="pc${here ? ' herec' : ''}" style="--c:${m.color}" title="${esc(m.name)} · ${esc(m.where)}" data-fact="shard" data-live="pc-${m.key}" ${here ? firstAttr('pursehere') : ''}><img class="px" src="${A(PK[m.key].shardIcon)}" alt=""><span class="pw" data-w="${esc(PK[m.key].shardWord)}">${esc(PK[m.key].shardWord)}</span><b>${m.held}</b></div>`);
    }
  }
  const rot = matOf(pg, 'purple');
  const cap = pg.materials.find(m => m.kind === 'capstone');
  const gate = pg.gates[0];
  cells.push(`<div class="pc" style="--c:var(--rot)" title="${esc(rot.name)}" data-fact="shard"><span class="orb"></span><span>${esc(D.weapons.find(w => w.lineageId === 'dagger').essence.label)}</span><b>${rot.held}</b></div>`);
  cells.push(`<div class="pc" style="grid-column:span 2;--c:var(--gold)" title="${esc(cap.name)} · ${esc(cap.where)}" data-fact="shard"><span class="gl"></span><span>${esc(cap.name)}</span><b>${cap.held}/${gate.pips.length}</b></div>`);
  return `<section class="sec panel purse" data-slot="Purse">
    <h4 class="sec-h"><span><span class="ix">V</span>Purse</span></h4>
    <div class="pgrid">${cells.join('')}</div>
  </section>`;
}

function columnHTML(where) {
  const pg = ctxPage(), node = ctxNode();
  return `<div class="col">
    ${where === 'desktop' ? youHTML() : ''}
    ${weaponSecHTML(pg, where)}
    ${targetSecHTML()}
    ${hereSecHTML(node)}
    ${purseSecHTML(pg, node)}
  </div>`;
}

/* ── The spine: the closed drawer, the column's order one glyph per fact ──── */
function spineHTML() {
  const pg = ctxPage(), node = ctxNode();
  const lean = activeLean(pg), verb = activeVerb(pg);
  const c = verb ? comp(verb.id, lean && lean.id) : null;
  const nodeMat = matOf(pg, node.shard);
  const fx = (kind, icon, color) => `<div class="sfx off" data-live="sfx-${kind}" style="--fc:${color}" ${firstAttr('sfx-' + kind)}><img class="px" src="${A(icon)}" alt=""><b></b><i class="t"></i></div>`;
  return `<div class="spine" data-act="drawer-open" ${firstAttr('spine')}>
    <div class="ss" ${firstAttr('spinewpn')}>
      <span class="cap">Wpn</span>
      <div class="wic"><img class="px" src="${A(pg.header.iconArt)}" alt=""></div>
      <i class="lp" style="--lane:${lean ? lean.laneColor : '#3a342a'}" title="${lean ? esc(lean.name) : ''}"${lean ? ' data-fact="state"' : ''}></i>
      ${verb ? `<div class="ring ready" data-live="ring" style="--rc:${c.momentColor}" data-fact="ring" ${firstAttr('ring')}><svg viewBox="0 0 40 40"><circle class="tr" cx="20" cy="20" r="16"/><circle class="fl" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="0"/></svg><span class="rt">${MARK.ready}</span></div>` : `<div class="ring ghost"><svg viewBox="0 0 40 40"><circle class="tr" cx="20" cy="20" r="16"/></svg></div>`}
    </div>
    <div class="ss">
      <span class="cap">Tgt</span>
      ${fx('dot', POISON.icon, POISON.color)}${fx('slow', DEBUFF_ICONS.slow, '#8fb8ff')}${fx('hold', DEBUFF_ICONS.root, '#8fb8ff')}
    </div>
    <div class="ss here" ${firstAttr('spinehere')}>
      <span class="cap">Here</span>
      <img class="shic px" src="${A(PK[node.shard].shardIcon)}" alt="" title="${esc(node.mapTileLabel)}" data-fact="shard">
    </div>
    <div class="ss">
      <span class="cap">Purse</span>
      <div class="pc2" data-fact="shard" data-live="spc"><img class="px" src="${A(PK[node.shard].shardIcon)}" alt="">${nodeMat ? nodeMat.held : 0}</div>
    </div>
    <div class="grip">‹</div>
  </div>`;
}

/* =============================================================================
   SHELL PIECES (the client's furniture, kept as the real HUD lays it out)
   ========================================================================== */
function guideHTML(where) {
  let lines = [], collapsed = false, chapter = BEAT_SAY.chapter;
  if (S.scene === 1 || S.scene === 2) lines = [`<p class="line" data-fact="teach" ${firstAttr('guide')}>${esc(BEAT_SAY.say)}</p>`];
  else if (S.scene === 4) {
    const n = SIM.n;
    if (n <= 1) lines = [`<p class="line" data-fact="teach" data-live="guideline" ${firstAttr('guide')}>${esc(LESSON.read)}</p>`];
