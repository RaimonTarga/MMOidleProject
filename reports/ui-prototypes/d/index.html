/* Live-cell writer: also records which cells moved (the motion budget meter). */
const moved = new Map();
function setText(el, v) { if (el && el.textContent !== String(v)) { el.textContent = v; moved.set(el, performance.now()); } }
function setHTML(el, v) { if (el && el.__h !== v) { el.innerHTML = v; el.__h = v; moved.set(el, performance.now()); } }
function setCls(el, c, on) { if (el && el.classList.contains(c) !== !!on) { el.classList.toggle(c, !!on); moved.set(el, performance.now()); } }

function paint(force) {
  const fr = $('#frame');
  if (!fr.firstElementChild) return;
  const combat = inCombat();
  const t = SIM.t;
  const tgt = combat ? SIM.target() : null;
  // the last target that matters for the column: current, or the one that just died
  const shown = tgt || (combat ? SIM.mobs.slice().sort((a, b) => (b.deadAt || 0) - (a.deadAt || 0))[0] : null);
  const showLive = shown && (!shown.dead || t - shown.deadAt < 700);

  /* YOU */
  const php = combat ? SIM.php : START_HP;
  for (const el of $$('[data-live="php"]', fr)) setText(el, S.view === 'desktop' ? `${Math.ceil(php)} / ${MAX_HP}` : `${Math.ceil(php)}/${MAX_HP}`);
  for (const el of $$('[data-live="phpbar"]', fr)) {
    el.firstElementChild.style.width = (php / MAX_HP) * 100 + '%';
    const hurt = combat && SIM.pHits.some(h => t - h.t >= 0 && t - h.t < 180);
    setCls(el, 'hurt', hurt);
  }

  /* WEAPON: the verb's clock */
  const lastF = combat ? SIM.lastFiring() : null;
  for (const ring of $$('[data-live="ring"]', fr)) {
    let rem = combat ? Math.max(0, SIM.cap - t) : 0;
    const fill = rem > 0 ? 1 - rem / COMP_PURE.trigger.capMs : 1;
    $('.fl', ring).setAttribute('stroke-dashoffset', String(100.5 * (1 - fill)));
    setText($('.rt', ring), rem > 0 ? (rem / 1000).toFixed(1) : MARK.ready);
    setCls(ring, 'ready', rem <= 0);
    const since = lastF ? t - lastF.t : 1e9;
    ring.classList.toggle('flash', since >= 0 && since < 600);
    ring.style.setProperty('--fo', since >= 0 && since < 600 ? String(1 - since / 600) : '0');
    const teach = S.scene === 4 && SIM.n <= 3 && !(SIM.n === 3 && since > 1800) && S.view === 'portrait';
    ring.classList.toggle('teach', teach);
  }
  for (const vr of $$('[data-live="verbrow"]', fr)) {
    const since = lastF ? t - lastF.t : 1e9;
    setCls(vr, 'fire', combat && since >= 0 && since < 700);
    const teach = S.scene === 4 && SIM.n <= 3 && !(SIM.n === 3 && since > 1800);
    vr.classList.toggle('teach', teach);
  }

  /* TARGET: three fixed homes */
  for (const el of $$('[data-live="tgname"]', fr)) {
    setText(el, showLive ? OOZE.name : '—');
    el.classList.toggle('none', !showLive);
  }
  for (const el of $$('[data-live="tghp"]', fr)) setText(el, showLive ? `${Math.max(0, Math.ceil(shown.hp))} / ${shown.max}` : '');
  for (const el of $$('[data-live="tgbar"]', fr)) el.style.width = showLive ? Math.max(0, shown.hp / shown.max) * 100 + '%' : '0%';
  const live = showLive && !shown.dead ? shown : null;
  const teachF = S.scene === 4 && lastF && lastF.n <= 3 && t - lastF.t >= 0 && t - lastF.t < 1600 && lastF.before != null;
  const dotOn = !!(live && live.owed > 0);
  const slowOn = !!(live && t < live.slowUntil);
  const holdOn = !!(live && t < live.rootUntil);
  const jump = lastF && t - lastF.t >= 0 && t - lastF.t < 600 && live && lastF.id === live.id;
  for (const el of $$('[data-live="fx-dot"]', fr)) {
    setCls(el, 'off', !dotOn); el.toggleAttribute('data-fact', dotOn); if (dotOn) el.setAttribute('data-fact', 'badge');
    el.style.setProperty('--src', dotOn ? COMP_PURE.momentColor : 'transparent');
    const v = $('.v', el);
    if (dotOn) setHTML(v, teachF ? `<span class="ba">${Math.round(lastF.before)} → ${Math.round(lastF.after)}</span><small>owed</small>` : `${Math.round(live.owed)}<small>owed</small>`);
    el.classList.toggle('jump', !!(jump && S.mode === 'pure'));
    $('.t', el).style.width = dotOn ? Math.min(100, live.owed / 1.6) + '%' : '0';
  }
  for (const el of $$('[data-live="fx-slow"]', fr)) {
    setCls(el, 'off', !slowOn); el.toggleAttribute('data-fact', slowOn); if (slowOn) el.setAttribute('data-fact', 'badge');
    el.style.setProperty('--src', slowOn ? '#8fb8ff' : 'transparent');
    $('.t', el).style.width = slowOn ? ((live.slowUntil - t) / SWING_MS) * 100 + '%' : '0';
  }
  for (const el of $$('[data-live="fx-hold"]', fr)) {
    setCls(el, 'off', !holdOn); el.toggleAttribute('data-fact', holdOn); if (holdOn) el.setAttribute('data-fact', 'badge');
    el.style.setProperty('--src', holdOn ? COMP_ROOT.payloadColor : 'transparent');
    if (holdOn) setText($('.v', el), ((live.rootUntil - t) / 1000).toFixed(1) + ' s');
    $('.t', el).style.width = holdOn ? ((live.rootUntil - t) / COMP_ROOT.payoff.durationMs) * 100 + '%' : '0';
  }
  // the spine's copies of the same three homes
  for (const el of $$('[data-live="sfx-dot"]', fr)) {
    setCls(el, 'off', !dotOn); el.toggleAttribute('data-fact', dotOn); if (dotOn) el.setAttribute('data-fact', 'badge');
    el.style.setProperty('--src', dotOn ? COMP_PURE.momentColor : 'transparent');
    if (dotOn) setText($('b', el), Math.round(teachF ? lastF.after : live.owed));
    el.classList.toggle('jump', !!(jump && S.mode === 'pure'));
  }
  for (const el of $$('[data-live="sfx-slow"]', fr)) {
    setCls(el, 'off', !slowOn); el.toggleAttribute('data-fact', slowOn); if (slowOn) el.setAttribute('data-fact', 'badge');
    $('.t', el).style.width = slowOn ? ((live.slowUntil - t) / SWING_MS) * 100 + '%' : '0';
  }
  for (const el of $$('[data-live="sfx-hold"]', fr)) {
    setCls(el, 'off', !holdOn); el.toggleAttribute('data-fact', holdOn); if (holdOn) el.setAttribute('data-fact', 'badge');
    if (holdOn) setText($('b', el), ((live.rootUntil - t) / 1000).toFixed(1));
    $('.t', el).style.width = holdOn ? ((live.rootUntil - t) / COMP_ROOT.payoff.durationMs) * 100 + '%' : '0';
  }

  /* PURSE: a kill pays the node's shard (amount per kill not in the export: [n]) */
  const node = ctxNode();
  const lastKill = combat && SIM.kills.length ? SIM.kills[SIM.kills.length - 1] : null;
  const gain = lastKill && t - lastKill.t >= 0 && t - lastKill.t < 1200;
  for (const el of $$(`[data-live="pc-${node.shard}"]`, fr)) {
    el.classList.toggle('gain', !!gain);
    const w = $('.pw', el);
    if (w) setText(w, gain ? '+[n]' : w.getAttribute('data-w'));
  }

  /* WORLD */
  paintWorld();
  /* GUIDE (scene 4 changes its line with the firing count) */
  if (S.scene === 4) {
    const key = SIM.n <= 1 ? 'r' : SIM.n === 2 ? 'g' : SIM.n === 3 ? 'c' : 'x';
    if (fr.__guideKey !== key) { fr.__guideKey = key; const g = $('[data-live="guide"]', fr); if (g) g.outerHTML = guideHTML(S.view === 'desktop' ? 'desktop' : 'portrait'); }
  }
  paintTether();
  paintArrival();
  paintFirst();
}

function bob(m, t) {
  // Normal squash; slowed: half the speed; rooted: frozen with a tremble.
  if (t < m.rootUntil) return { sy: 1, dx: Math.sin(t / 22) * 1.2 };
  const period = t < m.slowUntil ? 1700 : 850;
  return { sy: 1 + 0.06 * Math.sin((t / period) * Math.PI * 2 + (m.id === 'B' ? 1.7 : 0)), dx: 0 };
}
function paintWorld() {
  const fr = $('#frame');
  const world = $('[data-live="world"]', fr);
  if (!world) return;
  const g = worldGeom();
  const now = performance.now();
  const combat = inCombat();
  const t = combat ? SIM.t : now;
  const playerEl = $('[data-body="P"]', world);
  // player
  if (playerEl) {
    const hurt = combat && SIM.pHits.some(h => t - h.t >= 0 && t - h.t < 150);
    const im = $('.im', playerEl);
    if (im) im.style.filter = hurt ? 'drop-shadow(0 0 6px #ff4a3a) brightness(1.25)' : 'none';
    let px = g.P[0];
    if (S.scene === 5) { const k = Math.min(1, (now - S.arrivedAt) / 900); px = g.P[0] - 90 * (1 - k); }
    playerEl.style.left = px + 'px';
    const hpo = $('.hpo i', playerEl); if (hpo) hpo.style.width = ((combat ? SIM.php : START_HP) / MAX_HP) * 100 + '%';
  }
  if (!combat) {
    for (const el of $$('.bd:not(.player)', world)) {
      const k = el.getAttribute('data-body');
      const ph = (k.charCodeAt(1) || 0) * 0.9;
      const sy = 1 + 0.05 * Math.sin(now / 850 * Math.PI * 2 + ph);
      const im = $('.im', el) || $('.blob', el);
      if (im) im.style.transform = `scaleY(${sy}) scaleX(${2 - sy})`;
    }
    $('[data-live="proj"]', world).style.opacity = 0;
    $('[data-live="dmgs"]', world).innerHTML = '';
    return;
  }
  const tgt = SIM.target();
  for (const m of SIM.mobs) {
    const el = $(`[data-body="${m.id}"]`, world);
    if (!el) continue;
    const base = m.id === 'A' ? g.A : g.B;
    const b = bob(m, t);
    const atk = SIM.pHits.find(h => h.id === m.id && t - h.t >= 0 && t - h.t < 220);
    const lunge = atk ? Math.sin(((t - atk.t) / 220) * Math.PI) * -14 : 0;
    const appear = Math.min(1, Math.max(0, (t - m.spawnAt) / 400));
    const fade = m.dead ? Math.max(0, 1 - (t - m.deadAt) / 600) : 1;
    el.style.left = base[0] + lunge + b.dx + 'px';
    el.style.top = base[1] + (m.dead ? (t - m.deadAt) / 30 : 0) + 'px';
    el.style.opacity = String(Math.min(appear, fade));
    const im = $('.im', el);
    const hit = SIM.hits.find(h => h.id === m.id && t - h.t >= 0 && t - h.t < 90);
    const poisonA = Math.min(1, m.owed / 90);
    const surge = t - m.surgeAt >= 0 && t - m.surgeAt < 900 ? 1 - (t - m.surgeAt) / 900 : 0;
    const rooted = t < m.rootUntil;
    if (im) {
      im.style.transform = `scaleY(${b.sy}) scaleX(${2 - b.sy})`;
      const glow = poisonA > 0 ? `drop-shadow(0 0 ${3 + poisonA * 7 + surge * 10}px rgba(155,229,100,${0.35 + poisonA * 0.4 + surge * 0.25}))` : '';
      im.style.filter = [hit ? 'brightness(1.45)' : '', glow, rooted ? 'saturate(.55) hue-rotate(40deg) brightness(.9)' : ''].join(' ').trim() || 'none';
    }
    $('.pud', el).style.opacity = String(Math.min(1, poisonA * 0.9 + surge));
    $('.pud', el).style.transform = `scale(${0.7 + poisonA * 0.5 + surge * 0.6})`;
    $('.slw', el).style.opacity = t < m.slowUntil ? '1' : '0';
    $('.tgr', el).style.opacity = tgt && tgt.id === m.id ? '1' : '0';
    $('.rt', el).style.opacity = rooted ? '1' : '0';
    const pinK = t - m.rootAt >= 0 && t - m.rootAt < 500 ? (t - m.rootAt) / 500 : -1;
    const pin = $('.pin', el);
    pin.style.opacity = pinK >= 0 ? String(1 - pinK) : '0';
    pin.style.transform = pinK >= 0 ? `scale(${1.6 - pinK * 0.7})` : 'scale(1)';
    const sg = $('.sg', el);
    sg.style.opacity = surge > 0 ? String(surge) : '0';
    sg.style.transform = `scale(${0.45 + (1 - surge) * 1.5})`;
    // the re-dose: droplets thrown up out of the body
    const drops = $('.drops', el);
    const gy = $('.gy', el);
    gy.style.opacity = surge > 0.45 ? String((surge - 0.45) / 0.55) : '0';
    gy.style.transform = `scaleY(${0.4 + (1 - surge) * 1.2})`;
    if (surge > 0) {
      const k = 1 - surge;
      drops.innerHTML = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => {
        const ang = -Math.PI / 2 + (i - 4) * 0.36;
        const r = 10 + k * 62;
        const x = 56 + Math.cos(ang) * r, y = 52 + Math.sin(ang) * r + k * k * 70;
        return `<i style="left:${x}px;top:${y}px;opacity:${Math.min(1, surge * 1.4)}"></i>`;
      }).join('');
    } else if (poisonA > 0 && !m.dead) {
      const k = (t % 900) / 900;
      drops.innerHTML = `<i style="left:${50 + (m.id === 'A' ? -6 : 8)}px;top:${46 + k * 30}px;opacity:${(1 - k) * poisonA};transform:scale(.6)"></i>`;
    } else drops.innerHTML = '';
    const hpo = $('.hpo i', el); if (hpo) hpo.style.width = Math.max(0, m.hp / m.max) * 100 + '%';
  }
  // the thrown blade, just before each swing lands
  const proj = $('[data-live="proj"]', world);
  const until = SIM.nextSwing - t;
  if (tgt && until >= 0 && until < 150 && SIM.respawnAt == null) {
    const k = 1 - until / 150;
    const base = tgt.id === 'A' ? g.A : g.B;
    const x0 = g.P[0] + 18, y0 = g.P[1] - g.size * 0.55, x1 = base[0] - 6, y1 = base[1] - g.size * 0.35;
    const ang = Math.atan2(y1 - y0, x1 - x0);
    proj.style.opacity = '1';
    proj.style.left = x0 + (x1 - x0) * k - 9 + 'px';
    proj.style.top = y0 + (y1 - y0) * k + 'px';
    proj.style.transform = `rotate(${ang}rad)`;
  } else proj.style.opacity = '0';
  // small damage numbers (the shell's)
  const dm = [];
  for (const h of SIM.hits) { const age = t - h.t; if (age >= 0 && age < 650) { const base = h.id === 'A' ? g.A : g.B; dm.push(`<div class="dm" style="left:${base[0] + 14}px;top:${base[1] - g.size - 4 - age / 25}px;opacity:${1 - age / 650}">${h.v}</div>`); } }
  for (const h of SIM.ticks) { const age = t - h.t; if (age >= 0 && age < 800) { const base = h.id === 'A' ? g.A : g.B; dm.push(`<div class="dm pz" style="left:${base[0] - 16}px;top:${base[1] - g.size + 10 - age / 30}px;opacity:${1 - age / 800}">${Math.round(h.v)}</div>`); } }
  for (const h of SIM.pHits) { const age = t - h.t; if (age >= 0 && age < 700) dm.push(`<div class="dm ph" style="left:${g.P[0] - 10}px;top:${g.P[1] - g.size - 2 - age / 28}px;opacity:${1 - age / 700}">-${h.v}</div>`); }
  $('[data-live="dmgs"]', world).innerHTML = dm.join('');
}

/* Scene 4 teaching: a tether from the verb's clock to the body it just changed. */
function paintTether() {
  const fr = $('#frame');
  const svg = $('[data-live="tether"]', fr);
  if (!svg) return;
  svg.setAttribute('viewBox', `0 0 ${FW()} ${FH()}`);
  const f = SIM.lastFiring();
  const age = f ? SIM.t - f.t : 1e9;
  if (S.scene !== 4 || !f || f.n > 3 || age < 0 || age > 1500 || (S.view === 'portrait' && S.drawer)) { if (svg.__on) { svg.innerHTML = ''; svg.__on = false; } return; }
  const from = $$('[data-live="ring"]', fr).filter(visible)[0];
  const body = $(`[data-body="${f.id}"] .im`, fr) || $(`[data-body="${f.id}"] .blob`, fr);
  if (!from || !body) return;
  const a = rel(from), b = rel(body);
  const leftward = b.x + b.w / 2 < a.x;            // portrait: the spine sits right of the fight
  const x0 = leftward ? a.x - 2 : a.x + a.w + 2, y0 = a.y + a.h / 2, x1 = b.x + b.w / 2, y1 = b.y + b.h * 0.62;
  const k = Math.min(1, age / 350), fade = age > 1100 ? 1 - (age - 1100) / 400 : 1;
  const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - 60;
  svg.innerHTML = `<path d="M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}" fill="none" stroke="#f0cf7a" stroke-width="2.5" stroke-dasharray="6 5" pathLength="100" style="stroke-dasharray:${k * 100} 100;opacity:${fade}" />
    <circle cx="${x1}" cy="${y1}" r="${10 + k * 8}" fill="none" stroke="#f0cf7a" stroke-width="2" opacity="${fade * k}"/>`;
  svg.__on = true;
}
function rel(el) {
  const fr = $('#frame').getBoundingClientRect(), r = el.getBoundingClientRect(), s = scale;
  return { x: (r.left - fr.left) / s, y: (r.top - fr.top) / s, w: r.width / s, h: r.height / s };
}

/* Scene 5: the banner holds per arrival kind, then fades (the client's timing). */
function paintArrival() {
  const el = $('[data-live="arrival"]', $('#frame'));
  if (!el) return;
  const dur = +el.getAttribute('data-dur');
  const age = performance.now() - S.arrivedAt;
  const k = age / dur;
  const op = k < 0 ? 0 : k < 0.1 ? k / 0.1 : k < 0.76 ? 1 : k < 1 ? 1 - (k - 0.76) / 0.24 : 0;
  el.style.opacity = String(op);
  el.style.visibility = op > 0.02 ? 'visible' : 'hidden';
}

/* First-time: three numbered markers, everything else dimmed. */
function paintFirst() {
  const svg = $('[data-live="ovl"]', $('#frame'));
  if (!svg) return;
  if (!S.first) { if (svg.__on) { svg.innerHTML = ''; svg.__on = false; } return; }
  const W = FW(), H = FH();
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const targets = firstTargets();
  const holes = [], marks = [];
  targets.forEach((el, i) => {
    if (!el || !visible(el)) return;
    const r = rel(el);
    const pad = 4;
    const x = Math.max(1, r.x - pad), y = Math.max(1, r.y - pad), w = Math.min(W - x - 1, r.w + pad * 2), h = Math.min(H - y - 1, r.h + pad * 2);
    holes.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#000"/>`);
    const mx = Math.min(W - 16, Math.max(16, x - 2)), my = Math.min(H - 16, Math.max(16, y - 2));
    marks.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="none" stroke="#f0cf7a" stroke-width="2"/>
      <circle cx="${mx}" cy="${my}" r="14" fill="#f0cf7a" stroke="#1b160d" stroke-width="2"/><text x="${mx}" y="${my + 5}" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-weight="700" font-size="16" fill="#1b160d">${i + 1}</text>`);
  });
  svg.innerHTML = `<defs><mask id="fm"><rect width="${W}" height="${H}" fill="#fff"/>${holes.join('')}</mask></defs>
    <rect width="${W}" height="${H}" fill="rgba(4,3,2,.74)" mask="url(#fm)"/>${marks.join('')}`;
  svg.__on = true;
}

/* ── Toasts ─────────────────────────────────────────────────────────────────── */
function showToast(text, kind) { toast = { text, kind: kind || 'ok', at: performance.now() }; renderToast(); }
function renderToast() {
  const fr = $('#frame');
  const onPage = S.open === 'page';
  const el = onPage ? $('[data-live="pgtoast"]', fr) : $('[data-live="toastline"]', fr);
  for (const other of $$('[data-live="pgtoast"],[data-live="toastline"]', fr)) if (other !== el) other.classList.remove('show');
  if (!el) return;
  const alive = toast && performance.now() - toast.at < 2800;
  el.className = (onPage ? 'pg-toast' : 'toastline') + (alive ? ' show' : '') + (alive && toast.kind !== 'ok' ? ' ' + toast.kind : '');
  if (alive) { el.textContent = toast.text; el.setAttribute('data-fact', 'toast'); } else el.removeAttribute('data-fact');
}

/* =============================================================================
   INTERACTION
   ========================================================================== */
function act(name, el) {
  switch (name) {
    case 'open-gear': S.open = S.open === 'gear' ? 'none' : 'gear'; build(); break;
    case 'open-page': S.open = 'page'; S.drawer = false; if (S.scene !== 1 && S.scene !== 2) { S.open = 'none'; protoNote('In this scene the page is scene 2; use the scene switcher.'); return; } build(); break;
    case 'close': S.open = 'none'; S.hoverLean = null; S.previewLean = null; build(); break;
    case 'drawer-open': if (S.view === 'portrait') setDrawer(true); break;
    case 'drawer-close': setDrawer(false); break;
    case 'preview': { const id = el.getAttribute('data-lean'); S.previewLean = S.previewLean === id ? null : id; applyPreview(S.previewLean); break; }
    case 'press': pressCard(el.getAttribute('data-card')); break;
  }
}
function pressCard(id) {
  const pg = ctxPage();
  const card = cardOf(pg, id);
  if (!card) return;
  if (card.action === 'toast' && card.reason) { showToast(card.reason, 'warn'); return; }
  if (card.state === 'buy' && id === ITW_ID) {
    S.bought = true; S.justFilled = true; S.hoverLean = null; S.previewLean = null;
    build();
    showToast(DS.toasts.buyVerb, 'ok');
    return;
  }
  if (card.state === 'buy') { protoNote('Prototype: only Into the Wound’s purchase is wired (SCENES.md). Hover or preview this lean instead.'); return; }
}
function setDrawer(open) {
  S.drawer = open;
  const fr = $('#frame');
  const dr = $('[data-live="drawer"]', fr), tap = $('.mtap', fr);
  if (dr) dr.classList.toggle('open', open);
  if (tap) tap.style.display = open ? 'block' : 'none';
  renderBar();
}
function protoNote(text) { toast = { text, kind: 'proto', at: performance.now() }; renderToast(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !$('#frame').contains(t)) return;
  e.stopPropagation();
  const name = t.getAttribute('data-act');
  if (name === 'preview') { e.preventDefault(); act('preview', t); return; }
  act(name, t);
});
document.addEventListener('mouseover', e => {
  if (S.view !== 'desktop' || S.open !== 'page' || S.embed) return;
  const row = e.target.closest && e.target.closest('.row[data-lean]');
  const id = row ? row.getAttribute('data-lean') : null;
  if (id !== S.hoverLean) { S.hoverLean = id; applyPreview(id); }
});

/* =============================================================================
   SCENE CONTROLS, HASH, SCALE, LOOP, EMBED DIRECTOR
   ========================================================================== */
const SCENES = [
  [1, 'Finding the tree'], [2, 'The weapon page'], [3, 'A fight'], [4, 'First firings'], [5, 'The node'],
];
function enterScene() {
  S.open = S.scene === 2 ? 'page' : 'none';
  S.bought = false; S.hoverLean = null; S.previewLean = null; S.drawer = false; toast = null;
  simPlaying = false; simStopAt = Infinity;
  if (S.scene === 3) { SIM.reset(S.mode); }
  if (S.scene === 4) { S.mode = 'pure'; SIM.reset('pure'); }
  if (S.scene === 5) { S.node = HOME_NODE; S.arrivedAt = performance.now(); }
  director.start();
  build(); renderBar(); renderAside();
}
function readHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const sc = Math.min(5, Math.max(1, parseInt(h.get('scene') || '1', 10) || 1));
  const view = h.get('view') === 'portrait' ? 'portrait' : 'desktop';
  const first = h.get('first') === '1';
  const embed = h.get('embed') === '1';
  const sceneChanged = sc !== S.scene || embed !== S.embed || !readHash.done;
  const viewChanged = view !== S.view;
  S.scene = sc; S.view = view; S.first = first; S.embed = embed;
  document.body.classList.toggle('embed', embed);
  readHash.done = true;
  if (sceneChanged || viewChanged) enterScene(); else { build(); renderBar(); renderAside(); }
}
function setHash(patch) {
  const cur = { scene: S.scene, view: S.view, first: S.first ? 1 : 0, embed: S.embed ? 1 : 0, ...patch };
  location.hash = `scene=${cur.scene}&view=${cur.view}&first=${cur.first}&embed=${cur.embed}`;
}
window.addEventListener('hashchange', readHash);

function renderBar() {
  const bar = $('#bar');
  const sceneBtns = SCENES.map(([n, label]) => `<button class="tb${S.scene === n ? ' on' : ''}" data-bar="scene" data-v="${n}">${n} · ${label}</button>`).join('');
  let ctl = '';
  if (S.scene === 1) ctl = `<button class="tb solo" data-bar="reset">Reset</button><span class="ctl-note">Press Gear, then the Poison Dagger.</span>`;
  if (S.scene === 2) ctl = `<button class="tb solo" data-bar="reset">Reset page</button><span class="ctl-note">${S.view === 'desktop' ? 'Hover a lean; press a card.' : 'Tap ◉ Preview on a lean; tap a card.'}</span>`;
  if (S.scene === 3) ctl = `<div class="grp"><button class="tb${S.mode === 'pure' ? ' on' : ''}" data-bar="mode" data-v="pure">Pure pair</button><button class="tb${S.mode === 'composed' ? ' on' : ''}" data-bar="mode" data-v="composed">Composed pair</button></div>
    <button class="tb solo" data-bar="hit">Land a hit</button><button class="tb solo${S.auto ? ' on' : ''}" data-bar="auto">${S.auto ? '❚❚ Pause' : '▶ Auto-play'}</button>
    <div class="grp"><button class="tb" data-bar="kf" data-v="coming">Coming</button><button class="tb" data-bar="kf" data-v="landed">Landed</button><button class="tb" data-bar="kf" data-v="lasting">Lasting</button></div>`;
  if (S.scene === 4) ctl = `<button class="tb solo" data-bar="fire">Fire again</button><span class="ctl-count" data-live-bar="count">Firing #${SIM.n}</span><span class="ctl-note" data-live-bar="teach">${SIM.n === 0 ? 'bought, never fired' : SIM.n <= 3 ? 'teaching ' + SIM.n + ' of 3' : 'teaching over'}</span><button class="tb solo" data-bar="reset">Reset</button>`;
  if (S.scene === 5) ctl = `<button class="tb solo" data-bar="arrive">Arrive</button><div class="grp">${NODE_PICK.map(id => `<button class="tb${S.node === id ? ' on' : ''}" data-bar="node" data-v="${id}">${esc(NODE[id].displayName)}</button>`).join('')}</div>`;
  if (S.view === 'portrait' && S.scene !== 2) ctl += `<button class="tb solo${S.drawer ? ' on' : ''}" data-bar="drawer">${S.drawer ? 'Close drawer' : 'Open drawer'}</button>`;
  bar.innerHTML = `<div class="brand"><b>D</b>The dense sidebar</div>
    <div class="grp">${sceneBtns}</div>
    <div class="grp"><button class="tb${S.view === 'desktop' ? ' on' : ''}" data-bar="view" data-v="desktop">Desktop</button><button class="tb${S.view === 'portrait' ? ' on' : ''}" data-bar="view" data-v="portrait">Portrait</button></div>
    <button class="tb solo${S.first ? ' on' : ''}" data-bar="first">First-time</button>
    <button class="tb solo${S.grid ? ' on' : ''}" data-bar="grid" title="Outline the column's fixed slots">Slots</button>
    ${ctl}`;
}
$('#bar').addEventListener('click', e => {
  const b = e.target.closest('[data-bar]');
  if (!b) return;
  const k = b.getAttribute('data-bar'), v = b.getAttribute('data-v');
  if (k === 'scene') return setHash({ scene: +v });
  if (k === 'view') return setHash({ view: v });
  if (k === 'first') return setHash({ first: S.first ? 0 : 1 });
  if (k === 'grid') { S.grid = !S.grid; build(); renderBar(); return; }
  if (k === 'reset') { enterScene(); return; }
  if (k === 'drawer') { setDrawer(!S.drawer); return; }
  if (k === 'mode') { S.mode = v; SIM.reset(v); simPlaying = S.auto; simStopAt = Infinity; build(); renderBar(); renderAside(); return; }
  if (k === 'hit') { S.auto = false; playUntil(nextSwingTime() + 260); renderBar(); return; }
  if (k === 'auto') { S.auto = !S.auto; simPlaying = S.auto; simStopAt = Infinity; renderBar(); return; }
  if (k === 'kf') { S.auto = false; jumpKey(v); renderBar(); return; }
  if (k === 'fire') { fireAgain(); return; }
  if (k === 'arrive') { arrive(S.node); return; }
  if (k === 'node') { arrive(v); return; }
});

function nextSwingTime() { if (SIM.respawnAt != null) return SIM.respawnAt + 300; return SIM.nextSwing; }
function playUntil(T) { simPlaying = true; simStopAt = T; }
/* Key frames: re-simulate from zero (deterministic) to the exact moment. */
function keyTimes(mode) {
  SIM.reset(mode); SIM.advanceTo(12000);
  const f2 = SIM.firings[1];
  return { coming: f2.t - 500, landed: f2.t + 250, lasting: f2.t + 1000 };
}
function jumpKey(k, mode) {
  if (mode) S.mode = mode;
  const kt = keyTimes(mode || S.mode);
  SIM.reset(mode || S.mode); SIM.advanceTo(kt[k]);
  simPlaying = false; simStopAt = Infinity;
  build();
}
/* Scene 4: run quickly to just before the next firing, then play it in real time. */
function fireAgain() {
  const target = SIM.n + 1;
  const probe = Object.create(SIM);            // the fight is deterministic: replay it from zero
  probe.reset(SIM.mode);
  let tt = 0;
  while (probe.n < target && tt < SIM.t + 60000) { tt += 100; probe.advanceTo(tt); }
  const ft = probe.firings.find(f => f.n === target);
  if (!ft) return;
  SIM.advanceTo(Math.max(SIM.t, ft.t - 450));
  playUntil(ft.t + 1500);
  renderBar(); build();
}
function arrive(id) { S.node = id; S.arrivedAt = performance.now(); build(); renderBar(); renderAside(); flashHere(); }
function flashHere() {
  for (const el of $$('[data-live="here"]', $('#frame'))) { el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh'); }
  const sp = $('.spine', $('#frame')); if (sp) { sp.classList.remove('fresh'); void sp.offsetWidth; sp.classList.add('fresh'); }
}

/* Embed: each scene plays its own interaction on a loop. */
const director = {
  steps: null, t0: 0, idx: 0, loop: 0,
  start() {
    this.steps = null;
    if (!S.embed) return;
    const p = S.view === 'portrait';
    const sc = S.scene;
    const hover = (sel, on) => { const el = $(sel, $('#frame')); if (el) el.classList.toggle('hover', on); };
    const press = sel => { const el = $(sel, $('#frame')); if (el) { el.classList.add('press'); setTimeout(() => el.classList.remove('press'), 180); } };
    if (sc === 1) this.steps = [
      [0, () => { S.open = 'none'; S.bought = false; build(); }],
      [1700, () => press('[data-act="open-gear"]')],
      [1900, () => act('open-gear')],
      [3400, () => hover('.gitem.weapon', true)],
      [4300, () => { S.open = 'page'; build(); }],
      [8800, null]];
    if (sc === 2) this.steps = [
      [0, () => { S.open = 'page'; S.bought = false; S.hoverLean = null; S.previewLean = null; toast = null; build(); }],
      [1500, () => { if (p) { S.previewLean = 'dagger-t1-control-stat'; } else S.hoverLean = 'dagger-t1-control-stat'; applyPreview('dagger-t1-control-stat'); }],
      [4000, () => { if (p) { S.previewLean = 'dagger-t1-kill-chain-stat'; } else S.hoverLean = 'dagger-t1-kill-chain-stat'; applyPreview('dagger-t1-kill-chain-stat'); }],
      [6300, () => { S.hoverLean = null; S.previewLean = null; applyPreview(null); }],
      [6900, () => pressCard('dagger-t1-kill-chain-stat')],
      [9600, () => pressCard(ITW_ID)],
      [14000, null]];
    if (sc === 3) this.steps = [
      [0, () => { S.mode = (this.loop % 2 === 0) ? 'pure' : 'composed'; SIM.reset(S.mode); simPlaying = true; simStopAt = Infinity; build(); }],
      [9600, null]];
    if (sc === 4) this.steps = [
      [0, () => { SIM.reset('pure'); simPlaying = false; build(); }],
      [1600, () => { simPlaying = true; simStopAt = 18500; }],
      [21000, null]];
    if (sc === 5) this.steps = p ? [
      [0, () => arrive(NODE_PICK[0])],
      [5200, () => setDrawer(true)],
      [7600, () => setDrawer(false)],
      [8000, () => arrive(NODE_PICK[1])],
      [11800, () => arrive(NODE_PICK[2])],
      [15600, null]] : [
      [0, () => arrive(NODE_PICK[0])],
      [6200, () => arrive(NODE_PICK[1])],
      [10400, () => arrive(NODE_PICK[2])],
      [14600, null]];
    this.t0 = performance.now(); this.idx = 0; this.loop = 0;
  },
  tick(now) {
    if (!this.steps) return;
    const el = now - this.t0;
    while (this.idx < this.steps.length && el >= this.steps[this.idx][0]) {
      const fn = this.steps[this.idx][1];
      if (!fn) { this.loop++; this.t0 = now; this.idx = 0; return; }
      fn(); this.idx++;
    }
  },
};

/* Scale the fixed-size frame to fit, never reflowing it. */
let scale = 1;
function fit() {
  const st = $('#stage');
  const pad = S.embed ? 0 : 24;
  const W = FW(), H = FH();
  const aw = st.clientWidth - pad, ah = st.clientHeight - pad;
  scale = Math.max(0.1, Math.min(aw / W, ah / H, S.embed ? 4 : 1.5));
  const fr = $('#frame');
  fr.style.width = W + 'px'; fr.style.height = H + 'px';
  fr.style.transform = `scale(${scale})`;
  const wrap = $('#frameWrap');
  wrap.style.width = W * scale + 'px'; wrap.style.height = H * scale + 'px';
}
window.addEventListener('resize', () => { fit(); });

/* The aside: what to look at, the column's order, and two live meters. */
function renderAside() {
  const q = {
    1: ['Where does the player go to see their cards?', 'Out of combat. The cards are already in view: section II of the left column always shows the active lean and the verb slot (empty until bought). The Gear entry in the menu lists the worn items, weapon first; the three plain items say so and lead nowhere. The Poison Dagger opens its page. The column’s own <span class="k">Page ›</span> is a second door.'],
    2: ['What does the page say about the Poison Dagger at Tier 1?', 'The page is the same row grammar as the column: lane bar, name, sentence, cost, state. Hover a lean (desktop) or tap ◉ Preview (portrait): the sheet shows before → after and each verb re-reads with that lean in two colours. Buy Into the Wound and watch its row in the column fill without moving anything. Counts are not repeated on the page: they live in the Purse, left.'],
    3: ['Coming, landed, lasting: where do the three facts live?', 'Coming: the clock at the right of the Verb row (II). Landed: the body (the poison surges / the ooze is pinned) and the row flashes. Lasting: the Target section (III), three fixed homes: what it owes, how it is slowed, how it is held. Switch to the composed pair to see the two-colour sentence in the Verb row.'],
    4: ['What teaches the player, and when does it stop?', 'For the first three firings of a newly bought card: the Verb row is ringed, a tether runs from its clock to the body it changed, the Poison home shows before → after, and the guide reads the lesson. From firing #4 the column just keeps its state. Nothing in the column moves to teach.'],
    5: ['Before the first kill: which family lives here, what does it pay?', 'The banner names the territory and the shard for a few seconds; section IV keeps the same words for as long as you stay, with the roster and its real shares beneath, and the Purse marks the shard this node pays. Try Sunkroot Bog (34/33/33) for the every-node-fields-everything problem.'],
  }[S.scene];
  $('#aside').innerHTML = `<h2>D · The dense sidebar</h2>
    <p>A classic MMO side column, always on screen on desktop, a drawer on the phone. Five sections in a fixed order with fixed row heights: the eye learns where each fact lives because nothing ever moves.</p>
    <h3>The column, top to bottom</h3>
    <ol><li><b>You</b> · health, the thing you watch most.</li><li><b>Weapon</b> · the lean, then the verb with its clock.</li><li><b>Target</b> · three homes: owes, slowed, held.</li><li><b>Here</b> · the node, its territory, its shard.</li><li><b>Purse</b> · what you hold; this node’s shard marked.</li></ol>
    <p><small>Read it as a sentence: you, wielding this, do that to it, here, for this.</small></p>
    <h3>Scene ${S.scene}</h3>
    <p class="q">${q[0]}</p><p>${q[1]}</p>
    ${S.view === 'portrait' ? '<p><span class="k">On the phone</span> the column is a drawer. Closed, a 46 px spine on the right edge keeps the same order, one glyph per fact: weapon (lean colour, verb clock), target (three homes), here (the shard), purse (this node’s shard). The words are gone until you tap the spine.</p>' : ''}
    <h3>Meters</h3>
    <div class="meter"><span>Card facts on screen</span><b id="mFacts">0</b></div>
    <div class="meter"><span>Card cells that changed in the last second</span><b id="mMoved">0</b></div>
    <p style="margin-top:8px"><small>The combat numbers follow SCENES.md’s illustrative rule, not the server’s DoT formula. “Slots” outlines the column’s fixed homes.</small></p>`;
}

/* Fact counter: every visible, uncovered element tagged data-fact. */
function countFacts() {
  const fr = $('#frame');
  fr.classList.add('counting');
  try { return countFactsInner(fr); } finally { fr.classList.remove('counting'); }
}
function countFactsInner(fr) {
  const out = { total: 0, byKind: {}, list: [] };
  for (const el of $$('[data-fact]', fr)) {
    if (!visible(el)) continue;
    const r = el.getBoundingClientRect();
    const pts = [[r.left + r.width / 2, r.top + r.height / 2], [r.left + 3, r.top + 3], [r.right - 3, r.bottom - 3]];
    const seen = pts.some(([x, y]) => { const top = document.elementFromPoint(x, y); return top && (el === top || el.contains(top) || top.contains(el)); });
    if (!seen) continue;
    const k = el.getAttribute('data-fact');
    out.total++; out.byKind[k] = (out.byKind[k] || 0) + 1;
    out.list.push(k + ': ' + (el.getAttribute('title') && k === 'badge' ? '' : '') + el.textContent.replace(/\s+/g, ' ').trim().slice(0, 70));
  }
  return out;
}
/* Test hooks (used by the verification script; harmless in the page). */
function atFiring(n, offset) {
  SIM.reset(S.mode); let tt = 0;
  while (SIM.n < n && tt < 60000) { tt += 100; SIM.advanceTo(tt); }
  const f = SIM.firings.find(x => x.n === n);
  SIM.reset(S.mode); SIM.advanceTo(f.t + offset);
  simPlaying = false; simStopAt = Infinity; build(); renderBar();
  return f.t;
}
window.__proto = { S, SIM, countFacts, build, jumpKey, enterScene, fireAgain, arrive, act, pressCard, applyPreview, keyTimes, atFiring, director, setDrawer, renderBar };

let lastMeter = 0;
function loop(now) {
  const dt = Math.min(100, now - (lastWall || now));
  lastWall = now;
  director.tick(now);
  if (inCombat() && simPlaying) {
    let T = SIM.t + dt;
    if (T >= simStopAt) { T = simStopAt; simPlaying = S.auto; simStopAt = Infinity; }
    const nBefore = SIM.n;
    SIM.advanceTo(T);
    if (S.scene === 4 && SIM.n !== nBefore) renderBar();
  }
  if (toast && now - toast.at > 2800) { toast = null; renderToast(); }
  paint(false);
  if (now - lastMeter > 400 && !S.embed) {
    lastMeter = now;
    const mf = $('#mFacts'), mm = $('#mMoved');
    if (mf) mf.textContent = countFacts().total;
    if (mm) {
      let c = 0;
      for (const [el, at] of moved) {
        if (now - at >= 1000 || !el.isConnected) { moved.delete(el); continue; }
        const live = el.closest('[data-live]');
        const key = live ? live.getAttribute('data-live') : '';
        if (/^(php|phpbar|tghp|tgname|world|dmgs|guide)/.test(key)) continue;   // shell, not card cells
        if (visible(el)) c++;
      }
      mm.textContent = c;
    }
  }
  requestAnimationFrame(loop);
}

readHash();
requestAnimationFrame(loop);
</script>
</body>
